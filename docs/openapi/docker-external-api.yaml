        requestedEndDate:
          type: string
          format: date
          description: 匯率歷史查詢採用的結束日期。
        refreshIntervalSeconds:
          type: integer
          format: int32
          const: 2
          description: 輪詢或更新設定的秒數間隔。 可用值固定為 `2`。
        timezone:
          type: string
          const: Asia/Taipei
          description: 日期與時間字串採用的 IANA 時區。 可用值固定為 `Asia/Taipei`。
        liveUpdateStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - UNAVAILABLE
          description: 即期匯率更新的可用性狀態。 可用值固定為 `ACTIVE`、`INACTIVE`、`UNAVAILABLE`。
        spot:
          "$ref": "#/components/schemas/UsdTwdSpot"
          description: 目前 USD/TWD 即期匯率與來源時間。
        count:
          type: integer
          format: int32
