        '415': {description: Content-Type 缺失、語法錯誤或不是 application/json（type 與 subtype 不分大小寫、參數如 charset 忽略；不接受 +json 變體與萬用字元）；即使 body 為空也先回 415，code 為 UNSUPPORTED_MEDIA_TYPE。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/SrppCaptureProblem'}}}}
