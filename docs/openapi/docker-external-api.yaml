    UsdTwdResponse:
      type: object
      description: "`UsdTwdPublicDto.Response`。history 日期嚴格升冪、不可重複且介於 requestedStartDate..requestedEndDate（含首尾）；count == history.length。狀態組合：INACTIVE 僅 LAST_AVAILABLE；UNAVAILABLE 僅 HISTORY+STALE；ACTIVE 不得 LAST_AVAILABLE，LIVE 僅銀行來源、INDICATIVE 僅 YAHOO。"
      required: [pair, baseCurrency, quoteCurrency, requestedStartDate, requestedEndDate, refreshIntervalSeconds, timezone, liveUpdateStatus, spot, count, history]
      properties:
        pair: {type: string, const: USD/TWD}
        baseCurrency: {type: string, const: USD}
        quoteCurrency: {type: string, const: TWD}
        requestedStartDate: {type: string, format: date}
        requestedEndDate: {type: string, format: date}
        refreshIntervalSeconds: {type: integer, format: int32, const: 2}
        timezone: {type: string, const: Asia/Taipei}
        liveUpdateStatus: {type: string, enum: [ACTIVE, INACTIVE, UNAVAILABLE]}
        spot: {$ref: '#/components/schemas/UsdTwdSpot'}
        count: {type: integer, format: int32, minimum: 1, description: 必須等於 history 的項目數。}
        history:
          type: array
          minItems: 1
          description: 日期升冪、無重複且落在 requested range 內。
          items: {$ref: '#/components/schemas/UsdTwdHistoryPoint'}
      additionalProperties: false
    UsdTwdSpot:
      type: object
      description: Timestamp 組合固定：HISTORY 的兩個 timestamp 都為 null；BANK_OF_TAIWAN 的 polledAt 必填而 sourceUpdatedAt 為 null；MEGA_BANK/YAHOO 兩者都必填且 sourceUpdatedAt 不得晚於 polledAt 120 秒。
      required: [date, buyRate, sellRate, midRate, source, polledAt, sourceUpdatedAt, quoteStatus]
      properties:
        date: {type: string, format: date}
        buyRate: {type: number, exclusiveMinimum: 0}
        sellRate: {type: number, exclusiveMinimum: 0, description: 必須大於等於 buyRate。}
        midRate: {type: number, exclusiveMinimum: 0, multipleOf: 0.0001, description: (buyRate+sellRate)/2，HALF_UP scale 4。}
        source: {type: string, enum: [BANK_OF_TAIWAN, MEGA_BANK, YAHOO, HISTORY]}
        polledAt: {type: [string, 'null'], format: date-time}
        sourceUpdatedAt: {type: [string, 'null'], format: date-time}
        quoteStatus: {type: string, enum: [LIVE, INDICATIVE, STALE, LAST_AVAILABLE]}
      oneOf:
        - properties:
            source: {const: HISTORY}
            polledAt: {type: 'null'}
            sourceUpdatedAt: {type: 'null'}
        - properties:
            source: {const: BANK_OF_TAIWAN}
            polledAt: {type: string, format: date-time}
            sourceUpdatedAt: {type: 'null'}
        - properties:
            source: {enum: [MEGA_BANK, YAHOO]}
            polledAt: {type: string, format: date-time}
            sourceUpdatedAt: {type: string, format: date-time}
      additionalProperties: false
    UsdTwdHistoryPoint:
      type: object
      required: [date, buyRate, sellRate, midRate]
      properties:
        date: {type: string, format: date}
        buyRate: {type: number, exclusiveMinimum: 0}
        sellRate: {type: number, exclusiveMinimum: 0, description: 必須大於等於 buyRate。}
        midRate: {type: number, exclusiveMinimum: 0, multipleOf: 0.0001, description: (buyRate+sellRate)/2，HALF_UP scale 4。}
      additionalProperties: false
