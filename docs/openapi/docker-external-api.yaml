  /api/public/trading-radar/today:
    get:
      tags: [公開交易雷達]
      operationId: getPublicTradingRadarTodayList
      summary: 取得今日交易雷達第一屏收合列
      description: |
        純唯讀、零副作用。不帶 `email` 時 owner 為 business 唯一解析的 configured admin；
        帶合法 `email` 時 owner 改由該帳號決定（仍不接受 `ownerId`、cookie、匿名 caller 的
        `X-User-*` 或 Tailscale identity 作為額外的租戶選擇輸入）。BFF 顯式傳遞已解析 owner 的
        tenant headers，並清除 Reactor 內可能存在的登入者／代看身分。

        本路徑每次只呼叫一次 business 的 current read，再投影第一屏的全域欄位與每檔收合列；
        不回傳 reasons、evidence、完整 fundamental 或 K 棒展開樹。它不會 refresh、export、
        發通知，也不會寫入交易雷達 snapshot、Redis 或 DB。要展開某一列時，改呼叫精確的
        `/api/public/trading-radar/stock?stockCode=&market=`；detail 只會從本日 current result
        中尋找該精確 market/code，絕不重新整理或讀取舊快照。

        HTTP 層本身沒有應用層認證；只能經 `127.0.0.1:9090` loopback 或獲准的
        Tailscale 私網 identity 讀取，禁止 Funnel 或公網 listener。Swagger UI 與本 YAML
        都沒有掛在 9090。
        configured-admin 與 by-email owner lookup 均最多 5 秒；逾時取消查找，回該端點既有 503 ProblemDetail，不進入資料讀取。
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
            maxLength: 254
          description: >-
            選擇要查詢的帳號 email；省略時預設回傳 configured-admin（主要管理者）的資料。
            帶入時僅需該帳號存在且狀態為 ACTIVE，不需為 configured-admin。
            格式不合法回 400；查無帳號或帳號非 ACTIVE 回 503（與 configured-admin 不可用時相同的錯誤契約，
            刻意不區分「查無」與「停用」以避免此參數成為帳號列舉工具）。
          example: selected@example.invalid
      responses:
        '200':
          description: 第一屏全域資料與每檔收合列；stocks 可為空。
