      description: >-
        只接受一個已 URL-encoded 的 `stockCode` 與一個 `market`，兩者共同構成精確 selector，
        用以消除跨市場同代號歧義。BFF 先在本地驗證參數，通過後才以已解析 owner 身分（不帶 `email`
        時為 configured-admin；帶合法 `email` 時為該帳號）呼叫 business 一次 current read；
        `email` 格式驗證優先於 stockCode／market selector；email 合法或省略時，selector 的既有 400 契約不變。
        不快取、不重新整理、不寫 snapshot，且只回本日結果已存在的標的。不存在時固定回已消毒的
        404，不洩漏其他標的或 owner 資訊。
        configured-admin 與 by-email owner lookup 均最多 5 秒；逾時取消查找，回該端點既有 503 ProblemDetail，不進入資料讀取。
