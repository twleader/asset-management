            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Trading calendar downstream failure, status: 502, detail: 交易日曆暫時無法取得, instance: /api/public/trading-calendar}
            text/html:
