            Cache-Control: {description: 私有回應不得快取，固定 private, no-store。, schema: {type: string, const: 'private, no-store'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SrppCompletedTechnicalsResponse'}
              example:
                formulaVersion: SRPP_DAILY_OHLCV_V1
                market: 台股
                asOf: '2026-01-15'
                coverage: {requestedCount: 1, completeCount: 0, partialCount: 0, unavailableCount: 1}
                symbols:
                  - {stockCode: '0050', market: 台股, status: UNAVAILABLE, asOf: '2026-01-15', historyStart: null, sampleCount: 0, priceBasis: UNAVAILABLE, appliedEventDates: [], sourceSha256: null, indicators: null, missing: [AS_OF_BAR_MISSING]}
        '400':
          description: 參數缺漏、未知、重複，市場或日期不合格，日期未完成，或 stockCodes 非唯一／超過 40。
          content:
            application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}
        '405':
          description: "僅允許 GET，gateway 回 Allow: GET。"
          headers: {Allow: {description: 唯一允許的方法。, schema: {type: string, const: GET}}}
          content:
            text/html: {schema: {$ref: '#/components/schemas/NginxErrorHtml'}}
        '502':
          description: 上游服務失敗或回應身分不符合請求；gateway upstream failure 可能為 HTML。
          content:
            application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}
            text/html: {schema: {$ref: '#/components/schemas/NginxErrorHtml'}}
        '504': {$ref: '#/components/responses/NginxGatewayTimeout'}
      x-codex-route-policy: exact-read-only-get
  /api/srpp/daily-report-mail:
    post:
      tags: [SRPP 日報]
      operationId: sendSrppDailyReportMail
      summary: 安全寄送一封已驗證的 SRPP 日報
      description: 只接受服務 Bearer token；後端重算固定 HTML 與 plain 後比對 SHA-256，並只寄到設定的唯一收件人。請求大小上限為 1 MiB，成功結果可用 idempotencyKey 查詢。
      security: [{SrppDailyReportBearer: []}]
      requestBody:
        required: true
        description: 包含完整 facts 與 SRPP 端先算好的兩個雜湊的 JSON request；未知欄位可保留但不渲染。
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SrppDailyReportMailRequest'}
            example: {idempotencyKey: 'Codex-20261007-0905:core', profile: core, expectedHtmlSha256: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', expectedTextSha256: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', facts: {trading_date: '2026-10-07', slot: '09:05', consumer: Codex, generated_at: '2026-10-07T09:05:00+08:00', policy_bundle_sha256: 'abc', input_snapshot_sha256: 'def', decision_id: D1, conclusion: 已驗證, payload: {decision_id: D1, summary: [摘要], tables: []}}}
      responses:
        '200': {description: SMTP 已接受且已保存冪等快照。, content: {application/json: {schema: {$ref: '#/components/schemas/SrppDailyReportMailResponse'}, example: {status: SENT, messageId: '<example@localhost>', sentAt: '2026-10-07T01:05:00Z', from: 'tw.leader@gmail.com', to: ['shi.chihung@gmail.com'], subject: '[SRPP 每日持股市場交易建議-核心] (Codex) 2026-10-07 09:05', htmlSha256: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', textSha256: 'bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb', idempotentReplay: false}}}}
        '400': {description: facts、key 或 JSON 驗證失敗。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '401': {description: 缺少或不符服務 Bearer token。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '409': {description: hash 不符、鍵衝突、處理中或 SMTP 結果不明。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '413': {description: 本文超過 1 MiB gateway 上限。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '502': {description: SMTP 或上游失敗。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
        '503': {description: SMTP 身分或固定收件人設定不完整。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/ProblemDetail'}}}}
      x-codex-route-policy: service-token-post
  /api/public/srpp/event-evidence/capture:
    post:
      tags: [SRPP 事件證據]
      operationId: captureSrppEventEvidence
      summary: 驗證排程 LLM 的六項風險判讀引用並建立不可變事件證據收據
      description: |
        Requirement 181／Task 481（變體 A）：判讀者是 SRPP 排程的 LLM（Claude 或 Codex 兩軌各自獨立），request 帶六項國際政經
        風險的判讀分數與引用；伺服器**不**呼叫任何 LLM、不抓取外部網站、不觸發 crawler、不刷新快取、不呼叫券商，只做確定性的事：
        驗證引用、依 `SrppRiskRubricV1` 機械計分、保存不可變收據並回傳。結果永遠 `tradeAuthorization:false`、`placesOrders:false`。

        BFF 處理順序固定：415（Content-Type）→ 400（空 body、無法嚴格解析、重複 member、不是 object、`ownerEmail` 存在但不是合法
        email 字串；這些在 owner 解析前確定且零 outbound）→ 依 `ownerEmail` 解析 owner（缺省 configured-admin；有值時該帳號須
        ACTIVE；5 秒逾時；失敗一律 503 `OWNER_UNAVAILABLE` 且不揭露帳號是否存在）→ 帶 owner 身分轉送原始 bytes 給 business（10 秒
        逾時）→ 驗證 business 回應（不符或逾時 502 `UPSTREAM_INVALID`）。

        business 驗證順序（第一個失敗即回應，任何失敗都不寫入、不佔用識別）：request 結構與型別 400 → owner 503 → `tradingDate`
        必須是伺服器 Asia/Taipei 今天（否則 400）且台股日曆為交易日（未知 503 `CALENDAR_UNAVAILABLE`、休市 409 `NON_TRADING_DAY`）
        → 規則包已登錄（409 `POLICY_UNSUPPORTED`）→ 已發布 Swagger 身分（不可得 503 `CONTEXT_NOT_READY`、不同 409
        `SWAGGER_MISMATCH`）→ 以識別查詢既有 bundle（policy／swagger 不同 409 `BUNDLE_METADATA_MISMATCH`、正規化 request 雜湊不同
        409 `BUNDLE_CONTENT_CONFLICT`、相同則 200 回傳既有內容且**不重新查來源列**）→ 證據驗證（收集全部錯誤後一次 422
        `EVIDENCE_REJECTED`）→ 計分並保存（201）。

        識別＝owner＋`tradingDate`＋`slot`＋`analysisProfile`＋`consumer`＋`decisionId`；不同 consumer 或不同 decisionId（重跑）是
        各自獨立的 bundle，本 API 不強制一個時段只有一筆。正規化 request＝去除 `ownerEmail`、`analysisProfile` 缺省補 `TW_DAILY`、
        每類 `conflicting` 缺省補 false、`officialEvents` 缺省補 `[]`，所以缺省與明寫預設值的重送視為同一內容。並行送同一識別時
        以資料庫唯一鍵序列化，輸家在全新 transaction 重讀並回 200／409，不需要 202。

        引用驗證：`NEWS_HEADLINE` 以 `sha256(source|url|category)` 查 `news_headline.dedupe_key`，`fetched_at` 須不早於交易日往前
        3 個日曆日 00:00（Asia/Taipei）；一般 category 另比對正規化 title（NFKC、臺→台、空白折疊、trim）與截斷到秒的 publishedAt，
        固定 URL 且每輪就地覆寫的 category（預設 fx、us-market、kr-market、kr-intraday，可設定）只驗存在與新鮮度；通過者
        provenance `DB_VERIFIED`，只代表該列存在且在新鮮度視窗內，不代表與風險類別相關。`API_RESPONSE` 與 `OFFICIAL_PAGE` 只檢查
        允許清單與期間，伺服器不重抓外部網站，provenance 為 `ATTESTED`（呼叫端聲明，不是伺服器已驗證）。允許清單預設值只是初始值，
        上線前須由 Steven 確認。bundle 只保存引用指紋、來源種類、provenance、期間、分數與雜湊，不保存 request 原文、爬蟲內文、
        持股、現金或帳號。
      requestBody:
        required: true
        description: 嚴格 JSON object；未知欄位、重複 member、型別錯誤、缺必填或超過長度上限一律 400。`score`、`assessed`、`evidenceStatus`、`totalScore`、`assessedCount`、`riskMode`、`tradeAuthorization`、`refresh`、`force`、crawler 原文、LLM prompt／model 與任何交易指令都是未知欄位。最大組合以 ASCII 計小於 gateway 1 MiB 上限，超過時由 nginx 回 413（不屬本端點契約）。
