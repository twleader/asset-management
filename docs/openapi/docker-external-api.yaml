    UsdTwdResponse:
      type: object
      description: "`UsdTwdPublicDto.Response`。history 日期嚴格升冪、不可重複且介於 requestedStartDate..requestedEndDate（含首尾）；count
        == history.length。狀態組合：INACTIVE 僅 LAST_AVAILABLE；UNAVAILABLE 僅 HISTORY+STALE；ACTIVE
        不得 LAST_AVAILABLE，LIVE 僅銀行來源、INDICATIVE 僅 YAHOO。"
      required:
      - pair
      - baseCurrency
      - quoteCurrency
      - requestedStartDate
      - requestedEndDate
      - refreshIntervalSeconds
      - timezone
      - liveUpdateStatus
      - spot
      - count
      - history
      properties:
        pair:
          type: string
