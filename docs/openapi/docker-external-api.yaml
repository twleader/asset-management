                coverage: {status: COMPLETE, requestedCount: 1, successCount: 1, partialCount: 0, unavailableCount: 0}
                calculations: [{calculationId: ASSET_RECONCILIATION, status: COMPLETE, formulaVersion: '1.0', formulaSetSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb, data: {}, reasonCodes: [], sourceIds: [assets]}]
                contextContentSha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        '400': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '404': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '405':
          description: "僅允許 GET，gateway 回 Allow: GET。"
          headers: {Allow: {description: "唯一允許的方法。", schema: {type: string, const: GET}}}
          content:
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><body><h1>405 Not Allowed</h1></body></html>"
        '409': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '500': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '502':
          description: BFF 驗證上游失敗時為 RFC 9457 problem；Nginx upstream failure 可能為 HTML。
          content:
            application/problem+json: {schema: {$ref: '#/components/schemas/SrppOrchestratedProblem'}}
            text/html: {schema: {$ref: '#/components/schemas/NginxErrorHtml'}}
        '503': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '504': {$ref: '#/components/responses/NginxGatewayTimeout'}
      x-codex-route-policy: exact-read-only-get
