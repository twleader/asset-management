                description: 本欄單位常數 `TWD`：新台幣金額（已換算，不再乘匯率）。
            description: 限定本欄 unit 為 TWD。
          description: 快照存款總額（新台幣，EXACT）。
        snapshotStockValue:
          allOf:
          - "$ref": "#/components/schemas/SrppMetric"
            description: 共用 SrppMetric 結構（value、unit、quality、reasonCodes、sourceIds）。
          - properties:
              unit:
                const: TWD
                description: 本欄單位常數 `TWD`：新台幣金額（已換算，不再乘匯率）。
            description: 限定本欄 unit 為 TWD。
          description: 快照股票現值總額（新台幣，EXACT）。
        snapshotFundValue:
          allOf:
          - "$ref": "#/components/schemas/SrppMetric"
            description: 共用 SrppMetric 結構（value、unit、quality、reasonCodes、sourceIds）。
          - properties:
              unit:
                const: TWD
                description: 本欄單位常數 `TWD`：新台幣金額（已換算，不再乘匯率）。
            description: 限定本欄 unit 為 TWD。
          description: 快照基金現值總額（新台幣，EXACT）。
        snapshotTotalAssets:
          allOf:
          - "$ref": "#/components/schemas/SrppMetric"
            description: 共用 SrppMetric 結構（value、unit、quality、reasonCodes、sourceIds）。
          - properties:
              unit:
                const: TWD
                description: 本欄單位常數 `TWD`：新台幣金額（已換算，不再乘匯率）。
            description: 限定本欄 unit 為 TWD。
          description: 快照總資產（新台幣，EXACT）。
        liveStockValue:
          allOf:
          - "$ref": "#/components/schemas/SrppMetric"
            description: 共用 SrppMetric 結構（value、unit、quality、reasonCodes、sourceIds）。
          - properties:
              unit:
                const: TWD
                description: 本欄單位常數 `TWD`：新台幣金額（已換算，不再乘匯率）。
            description: 限定本欄 unit 為 TWD。
          description: 凍結當下以即時／目標交易時段價格估算的股票市值（新台幣，EXACT 相對於凍結來源；不代表行情時效）。
        liveTotalAssets:
          allOf:
          - "$ref": "#/components/schemas/SrppMetric"
            description: 共用 SrppMetric 結構（value、unit、quality、reasonCodes、sourceIds）。
          - properties:
              unit:
                const: TWD
                description: 本欄單位常數 `TWD`：新台幣金額（已換算，不再乘匯率）。
            description: 限定本欄 unit 為 TWD。
          description: 凍結當下的 live 總資產（新台幣）；也是 allocation 模組的分母。
        targetPriceComplete:
          type: boolean
