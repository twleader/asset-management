  /api/public/crawler-data/rescan:
    post:
      tags: [公開爬蟲]
      operationId: triggerPublicCrawlerRescan
      summary: 免登入觸發爬蟲重新搜尋
      description: |
        十二條路由中唯一有外部抓取副作用者（Requirement 71／Task 329），語意等同既有 ADMIN 端點
        「立即抓取並匯出」的匿名版本。由 business 端 30 秒全域 Redis 冷卻節流：冷卻窗口內回
        HTTP 200 但 `status=COOLDOWN`，不會真的觸發抓取。呼叫端必須看 `status` 而不是只看 200。
        本路徑只接受 POST；GET 等其他 method 回 `405` 並帶 `Allow: POST`。
      responses:
        '200':
          description: 觸發結果；所有情形（含冷卻中與失敗）都以 status 表達，不改用非 200。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlerRescanResponse'
              examples:
                cooldown:
                  summary: 冷卻窗口內，未真的觸發抓取
                  value: {status: COOLDOWN, mode: null, jsonPath: null, jsonSizeBytes: null, xlsxPath: null, xlsxSizeBytes: null, upserted: null, failed: null, exported: null, jsonGdrivePath: null, xlsxGdrivePath: null, gdriveStatus: null, message: 冷卻中，請 30 秒後再試}
        '405':
          description: "非 POST method；帶 `Allow: POST`。"
          headers:
            Allow:
              schema: {type: string, const: POST}
          content:
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
        '502':
          description: BFF 的 scoped advice 把 business 非 2xx 消毒成固定文案，或 Nginx 無法連上 upstream。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: {type: 'about:blank', title: Crawler rescan downstream failure, status: 502, detail: 重新搜尋觸發暫時失敗，請稍後再試, instance: /api/public/crawler-data/rescan}
            text/html:
              schema:
                $ref: '#/components/schemas/NginxErrorHtml'
              example: "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx</center></body></html>"
        '503':
          description: BFF 連不上 business（transport 失敗）；固定文案，不帶出下游訊息。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: {type: 'about:blank', title: Crawler rescan service unavailable, status: 503, detail: 重新搜尋服務暫時無法連線, instance: /api/public/crawler-data/rescan}
        '504':
          $ref: '#/components/responses/NginxGatewayTimeout'
