    TradingRadarResponse:
      type: object
      description: "`TradingRadarDto.Response` 的八個 required fixed record attribute response class；公開路徑與登入後畫面共用此 DTO。array child 的 item $ref、順序與可空性均由各 property schema 明定，內容是市場分析結果而非個人持倉或下單指令。"
      required: [ruleVersion, actionPolicyVersion, generatedAt, market, usMarket, stocks, skippedNonTwStocks, publicInformation]
      properties:
        ruleVersion: {type: string, description: required non-null string；產生本雷達結果的規則版本，供結果可追溯與比較。}
        actionPolicyVersion: {type: string, description: required non-null string；決定 action label 的政策版本，非使用者設定值。}
        generatedAt:
          type: string
          format: date-time
          description: required non-null RFC 3339 date-time；此 TradingRadarResponse 完成產生的服務時間。
        market:
          $ref: '#/components/schemas/MarketSummary'
          description: required non-null `MarketSummary` nested class；台股市場摘要，所有 required child 與 nullable semantics 由 referenced schema 定義。
        usMarket:
          $ref: '#/components/schemas/MarketSummary'
          description: required non-null `MarketSummary` nested class；美股市場摘要，所有 required child 與 nullable semantics 由 referenced schema 定義。
        stocks:
          type: array
          description: required non-null array of `StockDecision` items；本輪台股決策清單，保留 engine 輸出排序；空陣列代表本輪沒有可公開的台股 decision。
          items:
            $ref: '#/components/schemas/StockDecision'
            description: StockDecision item；一檔台股的完整決策 nested class，attribute purpose/type/nullability 由 referenced schema 定義。
        skippedNonTwStocks:
          type: integer
          format: int32
          minimum: 0
          description: required non-null int32 minimum 0；因本雷達不處理非台股而略過的標的筆數。
        publicInformation:
          type: array
          description: required non-null array of `PublicInformationItem` items；本輪可公開資訊，保留 producer 排序；空陣列表示無可公開項目。
          items:
            $ref: '#/components/schemas/PublicInformationItem'
            description: PublicInformationItem item；一筆公開資訊 nested class，attribute purpose/type/nullability 由 referenced schema 定義。
      additionalProperties: false
