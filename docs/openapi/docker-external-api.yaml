      summary: 取得指定帳號或預設主要管理者的唯讀交易紀錄
      description: >-
        不帶 `email` 時 owner 由 BFF configured-admin bootstrap 決定；帶合法 `email` 時 owner 改由該帳號
        決定（仍不接受 `ownerId`、帳戶、券商或其他身分 header 作為額外的租戶選擇輸入）。無 query 時回全部紀錄；
        可精確擇一提供 `year`，或成對提供 `start` 與 `end`。篩選與 `email` 各自獨立在 BFF 本地嚴格驗證，
        email 格式驗證優先於 filter；email 合法或省略時，filter 的既有 400 契約不變。錯誤不會觸發 bootstrap。
        此 API 不同步、匯出、寫入或計算個別成交推論；records 固定按
        `tradeDate DESC, id DESC`。
        configured-admin 與 by-email owner lookup 均最多 5 秒；逾時取消查找，回該端點既有 503 ProblemDetail，不進入資料讀取。
