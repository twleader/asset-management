  /api/assets/latest:
    get:
      tags: [最新資產]
      operationId: getLatestAssets
      summary: 取得指定帳號或預設主要管理者的最新完整資產
      description: >-
        唯讀聚合完整快照、同源即時估值與三市場狀態。snapshot.id 必須等於 liveAssets.snapshotId；
        不帶 `email` 時 owner 由 configured-admin bootstrap 決定；帶合法 `email` 時 owner 改由該帳號決定
        （仍不接受 `ownerId`、cookie、`X-User-*`、Tailscale identity 作為額外的租戶選擇輸入）。
        存款明細含唯讀 `updateMode` 與可空 `processingDate`；此 GET 只讀取已保存資料，不觸發在途款到期移除。
        configured-admin 與 by-email owner lookup 均最多 5 秒；逾時取消查找，回該端點既有 503 ProblemDetail，不進入資料讀取。
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
            maxLength: 254
          description: >-
            選擇要查詢的帳號 email；省略時預設回傳 configured-admin（主要管理者）的資料。
            帶入時僅需該帳號存在且狀態為 ACTIVE，不需為 configured-admin。
            格式不合法回 400；查無帳號或帳號非 ACTIVE 回 503（與 configured-admin 不可用時相同的錯誤契約，
            刻意不區分「查無」與「停用」以避免此參數成為帳號列舉工具）。
          example: selected@example.invalid
      responses:
        '200':
          description: 自洽且保留原始 BigDecimal JSON 精度的最新資產。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatestAssetsResponse'
              examples:
                synthetic:
                  $ref: '#/components/examples/LatestAssetsSynthetic'
        '400':
          description: email 參數格式不合法（缺 `@`、缺網域或超過 254 字元）；不會呼叫 by-email 或 business。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: {type: 'about:blank', title: Invalid latest assets request, status: 400, detail: email 格式不合法, instance: /api/assets/latest}
        '404':
          description: 主要管理者尚無資產快照；business 的 ProblemDetail 原樣 relay。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: {type: 'about:blank', title: Not Found, status: 404, detail: 尚無資產快照, instance: /api/assets/latest}
        '500':
          description: Business 聚合發生未預期錯誤，例如 snapshot identity 不一致。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: {type: 'about:blank', title: Internal Server Error, status: 500, detail: 最新快照與即時資產資料不一致, instance: /api/assets/latest}
        '502':
          description: BFF 驗證到空、malformed 或 identity 不一致的成功 payload，或 Nginx 無法連上 upstream。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example: {type: 'about:blank', title: Invalid latest assets payload, status: 502, detail: 最新資產上游 snapshot identity 不一致, instance: /api/assets/latest}
            text/html:
              schema:
                $ref: '#/components/schemas/NginxErrorHtml'
              example: "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx</center></body></html>"
        '503':
          description: >-
            Configured admin 不存在、未啟用或不可用；帶 `email` 時，查無、非 ACTIVE、by-email 的 HTTP、
            transport、decode 或五秒 timeout 都回同一個 email lookup unavailable body，避免帳號列舉與上游細節外洩。
            configured-admin lookup 超過 5 秒亦回既有 owner unavailable 503，保留該端點既有 title 與 detail。
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                configuredAdmin:
                  value: {type: 'about:blank', title: Latest assets unavailable, status: 503, detail: 主要管理者不可用, instance: /api/assets/latest}
                emailLookupUnavailable:
                  value: {type: 'about:blank', title: Latest assets unavailable, status: 503, detail: 指定帳號不可用, instance: /api/assets/latest}
        '504':
          $ref: '#/components/responses/NginxGatewayTimeout'
