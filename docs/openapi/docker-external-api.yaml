    IntradayTechnicalResolution:
      type: object
      description: Redis 中富邦 1 分與 5 分最新 KD、MACD、布林通道值及 freshness；盤中值只供明細顯示。
      required: [status, observedAt, ageSeconds, oneMinute, fiveMinute]
      properties:
        status:
          type: string
          enum: [AVAILABLE, STALE, UNAVAILABLE]
          description: AVAILABLE 表示觀測時間與所有非 null 來源 bar 時間的 age 均不超過 420 秒；STALE 表示 key 未到期但任一時間超過 420 秒；UNAVAILABLE 表示 miss、過期或資料無效。
        observedAt:
          type: [string, 'null']
          format: date-time
          description: 六個官方指標查詢組成此 bundle 的根觀測時間；UNAVAILABLE 時為 null。
        ageSeconds:
          type: [integer, 'null']
          format: int64
          description: 回應時相對 observedAt 的非負秒數；資料不可用時為 null。
        oneMinute:
          anyOf:
          - "$ref": "#/components/schemas/IntradayTechnicalFrame"
            description: 最新 1 分來源 point；根狀態為 UNAVAILABLE 時為 null。
          - type: 'null'
            description: 沒有可顯示的有效 1 分來源值。
          description: timeframe 固定字串 1 的最新 point。
        fiveMinute:
          anyOf:
          - "$ref": "#/components/schemas/IntradayTechnicalFrame"
            description: 最新 5 分來源 point；根狀態為 UNAVAILABLE 時為 null。
          - type: 'null'
            description: 沒有可顯示的有效 5 分來源值。
          description: timeframe 固定字串 5 的最新 point。
      additionalProperties: false
      example:
        status: AVAILABLE
        observedAt: '2026-09-25T02:13:00Z'
        ageSeconds: 34
        oneMinute:
          status: AVAILABLE
          timeframe: '1'
          sourceDate: '2026-09-25'
          sourceTimestamp: '2026-09-25T02:12:00Z'
          observedAt: '2026-09-25T02:13:00Z'
          kdj: {k: 51.2, d: 48.9, j: 55.8}
          macd: {macdLine: 0.4, signalLine: 0.3}
          bollinger: {upper: 1015, middle: 1004.5, lower: 994}
        fiveMinute:
          status: AVAILABLE
          timeframe: '5'
          sourceDate: '2026-09-25'
          sourceTimestamp: '2026-09-25T02:10:00Z'
          observedAt: '2026-09-25T02:13:00Z'
          kdj: {k: 50.1, d: 47.2, j: 55.9}
          macd: {macdLine: 0.5, signalLine: 0.2}
          bollinger: {upper: 1018, middle: 1005, lower: 992}
    IntradayTechnicalFrame:
      type: object
      description: 一個富邦盤中 timeframe 最新來源 point 與三組直接回傳指標數值。
      required: [status, timeframe, sourceDate, sourceTimestamp, observedAt, kdj, macd, bollinger]
      properties:
        status:
          type: string
          enum: [AVAILABLE, STALE]
          description: AVAILABLE 表示 timeframe 觀測時間與非 null 來源 bar 時間的 age 均不超過 420 秒；STALE 表示其中任一時間超過 420 秒且 key 尚未到期。
        timeframe:
          type: string
          enum: ['1', '5']
          description: 富邦官方 timeframe 字串；1 代表 1 分 K，5 代表 5 分 K。
        sourceDate:
          type: string
          format: date
          description: 三個技術 endpoint 最新列共同的台北交易日期。
        sourceTimestamp:
          type: [string, 'null']
          format: date-time
          description: 來源 bar 時間；官方只提供日期字串時為 null，不以 observedAt 代填。
        observedAt:
          type: string
          format: date-time
          description: 此 timeframe 三個 endpoint 的來源回應觀測時間。
        kdj:
          "$ref": "#/components/schemas/IntradayKdj"
          description: 官方 KDJ(9,3,3) 最新 k、d、j 值。
        macd:
          "$ref": "#/components/schemas/IntradayMacd"
          description: 官方 MACD(12,26,9) 最新 MACD 線與 signal 線，不推導 histogram。
        bollinger:
          "$ref": "#/components/schemas/IntradayBollinger"
