    PortfolioAdviceResponse:
      type: object
      description: "`PortfolioAdviceDto` 的 22 個 record properties。status=NONE 的占位物件只有
        status 有值，五個陣列為空。金額欄位為 BigDecimal，byte-relay 保留原始 JSON 精度。"
      required:
      - id
      - status
      - model
      - createdAt
      - completedAt
      - errorMessage
      - age
      - investmentHorizonYears
      - monthlyInvestment
      - goals
      - riskTolerance
      - expectedAnnualReturn
      - basedOnSnapshotId
      - basedOnSnapshotDate
      - basedOnTotalAssets
      - summary
      - riskAssessment
      - targetAllocation
      - rebalancePlan
      - actions
      - warnings
      - references
      properties:
        id:
          type:
          - integer
          - 'null'
          format: int64
          description: 該回應內實體的穩定識別碼。
        status:
          type: string
          description: NONE（尚無資料的占位物件）／PROCESSING／OK／FAILED 等；不可只看 HTTP 200。
        model:
          type:
          - string
          - 'null'
          description: 產生分析或建議的模型／規則版本。
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 建議或快照建立的時間點。
        completedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 建議計算完成的時間點。
        errorMessage:
          type:
          - string
          - 'null'
          description: 本次處理失敗時可安全顯示的錯誤說明。
        age:
          type:
          - integer
          - 'null'
          format: int32
          description: 建議或快照自建立起的經過時間。
        investmentHorizonYears:
          type:
          - integer
          - 'null'
          format: int32
          description: 建議假設的投資期間，以年為單位。
        monthlyInvestment:
          type:
          - number
          - 'null'
          description: 建議假設的每月投入金額。
        goals:
          type: array
          description: DB 的逗號分隔字串切開並去除空白；無值時為空陣列。
          items:
            type: string
            description: 陣列中的單一元素：目標的業務屬性。
        riskTolerance:
          type:
          - string
          - 'null'
          description: 自由字串；不可假設固定 enum。
        expectedAnnualReturn:
          type:
          - string
          - 'null'
          description: 字串而非數值（可能是 "6%" 之類的區間描述）。
        basedOnSnapshotId:
          type:
          - integer
          - 'null'
          format: int64
          description: 產生建議時採用的資產快照識別碼。
        basedOnSnapshotDate:
          type:
          - string
          - 'null'
          format: date
          description: 產生建議時所採用資產快照日期。
        basedOnTotalAssets:
          type:
          - number
          - 'null'
          description: 產生建議時採用的資產總額。
        summary:
          type:
          - string
          - 'null'
          description: result_json 無法解析時為 null。
        riskAssessment:
          type:
          - string
          - 'null'
          description: 建議使用的風險承受度或風險評估。
        targetAllocation:
          type: array
          items:
            "$ref": "#/components/schemas/TargetAllocation"
            description: 陣列中的單一元素：建議的目標資產配置集合。
          description: 建議的目標資產配置集合。
        rebalancePlan:
          type: array
          items:
            "$ref": "#/components/schemas/RebalanceItem"
            description: 陣列中的單一元素：使目前配置靠近目標配置的調整項目。
          description: 使目前配置靠近目標配置的調整項目。
        actions:
          type: array
          items:
            "$ref": "#/components/schemas/AdviceAction"
            description: 陣列中的單一元素：資產配置建議中的行動項目清單。
          description: 資產配置建議中的行動項目清單。
        warnings:
          type: array
          items:
            type: string
            description: 陣列中的單一元素：資產配置建議中的限制與風險提示。
          description: 資產配置建議中的限制與風險提示。
        references:
          type: array
          items:
            "$ref": "#/components/schemas/AdviceReference"
            description: 陣列中的單一元素：建議依據的公開引用清單。
          description: 建議依據的公開引用清單。
      additionalProperties: false
    TargetAllocation:
      type: object
      description: "`PortfolioAdviceResult.TargetAllocation`。targetAmount ＝ 資產總額 × targetPct、deltaAmount
        ＝ targetAmount − currentValue，兩者由後端決定性回填。"
      required:
      - assetClass
      - targetPct
      - currentValue
      - targetAmount
      - deltaAmount
      - rationale
      properties:
        assetClass:
          type:
          - string
          - 'null'
          description: 資產類別；DB／LLM 驅動的自由字串。
        targetPct:
          type:
          - number
          - 'null'
          description: 建議目標比例，百分比數值（40.00 表示 40%）。
        currentValue:
          type:
          - number
          - 'null'
          description: 依目前估值計算的部位金額。
        targetAmount:
          type:
          - number
          - 'null'
          description: 調整後建議持有的目標金額。
        deltaAmount:
          type:
          - number
          - 'null'
          description: 正為增碼、負為減碼。
        rationale:
          type:
          - string
          - 'null'
          description: 配置或調整建議的理由。
      additionalProperties: false
    RebalanceItem:
      type: object
      description: "`PortfolioAdviceResult.Rebalance`。"
      required:
      - assetClass
      - holding
      - action
      - estimatedAmount
      - rationale
      properties:
        assetClass:
          type:
          - string
          - 'null'
          description: 資產分類，例如股票、基金、存款或 ETF。
        holding:
          type:
          - string
          - 'null'
          description: 標的（個股代號／基金名稱／存款；或「整體」）。
        action:
          type:
          - string
          - 'null'
          description: BUY／SELL／HOLD；LLM 產出的自由字串，不宣告 enum。
        estimatedAmount:
          type:
          - number
          - 'null'
          description: 估計操作金額（新台幣，正數）。
        rationale:
          type:
          - string
          - 'null'
          description: 配置或調整建議的理由。
      additionalProperties: false
    AdviceAction:
      type: object
      description: "`PortfolioAdviceResult.Action`。"
      required:
      - title
      - detail
      - priority
      properties:
        title:
          type:
          - string
          - 'null'
          description: 建議動作的短標題。
        detail:
          type:
          - string
          - 'null'
          description: 可讀的具體處理或建議說明。
        priority:
          type:
          - string
          - 'null'
          description: HIGH／MEDIUM／LOW；LLM 產出的自由字串，不宣告 enum。
      additionalProperties: false
    AdviceReference:
      type: object
      description: "`PortfolioAdviceResult.Reference`。"
      required:
      - title
      - url
      properties:
        title:
          type:
          - string
          - 'null'
          description: 公開參考來源的標題。
        url:
          type:
          - string
          - 'null'
          description: 公開參考來源的網址。
      additionalProperties: false
