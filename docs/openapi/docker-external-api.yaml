          description: 匯率貨幣對。 可用值固定為 `USD/TWD`。
        baseCurrency:
          type: string
          const: USD
          description: 匯率貨幣對的基礎幣別。 可用值固定為 `USD`。
        quoteCurrency:
          type: string
          const: TWD
          description: 匯率或標的報價的計價幣別。 可用值固定為 `TWD`。
        requestedStartDate:
          type: string
          format: date
          description: 匯率歷史查詢採用的起始日期。
        requestedEndDate:
          type: string
          format: date
          description: 匯率歷史查詢採用的結束日期。
        refreshIntervalSeconds:
          type: integer
          format: int32
          const: 2
          description: 輪詢或更新設定的秒數間隔。 可用值固定為 `2`。
        timezone:
          type: string
          const: Asia/Taipei
          description: 日期與時間字串採用的 IANA 時區。 可用值固定為 `Asia/Taipei`。
        liveUpdateStatus:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - UNAVAILABLE
          description: 即期匯率更新的可用性狀態。 可用值固定為 `ACTIVE`、`INACTIVE`、`UNAVAILABLE`。
        spot:
          "$ref": "#/components/schemas/UsdTwdSpot"
          description: 目前 USD/TWD 即期匯率與來源時間。
        count:
          type: integer
          format: int32
          minimum: 1
          description: 必須等於 history 的項目數。
