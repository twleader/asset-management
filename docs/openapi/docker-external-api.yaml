      properties:
        id: {type: integer, format: int64}
        fundName: {type: string}
        fundCode: {type: [string, 'null']}
        bankId: {type: [integer, 'null'], format: int64}
        bankDisplayName: {type: [string, 'null']}
        investmentAmount: {type: number}
        currentValue: {type: number}
        units: {type: [number, 'null']}
        estimatedDividend: {type: [number, 'null']}
        dividendRate: {type: [number, 'null'], description: estimatedDividend/currentValue 的比例值。}
        profit: {type: number}
        profitRate: {type: number}
