        skippedNonTwStocks:
          type: integer
          format: int32
          minimum: 0
          description: required non-null int32 minimum 0；因本雷達不處理非台股而略過的標的筆數。
        publicInformation:
          type: array
          description: required non-null array of `PublicInformationItem` items；本輪可公開資訊，保留 producer 排序；空陣列表示無可公開項目。
          items:
            $ref: '#/components/schemas/PublicInformationItem'
            description: PublicInformationItem item；一筆公開資訊 nested class，attribute purpose/type/nullability 由 referenced schema 定義。
      additionalProperties: false
