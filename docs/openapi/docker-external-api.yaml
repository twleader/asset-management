              unit:
                const: TWD
                description: 本欄單位常數 `TWD`：新台幣金額（已換算，不再乘匯率）。
            description: 限定本欄 unit 為 TWD。
          description: 來源估計年收入（新台幣）：來源為快照 estimatedAnnualDividend；V2 一般存款利率未知且快照值非 null 時為 UNAVAILABLE＋DEPOSIT_INTEREST_RATE_UNKNOWN，不能將來源把 null 折零的結果冒充完整估計，也不做分類和對帳。快照值為 null 時為 UNAVAILABLE＋SNAPSHOT_ESTIMATED_DIVIDEND_MISSING；僅在分類皆已知時檢查 INCOME_RECONCILIATION_MISMATCH。
        permanentTermInterestReinvested:
