        ma60:
          "$ref": "#/components/schemas/NullableDecimalSeries"
          description: 近 60 期的簡單移動平均。
        ma240:
          "$ref": "#/components/schemas/NullableDecimalSeries"
          description: 近 240 期的簡單移動平均。
        k:
