        available=false 時 source 與行情 attribute 為 null、levels 為空。非台股或 0000 是 typed unsupported，零
        上游 request。read path 只以 Redis 作 candidate 並以 PostgreSQL revision 驗證，絕不 request-time vendor I/O 或 cache repair。
      required:
      - stockCode
      - stockName
      - market
      - supported
      - available
      - source
      - message
      - sourceTime
      - fetchedAt
      - marketStatus
      - price
      - previousClose
      - openPrice
      - highPrice
      - lowPrice
      - averagePrice
      - change
      - changePercent
      - turnoverYi
      - volumeLots
      - previousVolumeLots
      - amplitudePercent
      - innerVolumeLots
      - outerVolumeLots
      - innerPercent
      - outerPercent
      - bidTotalLots
      - askTotalLots
      - levels
      properties:
        stockCode:
          type:
          - string
          - 'null'
          description: required nullable string；交易所或來源使用的標的代號，unsupported／unavailable identity 無法安全確認時為 null。
        stockName:
          type:
          - string
          - 'null'
          description: required nullable string；供畫面與批次辨識的來源標的名稱，available snapshot 必為非空，否則為 null。
        market:
          type:
          - string
          - 'null'
          description: required nullable string；標的所屬市場範圍，available 台股 snapshot 為 `台股`，unsupported identity 時可為 null。
        supported:
          type: boolean
          description: required boolean；true 代表請求是可處理的台股非 0000 code，false 是 typed unsupported，不代表有五檔。
        available:
          type: boolean
          description: required boolean；true 僅代表完整且已核准 source snapshot 可用，false 時不可使用任何行情或五檔 attribute。
        source:
          type:
          - string
          - 'null'
          enum:
          - FUBON_BOOKS
          - YAHOO_TW
          -
          description: required nullable enum；available=true 時僅 `FUBON_BOOKS`（富邦十秒 primary）或 `YAHOO_TW`（同輪缺完整 Fubon book 的 producer fallback），null 表示 unsupported 或 unavailable，絕不接受其他來源。
        message:
          type:
          - string
          - 'null'
          description: required nullable string；available=false／unsupported 時可安全顯示的原因，available=true 通常為 null；不含 vendor response 或個人資料。
        sourceTime:
          type:
          - string
          - 'null'
          format: date-time
          description: required nullable RFC 3339 date-time；available snapshot 的公開來源行情時點，必為台灣當日且非未來；unavailable 時為 null。
        fetchedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: required nullable RFC 3339 date-time；服務取得並保存 canonical snapshot 的時點，非呼叫此 API 的時間；unavailable 時為 null。
        marketStatus:
          type:
          - string
          - 'null'
          enum:
          - OPEN
          - CLOSED
          - UNKNOWN
          -
          description: required nullable enum；`OPEN` 是可用完整 canonical snapshot 的 producer market status，`CLOSED` 保留為來源相容值，`UNKNOWN` 代表 unavailable，null 是 unsupported identity 未知。
        price:
          type:
          - number
          - 'null'
          description: required nullable number；available snapshot 的正成交價，null 表示不可用；不是估值、建議價格或 generic quote 補值。
        previousClose:
          type:
          - number
          - 'null'
          description: required nullable number；available snapshot 的正前一交易日收盤價，null 表示不可用，不能由 price 推算。
        openPrice:
          type:
          - number
          - 'null'
          description: required nullable number；同來源當日開盤成交價，來源未提供或 unavailable 時為 null。
        highPrice:
          type:
          - number
          - 'null'
          description: required nullable number；同來源當日最高成交價，來源未提供或 unavailable 時為 null。
        lowPrice:
          type:
          - number
          - 'null'
          description: required nullable number；同來源當日最低成交價，來源未提供或 unavailable 時為 null。
        averagePrice:
          type:
          - number
          - 'null'
          description: required nullable number；同來源當日成交均價，來源未提供或 unavailable 時為 null。
        change:
          type:
          - number
          - 'null'
          description: required nullable number；同來源相對前收的絕對變動，正負方向依來源，無法驗證時為 null。
        changePercent:
          type:
          - number
          - 'null'
          description: required nullable number；同來源相對前收的變動百分點，例如 0.55 表示 0.55%，無法驗證時為 null。
        turnoverYi:
          type:
          - number
          - 'null'
          description: required nullable number；同來源當日成交金額，以億元為單位，無來源值時為 null。
        volumeLots:
          type:
          - integer
          - 'null'
          format: int64
          description: required nullable int64；同來源以張為單位的成交量，無來源值時為 null。
        previousVolumeLots:
          type:
          - integer
          - 'null'
          format: int64
          description: required nullable int64；同來源前一交易日以張為單位的成交量，無來源值時為 null。
        amplitudePercent:
          type:
          - number
          - 'null'
          description: required nullable number；由同來源高低價與前收得出的當日振幅百分點，必要輸入缺失時為 null。
        innerVolumeLots:
          type:
          - integer
          - 'null'
          format: int64
          description: required nullable int64；同來源內盤成交量（張），無來源值時為 null，不是委託簿買量。
        outerVolumeLots:
          type:
          - integer
          - 'null'
          format: int64
          description: required nullable int64；同來源外盤成交量（張），無來源值時為 null，不是委託簿賣量。
        innerPercent:
          type:
          - number
          - 'null'
          description: required nullable number；內盤占內外盤成交量合計的百分比，分母無效時為 null。
        outerPercent:
          type:
          - number
          - 'null'
          description: required nullable number；外盤占內外盤成交量合計的百分比，分母無效時為 null。
        bidTotalLots:
          type:
          - integer
          - 'null'
          format: int64
          description: required nullable int64；available snapshot 五個 bid level 的正張數合計，unavailable 時為 null。
        askTotalLots:
          type:
          - integer
          - 'null'
          format: int64
          description: required nullable int64；available snapshot 五個 ask level 的正張數合計，unavailable 時為 null。
        levels:
          type: array
          maxItems: 5
          items:
            "$ref": "#/components/schemas/OrderBookLevel"
            description: OrderBookLevel item；同一 source／revision 的 paired bid/ask level，level 由 1 到 5 遞進，不能與 root direct side array 交叉拼接。
          description: required non-null array；available=true 時恰好五筆 `OrderBookLevel`，level 1..5、bid price 嚴格遞減、ask price 嚴格遞增且全部正；available=false／unsupported 時為空，最多五筆。
      additionalProperties: false
    OrderBookLevel:
      type: object
      description: PublicQuoteDetail.levels 的 paired five-book item class。只存在於 available=true 的完整同來源 snapshot；
        required attribute 均為非 null 正值，level 依 1..5 排序，bid 與 ask 不可由不同 source、不同 revision 或 generic quote 拼合。
      required:
      - level
      - bidPrice
      - bidVolumeLots
      - askPrice
      - askVolumeLots
      properties:
        level:
          type: integer
          minimum: 1
          maximum: 5
          description: required integer 1..5；由最佳價向外遞進的 paired 五檔順位，levels array 依此嚴格遞增。
        bidPrice:
          type: number
          exclusiveMinimum: 0
          description: required non-null positive number；該順位買方掛單價格，level 增加時價格嚴格遞減。
        bidVolumeLots:
          type: integer
          format: int64
          minimum: 1
          description: required non-null positive int64；該順位買方掛單張數，以張為單位。
        askPrice:
          type: number
          exclusiveMinimum: 0
          description: required non-null positive number；該順位賣方掛單價格，level 增加時價格嚴格遞增。
        askVolumeLots:
          type: integer
          format: int64
          minimum: 1
          description: required non-null positive int64；該順位賣方掛單張數，以張為單位。
      additionalProperties: false
    BookSideLevel:
      type: object
      description: root `bidLevels` 或 `askLevels` 的單側 item class；只由同一 available `FUBON_BOOKS`／`YAHOO_TW`
        complete canonical snapshot 投影。兩個 required attribute 都是非 null 正值；bid array 由高到低、ask array 由低到高。
      required:
      - price
      - size
      properties:
        price:
          type: number
          exclusiveMinimum: 0
          description: required non-null positive number；該側一個五檔順位的掛單價格。
        size:
          type: integer
          format: int64
          minimum: 1
          description: required non-null positive int64；該側一個五檔順位的掛單張數，以張為單位。
      additionalProperties: false
