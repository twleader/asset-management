        '400':
          description: >-
            email 格式不合法時優先回 email detail；否則 year 重複、year 與 date range 混用、缺少 range 一端、
            日期格式或順序不合法維持 filter detail。兩者都不會呼叫 configured-admin、by-email 或 business。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                invalidEmail:
                  value: {type: 'about:blank', title: Invalid transaction history email, status: 400, detail: email 格式不合法, instance: /api/public/transactions}
                invalidFilter:
                  value: {type: 'about:blank', title: Invalid transaction history request, status: 400, detail: 交易紀錄篩選條件不合法, instance: /api/public/transactions}
        '502':
          description: Business 非 2xx 或 Nginx upstream failure；回應已消毒。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Transaction history downstream failure, status: 502, detail: 交易紀錄暫時無法取得, instance: /api/public/transactions}
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx</center></body></html>"
        '503':
          description: >-
            configured-admin 或 current-read transport 不可用；帶 `email` 時，查無、非 ACTIVE、by-email 的 HTTP、
            transport、decode 或五秒 timeout 都回同一個 canonical unavailable body，避免帳號列舉與上游細節外洩。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Transaction history unavailable, status: 503, detail: 交易紀錄服務暫時不可用, instance: /api/public/transactions}
        '504':
          description: BFF 五秒 timeout 或 Nginx gateway timeout。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Transaction history timeout, status: 504, detail: 交易紀錄服務逾時, instance: /api/public/transactions}
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>504 Gateway Time-out</title></head><body><center><h1>504 Gateway Time-out</h1></center><hr><center>nginx</center></body></html>"
