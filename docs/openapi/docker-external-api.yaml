  /api/public/srpp/completed-technicals:
    get:
      tags: [SRPP 技術事實]
      operationId: getSrppCompletedTechnicals
      summary: 批次計算已完成日 K 的 SRPP 技術事實
      description: |
        從資產系統已保存的逐日 OHLCV 計算；每檔只取截至 asOf 的兩年有界歷史，
        並以既有權息／分割還原服務取得同一價量基準。asOf 必須早於該市場本地今日且
        當日 bar 必須存在；短歷史、缺 OHLC/volume 時只讓相應指標為 null 並列出具名缺口。
        不抓 vendor、不 refresh、不寫入、不讀 owner 資產，不計算買賣指令。
      parameters:
        - name: market
          in: query
          required: true
          description: 唯一市場；只接受台股或美股，一批不可混合。
          schema: {type: string, enum: [台股, 美股]}
          example: 台股
        - name: asOf
          in: query
          required: true
          description: 必須早於市場本地今日且當日已保存的完成日 K 日期；不得以較早日替代。
          schema: {type: string, format: date}
          example: '2026-01-15'
        - name: stockCodes
          in: query
          required: true
          description: 逗號分隔的 1–40 個唯一代號，原順序逐檔回傳；單碼限 1–12 個英數字、點或連字號。
