            description: 限定本欄 unit 為 TWD。
          description: 目標權重 × 分母 − 曝險的新台幣差距；可為負，僅供描述，不是可買金額。無目標時為 UNAVAILABLE。
      required:
      - assetKey
      - market
      - symbol
      - sourceHoldingIds
      - exposureTwd
      - currentWeight
      - targetWeight
      - gapWeight
      - gapValueTwd
