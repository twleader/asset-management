  /api/public/transactions:
    get:
      tags: [公開交易紀錄]
      operationId: getPublicTransactionHistory
      summary: 取得指定帳號或預設主要管理者的唯讀交易紀錄
      description: >-
        不帶 `email` 時 owner 由 BFF configured-admin bootstrap 決定；帶合法 `email` 時 owner 改由該帳號
        決定（仍不接受 `ownerId`、帳戶、券商或其他身分 header 作為額外的租戶選擇輸入）。無 query 時回全部紀錄；
        可精確擇一提供 `year`，或成對提供 `start` 與 `end`。篩選與 `email` 各自獨立在 BFF 本地嚴格驗證，
        email 格式驗證優先於 filter；email 合法或省略時，filter 的既有 400 契約不變。錯誤不會觸發 bootstrap。
        此 API 不同步、匯出、寫入或計算個別成交推論；records 固定按
        `tradeDate DESC, id DESC`。
      parameters:
        - name: year
          in: query
          required: false
          description: 與 start/end 互斥的四位西元年。
          schema: {type: string, pattern: '^[0-9]{4}$'}
          example: '2026'
        - name: start
          in: query
          required: false
          description: 與 end 成對提供的 inclusive ISO 起日；不得和 year 同時提供。
          schema: {type: string, format: date}
          example: '2026-01-01'
        - name: end
          in: query
          required: false
          description: 與 start 成對提供的 inclusive ISO 迄日，且不得早於 start。
          schema: {type: string, format: date}
          example: '2026-12-31'
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
            maxLength: 254
          description: >-
            選擇要查詢的帳號 email；省略時預設回傳 configured-admin（主要管理者）的資料。
            帶入時僅需該帳號存在且狀態為 ACTIVE，不需為 configured-admin。
            格式不合法回 400；查無帳號或帳號非 ACTIVE 回 503（與 configured-admin 不可用時相同的錯誤契約，
            刻意不區分「查無」與「停用」以避免此參數成為帳號列舉工具）。
          example: selected@example.invalid
      responses:
        '200':
          description: 選定範圍的 immutable 交易帳本、全期與選定範圍摘要。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicTransactionHistoryResponse'}
              examples:
