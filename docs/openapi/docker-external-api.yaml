      properties:
        id: {type: integer, format: int64}
        stockCode: {type: string}
        stockName: {type: string}
        market: {type: string, description: DB 驅動的市場字串，不在 HTTP schema 寫死 enum。}
        brokerId: {type: [integer, 'null'], format: int64}
        brokerDisplayName: {type: [string, 'null']}
        shares: {type: number}
        investmentCost: {type: number, description: 原始幣別成本。}
        investmentCostTwd: {type: number}
        currentValue: {type: number, description: 台幣現值。}
        profit: {type: number}
        profitRate: {type: number}
        estimatedDividend: {type: [number, 'null']}
        dividendRate: {type: [number, 'null']}
        currency: {type: [string, 'null']}
        originalCurrencyValue: {type: [number, 'null']}
        transactionType: {type: [string, 'null']}
        transactionDate: {type: [string, 'null'], format: date}
        transactionExchangeRate: {type: [number, 'null']}
        displayOrder: {type: [integer, 'null'], format: int32}
      additionalProperties: false
    LiveAssets:
      type: object
      required: [snapshotId, snapshotDate, exchangeRate, totalDeposit, totalFundValue, liveStockValue, liveTotalAssets, stocks, twMarketOpen, usMarketOpen, ukMarketOpen, priceUpdatedAt]
      properties:
        snapshotId: {type: integer, format: int64, description: 必須等於 outer snapshot.id。}
        snapshotDate: {type: string, format: date}
        exchangeRate: {type: number}
        totalDeposit: {type: number}
        totalFundValue: {type: number}
        liveStockValue: {type: number}
        liveTotalAssets: {type: number}
        stocks: {type: array, items: {$ref: '#/components/schemas/LiveStock'}}
        twMarketOpen: {type: boolean}
        usMarketOpen: {type: boolean}
        ukMarketOpen: {type: boolean}
        priceUpdatedAt:
