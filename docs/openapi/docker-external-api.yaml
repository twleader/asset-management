        depositGroups:
          type: array
          items:
            "$ref": "#/components/schemas/SrppDepositGroup"
            description: 一個存款分組。
          description: 存款分組彙總，依 currency → depositType → bankId（null 最前）字串序排序且主鍵不重複。
      required:
