            "$ref": "#/components/schemas/UsdTwdHistoryPoint"
            description: 陣列中的單一元素：歷史點的業務屬性。
      additionalProperties: false
    UsdTwdSpot:
      type: object
      description: Timestamp 組合固定：HISTORY 的兩個 timestamp 都為 null；BANK_OF_TAIWAN 的 polledAt
        必填而 sourceUpdatedAt 為 null；MEGA_BANK/YAHOO 兩者都必填且 sourceUpdatedAt 不得晚於 polledAt
        120 秒。
      required:
      - date
      - buyRate
      - sellRate
      - midRate
      - source
      - polledAt
      - sourceUpdatedAt
      - quoteStatus
      properties:
        date:
          type: string
          format: date
          description: 此筆歷史或市場觀測的日期。
        buyRate:
          type: number
          exclusiveMinimum: 0
          description: 銀行或來源公告的買入匯率。
        sellRate:
          type: number
          exclusiveMinimum: 0
          description: 必須大於等於 buyRate。
        midRate:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.0001
          description: "(buyRate+sellRate)/2，HALF_UP scale 4。"
        source:
          type: string
          enum:
          - BANK_OF_TAIWAN
          - MEGA_BANK
          - YAHOO
          - HISTORY
          description: 產生此值的公開來源或系統識別。 可用值固定為 `BANK_OF_TAIWAN`、`MEGA_BANK`、`YAHOO`、`HISTORY`。
        polledAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 輪詢來源的時間點。
        sourceUpdatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 來源聲明的最後更新時間點。
        quoteStatus:
          type: string
          enum:
          - LIVE
          - INDICATIVE
          - STALE
          - LAST_AVAILABLE
          description: 原始報價可用性或盤中狀態。 可用值固定為 `LIVE`、`INDICATIVE`、`STALE`、`LAST_AVAILABLE`。
      oneOf:
      - properties:
          source:
            const: HISTORY
            description: 產生此值的公開來源或系統識別。 可用值固定為 `HISTORY`。
          polledAt:
            type: 'null'
            description: 輪詢來源的時間點。
          sourceUpdatedAt:
            type: 'null'
            description: 來源聲明的最後更新時間點。
        description: UsdTwdSpot 的具體 API schema 的可用型態。
      - properties:
          source:
            const: BANK_OF_TAIWAN
            description: 產生此值的公開來源或系統識別。 可用值固定為 `BANK_OF_TAIWAN`。
          polledAt:
            type: string
            format: date-time
            description: 輪詢來源的時間點。
          sourceUpdatedAt:
            type: 'null'
            description: 來源聲明的最後更新時間點。
        description: UsdTwdSpot 的具體 API schema 的可用型態。
      - properties:
          source:
            enum:
            - MEGA_BANK
            - YAHOO
            description: 產生此值的公開來源或系統識別。 可用值固定為 `MEGA_BANK`、`YAHOO`。
          polledAt:
            type: string
            format: date-time
            description: 輪詢來源的時間點。
          sourceUpdatedAt:
            type: string
            format: date-time
            description: 來源聲明的最後更新時間點。
        description: UsdTwdSpot 的具體 API schema 的可用型態。
      additionalProperties: false
