          - 'null'
          description: 來源目錄或證據項目的代碼。
        value:
          type:
          - number
          - 'null'
          description: 該市場特徵的觀測值。
        asOfDate:
          type:
          - string
          - 'null'
          format: date
          description: 此數值、來源或市場觀測所對應的日期。
        availableAt:
          type:
          - string
          - 'null'
          format: date-time
          description: 該內容可被系統使用或首次觀測的時間點。
        availabilityBasis:
          type:
          - string
          - 'null'
          description: 判斷內容可用性的來源依據。
        provider:
          type:
          - string
          - 'null'
          description: 提供數值或公開內容的供應者識別。
        sourceUrl:
          type:
          - string
          - 'null'
