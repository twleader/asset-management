openapi: 3.1.0
info:
  title: 資產管理系統 Docker 外部 API
  version: 1.14.0
  description: |
    本文件只描述 `api-gateway` 對 Docker host 與 Tailscale 私有網路開放的十四條精確路徑：
    十三條 GET（其中 transactions／trading-radar／srpp daily-context 是 configured-admin 或 email 選定 owner 範圍，calendar 與 commodity-prices 是 global no-tenant）
    ＋ 一條寫入 POST（`/api/public/crawler-data/rescan`，唯一有外部抓取副作用者，
    經 business 端 30 秒全域 Redis 冷卻節流）。

    本機入口只綁定 loopback `127.0.0.1:9090`；遠端入口由 Tailscale Serve 的私有網路身分與
    十四條逐一路徑規則形成網路邊界。HTTP 層本身沒有 OAuth、API key 或其他應用層認證，因此
    全域 `security` 為空陣列。不得把任一 server URL 解讀為公開網際網路服務。

    Gateway 只接受下列精確路徑：同一路徑的非合法 method 回 `405 Method Not Allowed`，
    十三條唯讀路徑帶 `Allow: GET`、`/api/public/crawler-data/rescan` 帶 `Allow: POST`；
    所有其他路徑、子路徑、尾斜線與 matrix 變體回 `404 Not Found`。
    Swagger UI 或原始 OpenAPI 文件沒有對外路由；本 YAML 是版本控管文件，不代表 gateway
    暴露文件端點。

    回應只代表來源或快取當下狀態，排程不可只看 HTTP 200；應另檢查報價的
    `quoteStatus`／`tradingDate`／`updatedAt`、ETF 的 `premiumDiscountPct`、資產的 `targetPriceComplete`／`valuationSource`，
    匯率的 `liveUpdateStatus`／`spot.quoteStatus`，以及交易雷達的 `generatedAt` 與各項證據。
    交易雷達會揭露 configured admin 的持倉／觀察清單與決策證據；只能透過本機 loopback
    或獲准 Tailscale identity 讀取，不可開成公網。本 API 不構成交易執行依據。

    第十四條 `GET /api/public/srpp/daily-context`（Requirement 163）讀取 business 背景 producer 已發布的不可變
    SRPP 共用計算結果 package（資產對帳、總曝險配置差距、基礎收益加總）；GET 純讀、不觸發計算或任何外呼。
    規則包 registry 上線時為空，在使用者另行登錄正式規則包前一律回 409 `POLICY_UNSUPPORTED`；funding、
    completedTechnicals 與稅後欄位本版固定具名 UNAVAILABLE（模組降級而非填 0），`tradingAuthorized` 恆為 false。
servers:
  - url: http://127.0.0.1:9090
    description: Docker host 本機 loopback 入口
  - url: https://mac-mini-2.tailccc7be.ts.net:9090
    description: Tailscale 私有網路的十四條 path-scoped HTTPS 入口
security: []
paths:
  /api/quotes:
    get:
      tags: [公開報價]
      operationId: listLatestQuotes
      summary: 列出快取報價與四頁籤公開市場資料
      description: |
        BFF 只 relay external-materials Redis raw `LatestQuote` 的既有 19 欄，並在其後固定加入
        `marketData.chart`、`quoteDetail`、`etfConstituents`、`dividends` 四個公開市場資料 child，
        並在 marketData 後依序直接提供同一份 normalized immutable `quoteDetail`、`bidLevels`、
        `askLevels`、`dividendHistory` 供批次程式使用。
        market 省略時掃描台股、美股、英股；raw index 的順序、空快取 `[]` 與 raw 讀取語意不變。
        `marketData` 不讀、也不含 configured admin、使用者、帳戶、券商、個人持股／成本／交易／快照／配置。
        list 固定使用 `ListedLatestQuote` 的既有 24 欄，零 Fubon full-response bridge calls；不新增 Fubon
        metadata、failure、raw returned order-book 或 process-global counters。
        台股 `quoteDetail`／direct 五檔來自 producer 已保存的同一 immutable canonical snapshot：富邦是每十秒
        round 的 primary，只有該 round 的 selected code 缺有效完整五檔時，獨立 Yahoo worker 才會非同步逐檔
        fallback。available snapshot 的 source 僅可能為 `FUBON_BOOKS` 或 `YAHOO_TW`，兩者都必須是完整五檔，
        不會以 generic buy/sell 或跨來源欄位拼湊。查詢只把 Redis 當 revision-verified candidate 並讀 PostgreSQL
        canonical；絕不在 request-time 向 Yahoo、富邦、dispatcher 或 worker 外呼／寫入，也不用於估值、損益、
        下單、警示或任何個人資產判斷。
      parameters:
        - name: market
          in: query
          required: false
          description: 選填的單一市場；可用值為台股、美股、英股，省略時回三個市場。
          schema:
            type: string
            enum: [台股, 美股, 英股]
          example: 台股
        - name: start
          in: query
          required: false
          description: 與 end 同時提供的 ISO 日期；控制每筆 chart 的共同起日，最早為台北今天往前十年。
          schema: {type: string, format: date}
          example: '2025-01-15'
        - name: end
          in: query
          required: false
          description: 與 start 同時提供的 ISO 日期；不得晚於台北今天。兩者皆省略時為近一年。
          schema: {type: string, format: date}
          example: '2026-01-15'
      responses:
        '200':
          description: 最新報價陣列；可能為空。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListedLatestQuote'
              examples:
                synthetic:
                  summary: 去識別化合成範例
                  value:
                    - stockCode: EXM-TW-ETF
                      stockName: 範例 ETF
                      market: 台股
                      price: 100.25
                      previousClose: 99.50
                      priceChange: 0.75
                      changePercent: 0.753769
                      buyPrice: 100.20
                      sellPrice: 100.30
                      openPrice: 99.80
                      highPrice: 101.00
                      lowPrice: 99.60
                      volume: 123456
                      tradingDate: '2026-01-15'
                      updatedAt: '2026-01-15T10:15:30.123456789'
                      closed: false
                      source: SYNTHETIC_EXAMPLE
                      quoteStatus: LIVE
                      premiumDiscountPct: 0.07
                      marketData:
                        chart: {status: NO_DATA, message: '目前無走勢資料', requestedStart: '2025-01-15', requestedEnd: '2026-01-15', series: {dates: [], prices: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], latest: null, daily: {dates: [], opens: [], highs: [], lows: [], closes: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], currentClose: null, previousClose: null, latest: null}, weekly: {dates: [], opens: [], highs: [], lows: [], closes: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], currentClose: null, previousClose: null, latest: null}}, intraday: {status: NO_DATA, message: '目前無分時資料', tradingDate: null, ticks: []}}
                        quoteDetail: {stockCode: EXM-TW-ETF, stockName: 範例 ETF, market: 台股, supported: true, available: false, source: null, message: '暫時無法取得行情五檔', sourceTime: null, fetchedAt: null, marketStatus: UNKNOWN, price: null, previousClose: null, openPrice: null, highPrice: null, lowPrice: null, averagePrice: null, change: null, changePercent: null, turnoverYi: null, volumeLots: null, previousVolumeLots: null, amplitudePercent: null, innerVolumeLots: null, outerVolumeLots: null, innerPercent: null, outerPercent: null, bidTotalLots: null, askTotalLots: null, levels: []}
                        etfConstituents: {stockCode: EXM-TW-ETF, market: 台股, supported: false, source: null, asOfDate: null, message: 'ETF 成分股資料暫時不可用', holdings: []}
                        dividends: {stockCode: EXM-TW-ETF, market: 台股, source: null, message: '股利資料暫時不可用', rows: [], annualSummaries: []}
                      quoteDetail: {stockCode: EXM-TW-ETF, stockName: 範例 ETF, market: 台股, supported: true, available: false, source: null, message: '暫時無法取得行情五檔', sourceTime: null, fetchedAt: null, marketStatus: UNKNOWN, price: null, previousClose: null, openPrice: null, highPrice: null, lowPrice: null, averagePrice: null, change: null, changePercent: null, turnoverYi: null, volumeLots: null, previousVolumeLots: null, amplitudePercent: null, innerVolumeLots: null, outerVolumeLots: null, innerPercent: null, outerPercent: null, bidTotalLots: null, askTotalLots: null, levels: []}
                      bidLevels: []
                      askLevels: []
                      dividendHistory: {stockCode: EXM-TW-ETF, market: 台股, source: null, message: '股利資料暫時不可用', rows: [], annualSummaries: []}
        '400':
          description: start/end 未同時提供、格式不合法、順序錯誤、未來日或超過十年窗口。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Public quote data unavailable, status: 400, detail: 報價日期參數不合法, instance: /api/quotes}
        '502':
          $ref: '#/components/responses/NginxBadGateway'
        '504':
          $ref: '#/components/responses/NginxGatewayTimeout'
  /api/quotes/one:
    get:
      tags: [公開報價]
      operationId: getLatestQuote
      summary: 查詢單一標的的快取報價與四頁籤公開市場資料
      description: |
        先讀目前 external-materials Redis raw cache。Requirement 165：只有 raw 回 204（price key cache miss、
        price Redis 讀取失敗或 payload 無法解析，例如週末／連假 24 小時 TTL 過期）時，BFF 才經 business 既有唯讀
        `GET /api/market-data/history/stock`（`stock_price_history`；`0000` 讀 `twse_index_daily_history`）取台北今天往前
        30 個日曆天內最近收盤組出 19 欄：`source=STOCK_PRICE_HISTORY`、`quoteStatus=CLOSE_FALLBACK`、`closed=true`，
        `price` 為最新有效 closePrice、`previousClose` 為前一筆（僅一筆時 null），漲跌 scale 6 HALF_UP；`stockName`、
        買賣價、成交量、`updatedAt`、`premiumDiscountPct` 為 null；非台股排除台北今日列。此值是歷史收盤而非權威即時價，
        不回寫任何快取、不觸發 quote producer 或回補，CLOSE_FALLBACK 列不呼叫 Fubon live-response bridge、Fubon
        metadata 固定為 unavailable fallback 形狀。raw 200、raw 非 2xx／逾時的語意不變，`GET /api/quotes` 不套用本 fallback。
        raw 19 欄的名稱、型別、值與宣告順序不變，成功才加固定 `marketData` 四 child，後接同一份
        normalized direct quoteDetail／bidLevels／askLevels／dividendHistory。single response 只在最後追加去重的
        Fubon metadata、failure state 與 raw returned order-book，沒有 nested Fubon quote 或 global counters。台股五檔只讀 producer 已保存的
        `FUBON_BOOKS` primary 或受限 `YAHOO_TW` fallback canonical snapshot；回應不會在 request-time 外呼、
        寫入或修復快取。stored Fubon SUCCESS 只有 source、tradingDate、normalized updatedAt 都等於 raw cache
        canonical quote 時才可填入同一份既有 top-level quote fields；不符合時 raw fields 與獨立 ETF NAV
        `premiumDiscountPct` 完全保留。所有 child fail-soft，不會遮蔽有效 raw quote；本 API 不會回傳目前使用者的持股、成本、
        交易或資產快照。
      parameters:
        - name: code
          in: query
          required: true
          description: 標的代號；controller 僅要求參數存在，不另做格式驗證。
          schema:
            type: string
          example: EXM-TW-001
        - name: market
          in: query
          required: true
          description: 市場；可用值為台股、美股、英股。
          schema:
            type: string
            enum: [台股, 美股, 英股]
          example: 台股
        - name: start
          in: query
          required: false
          description: 與 end 同時提供的 ISO chart 起日；兩者皆省略時為台北今天往前一年。
          schema: {type: string, format: date}
          example: '2025-01-15'
        - name: end
          in: query
          required: false
          description: 與 start 同時提供的 ISO chart 迄日；最長十年且不得晚於台北今天。
          schema: {type: string, format: date}
          example: '2026-01-15'
      responses:
        '200':
          description: Redis 命中的最新報價（`quoteStatus` 沿用 raw 值），或 raw 204 後由 30 日內最近收盤組成的 `quoteStatus=CLOSE_FALLBACK`／`source=STOCK_PRICE_HISTORY` 歷史收盤回應。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailedLatestQuote'
              examples:
                synthetic:
                  summary: 去識別化合成範例
                  value: {stockCode: EXM-TW-001, stockName: 範例科技, market: 台股, price: 100.25, previousClose: 99.50, priceChange: 0.75, changePercent: 0.753769, buyPrice: 100.20, sellPrice: 100.30, openPrice: 99.80, highPrice: 101.00, lowPrice: 99.60, volume: 123456, tradingDate: '2026-01-15', updatedAt: '2026-01-15T10:15:30.123456789', closed: false, source: SYNTHETIC_EXAMPLE, quoteStatus: LIVE, premiumDiscountPct: null, marketData: {chart: {status: NO_DATA, message: '目前無走勢資料', requestedStart: '2025-01-15', requestedEnd: '2026-01-15', series: {dates: [], prices: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], latest: null, daily: {dates: [], opens: [], highs: [], lows: [], closes: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], currentClose: null, previousClose: null, latest: null}, weekly: {dates: [], opens: [], highs: [], lows: [], closes: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], currentClose: null, previousClose: null, latest: null}}, intraday: {status: NO_DATA, message: '目前無分時資料', tradingDate: null, ticks: []}}, quoteDetail: {stockCode: EXM-TW-001, stockName: 範例科技, market: 台股, supported: true, available: false, source: null, message: '暫時無法取得行情五檔', sourceTime: null, fetchedAt: null, marketStatus: UNKNOWN, price: null, previousClose: null, openPrice: null, highPrice: null, lowPrice: null, averagePrice: null, change: null, changePercent: null, turnoverYi: null, volumeLots: null, previousVolumeLots: null, amplitudePercent: null, innerVolumeLots: null, outerVolumeLots: null, innerPercent: null, outerPercent: null, bidTotalLots: null, askTotalLots: null, levels: []}, etfConstituents: {stockCode: EXM-TW-001, market: 台股, supported: false, source: null, asOfDate: null, message: 'ETF 成分股資料暫時不可用', holdings: []}, dividends: {stockCode: EXM-TW-001, market: 台股, source: null, message: '股利資料暫時不可用', rows: []}}}
                closeFallback:
                  summary: 去識別化合成範例（raw 204 後的 30 日內最近收盤 fallback）
                  value: {stockCode: EXM-TW-001, stockName: null, market: 台股, price: 100.000000, previousClose: 98.000000, priceChange: 2.000000, changePercent: 2.040816, buyPrice: null, sellPrice: null, openPrice: 98.500000, highPrice: 101.000000, lowPrice: 98.000000, volume: null, tradingDate: '2026-01-16', updatedAt: null, closed: true, source: STOCK_PRICE_HISTORY, quoteStatus: CLOSE_FALLBACK, premiumDiscountPct: null, marketData: {chart: {status: NO_DATA, message: '目前無走勢資料', requestedStart: '2025-01-15', requestedEnd: '2026-01-15', series: {dates: [], prices: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], latest: null, daily: {dates: [], opens: [], highs: [], lows: [], closes: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], currentClose: null, previousClose: null, latest: null}, weekly: {dates: [], opens: [], highs: [], lows: [], closes: [], ma5: [], ma20: [], ma60: [], ma240: [], k: [], d: [], j9: [], k3d2: [], rsv: [], ema12: [], ema26: [], dif: [], macd: [], osc: [], rsi5: [], rsi10: [], bias10: [], bias20: [], b10b20: [], wr9: [], currentClose: null, previousClose: null, latest: null}}, intraday: {status: NO_DATA, message: '目前無分時資料', tradingDate: null, ticks: []}}, quoteDetail: {stockCode: EXM-TW-001, stockName: null, market: 台股, supported: true, available: false, source: null, message: '暫時無法取得行情五檔', sourceTime: null, fetchedAt: null, marketStatus: UNKNOWN, price: null, previousClose: null, openPrice: null, highPrice: null, lowPrice: null, averagePrice: null, change: null, changePercent: null, turnoverYi: null, volumeLots: null, previousVolumeLots: null, amplitudePercent: null, innerVolumeLots: null, outerVolumeLots: null, innerPercent: null, outerPercent: null, bidTotalLots: null, askTotalLots: null, levels: []}, etfConstituents: {stockCode: EXM-TW-001, market: 台股, supported: false, source: null, asOfDate: null, message: 'ETF 成分股資料暫時不可用', holdings: []}, dividends: {stockCode: EXM-TW-001, market: 台股, source: null, message: '股利資料暫時不可用', rows: []}}, fubonSupported: true, fubonAvailable: false, fubonMessage: 暫時無法取得富邦即時回應, fubonReceivedAt: null, fubonBatchId: null, fubonResponseStatus: null, fubonFailureReason: null, fubonReturnedOrderBook: null}
        '204':
          description: raw 204（price cache miss、price Redis 讀取失敗或 price payload 無法解析）且 30 日內收盤 fallback 亦查無（空陣列或無有效 closePrice）或失敗（非 2xx、逾時）；沒有 response body。fallback 失敗不會改回 5xx，NAV enrichment 失敗也不會產生 204。
        '400':
          description: code／market 缺少，或 start/end 未同時提供、格式不合法、順序錯誤、未來日或超過十年窗口。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                missingMarket:
                  value: {type: 'about:blank', title: Public quote data unavailable, status: 400, detail: 報價日期參數不合法, instance: /api/quotes/one}
        '502':
          $ref: '#/components/responses/NginxBadGateway'
        '504':
          $ref: '#/components/responses/NginxGatewayTimeout'
  /api/public/market-index:
    get:
      tags: [公開大盤]
      operationId: getPublicMarketIndex
      summary: 取得大盤日線或當日分時圖表
      description: 參數會去除前後空白並忽略大小寫。range=d 為 INTRADAY，其餘為 DAILY；下游 transport、HTTP 或 decode 失敗採完整空資料 200，typed malformed tradeValue 則回 502。
      parameters:
        - name: market
          in: query
          required: false
          description: 指數 catalog code；可用值為 TWSE、TPEX、DJI、SPX、IXIC、SOX、FTSE、DAX、KOSPI、N225，空白或省略時預設 TWSE。
          schema:
            type: string
            enum: [TWSE, TPEX, DJI, SPX, IXIC, SOX, FTSE, DAX, KOSPI, N225]
            default: TWSE
          example: TPEX
        - name: range
          in: query
          required: false
          description: 圖表區間；可用值為 d、1m、3m、6m、1y、2y、5y、10y；d 表示當日分時，其餘為日線回看。
          schema:
            type: string
            enum: [d, 1m, 3m, 6m, 1y, 2y, 5y, 10y]
            default: 1y
          example: 1m
      responses:
        '200':
          description: 完整、陣列彼此對齊的圖表 response；無資料時陣列為空且 nullable 摘要欄位為 null。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketIndexResponse'
              examples:
                syntheticDaily:
                  value:
                    market: TWSE
                    marketLabel: 台股集中市場
                    range: 1m
                    rangeLabel: 1 個月
                    mode: DAILY
                    tradingDate: null
                    labels: ['2026-01-14', '2026-01-15']
                    closes: [20100.25, 20200.50]
                    ma5: [null, 20050.00]
                    ma20: [null, null]
                    ma60: [null, null]
                    ma240: [null, null]
                    volumes: [1000000, null]
                    turnovers: [20100250000.00, null]
                    hasVolume: true
                    previousClose: null
                    lastClose: null
                    change: null
                    changePercent: null
                    supportedMarkets:
                      - {value: TWSE, label: 台股集中市場}
                      - {value: TPEX, label: 台股櫃買市場}
                      - {value: DJI, label: 道瓊工業}
                      - {value: SPX, label: 標普 500}
                      - {value: IXIC, label: 那斯達克綜合}
                      - {value: SOX, label: 費城半導體}
