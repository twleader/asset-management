          $ref: '#/components/responses/NginxGatewayTimeout'
  /api/public/trading-radar/stock:
    get:
      tags: [公開交易雷達]
      operationId: getPublicTradingRadarStockDetail
      summary: 取得今日交易雷達指定股票的展開資料
      description: >-
        只接受一個已 URL-encoded 的 `stockCode` 與一個 `market`，兩者共同構成精確 selector，
        用以消除跨市場同代號歧義。BFF 先在本地驗證參數，通過後才以已解析 owner 身分（不帶 `email`
        時為 configured-admin；帶合法 `email` 時為該帳號）呼叫 business 一次 current read；
        `email` 格式驗證優先於 stockCode／market selector；email 合法或省略時，selector 的既有 400 契約不變。
        不快取、不重新整理、不寫 snapshot，且只回本日結果已存在的標的。不存在時固定回已消毒的
        404，不洩漏其他標的或 owner 資訊。
      parameters:
        - name: stockCode
          in: query
          required: true
          description: 1 至 12 個英數、`.` 或 `-` 的股票代號；前後空白會移除。
          schema: {type: string, pattern: '^[A-Za-z0-9.\\-]{1,12}$'}
          example: 2330
        - name: market
          in: query
          required: true
          description: 1 至 10 個 Unicode 字母或數字的市場字串；前後空白會移除。
          schema: {type: string, pattern: '^[\\p{L}0-9]{1,10}$'}
          example: 台股
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
            maxLength: 254
          description: >-
            選擇要查詢的帳號 email；省略時預設回傳 configured-admin（主要管理者）的資料。
            帶入時僅需該帳號存在且狀態為 ACTIVE，不需為 configured-admin。
            格式不合法回 400；查無帳號或帳號非 ACTIVE 回 503（與 configured-admin 不可用時相同的錯誤契約，
            刻意不區分「查無」與「停用」以避免此參數成為帳號列舉工具）。
