        calculationPolicySha256:
          "$ref": "#/components/schemas/SrppSha256"
          description: 伺服器以 SHA-256(JCS(政策文件)) 計算的政策內容雜湊。
        formulaSetSha256:
          "$ref": "#/components/schemas/SrppSha256"
          description: 伺服器以 SHA-256(JCS(公式 manifest)) 計算的公式集雜湊；manifest 改動即產生不同值。
        formulaVersion:
          type: string
          description: 公式版本識別；舊固定包為 ASSET_MGMT_SRPP_V1，新發布固定包為 ASSET_MGMT_SRPP_V2。V2 manifest 的 JCS SHA-256 為 0f3d9b67dcb7d519f8ef5e9ee378d86eaf26228409199bc487036732e0186e86。
          minLength: 1
        scope:
          type: string
          const: LISTED_CALCULATIONS_ONLY
          description: 適用範圍，常數 `LISTED_CALCULATIONS_ONLY`：只涵蓋 manifest 明列的計算，不是完整投資政策或交易決策。
      required:
      - policyBundleSha256
      - calculationPolicySha256
      - formulaSetSha256
      - formulaVersion
      - scope
    SrppContext:
      type: object
      additionalProperties: false
      description: 一個不可變 package 的計算內容：發布後不可更改；同一 package 的輸入截點、資料修訂與政策相同。contextContentSha256 = SHA-256(UTF-8(JCS(context)))。
      properties:
        packageId:
          type: string
          description: package 識別（小寫 UUID）；固定摘要與 evidence 以此查詢。
          format: uuid
        schemaVersion:
          type: string
          const: 1.0.0
          description: context 結構版本，常數 `1.0.0`。
        generatedAt:
          type: string
          description: package 發布前的產生時間（RFC 3339，+08:00，秒精度）；必須 ≥ dataCutoffAt 與所有 source 的 capturedAt，且 ≤ freshness.checkedAt。
          format: date-time
        dataCutoffAt:
          type: string
          description: 輸入截點（＝assets 來源的 capturedAt）；必須 ≤ generatedAt。
          format: date-time
        tradingDate:
          type: string
          description: 台股交易日（ISO 8601），必須等於 query 的 tradingDate。
          format: date
        slot:
          type: string
          description: 業務時段，必須等於 query 的 slot：`09:05` 早盤時段（09:05–11:39 產生）；`11:40` 午盤時段（11:40–13:55 產生）。
          enum:
          - '09:05'
          - '11:40'
        timezone:
          type: string
          const: Asia/Taipei
          description: 所有日期與無時區時間的解讀時區，常數 `Asia/Taipei`。
        ownerKey:
          "$ref": "#/components/schemas/SrppId"
          description: 每個帳號一個、由 producer 產生的隨機識別（UUID 字串）；不是 owner id 或 email，無法反推帳號。
        assetSnapshotId:
          "$ref": "#/components/schemas/SrppId"
          description: 凍結所依據的資產快照 id（以字串傳輸）。
        assetSnapshotDate:
          type: string
          description: 凍結所依據的資產快照日期（ISO 8601）。
          format: date
        policy:
          "$ref": "#/components/schemas/SrppPolicyIdentity"
          description: 本 package 的規則包身分。
        coverage:
          type: string
          description: 整體涵蓋度：`COMPLETE` 五個模組全部 COMPLETE；`PARTIAL` 至少一個模組非 COMPLETE（本版 funding 與 completedTechnicals 固定 UNAVAILABLE，故恆為 PARTIAL）。
          enum:
          - COMPLETE
          - PARTIAL
        sources:
          type: array
          items:
            "$ref": "#/components/schemas/SrppSource"
            description: 一份凍結來源。
          minItems: 2
          description: 本 package 凍結的來源，依 sourceId 字串序排序且不重複，至少兩項（本版固定 assets、calendar、policy）。
        modules:
          type: object
          additionalProperties: false
          description: 固定五個計算模組，缺一不可。
          properties:
            assets:
              "$ref": "#/components/schemas/SrppAssetsModule"
              description: 資產對帳與存款分組模組。
            allocation:
              "$ref": "#/components/schemas/SrppAllocationModule"
              description: 總曝險配置差距模組。
            cashIncome:
              "$ref": "#/components/schemas/SrppCashIncomeModule"
              description: 基礎收益加總模組。
            funding:
              "$ref": "#/components/schemas/SrppFundingModule"
              description: 買前資金基礎模組（本版 UNAVAILABLE）。
            completedTechnicals:
              "$ref": "#/components/schemas/SrppTechnicalsModule"
              description: 完成日技術資料模組（本版 UNAVAILABLE）。
          required:
          - assets
          - allocation
          - cashIncome
          - funding
          - completedTechnicals
        tradingAuthorized:
          type: boolean
          const: false
          description: 是否授權交易，恆為常數 `false`：HTTP 200 與 COMPLETE 都不代表可執行交易。
        requiresOriginalDailyChecks:
          type: boolean
          const: true
          description: 恆為常數 `true`：使用端仍必須執行原有每日檢查與即時資料核對，不得以本結果取代。
      required:
      - packageId
      - schemaVersion
      - generatedAt
      - dataCutoffAt
      - tradingDate
      - slot
      - timezone
      - ownerKey
      - assetSnapshotId
      - assetSnapshotDate
      - policy
      - coverage
      - sources
      - modules
      - tradingAuthorized
      - requiresOriginalDailyChecks
    SrppFreshness:
      type: object
      additionalProperties: false
      description: 讀取當下另行核對的新鮮度（不在 context hash 內）；CURRENT 只代表來源修訂、日曆與規則包仍相符，不代表行情時效。
      properties:
        status:
          type: string
          description: 新鮮度：`CURRENT` 快照 revision、日曆與規則包皆仍相符（最新模式唯一接受的狀態），兩個陣列皆空；`STALE` 至少一個來源已變更，列於 changedSourceIds，僅供稽核；`UNKNOWN` 無法核對（例如日曆快取不可用），changedSourceIds 為空。
          enum:
          - CURRENT
          - STALE
          - UNKNOWN
        checkedAt:
          type: string
          description: 本次核對時間（RFC 3339，+08:00）；必須 ≥ context.generatedAt。
          format: date-time
        changedSourceIds:
          type: array
          items:
            "$ref": "#/components/schemas/SrppId"
            description: 一個已變更來源的 sourceId。
          uniqueItems: true
          description: 已變更的 sourceId（例如 assets、calendar），依字串序排序且不重複；CURRENT 時為空。
        reasonCodes:
          type: array
          items:
            type: string
            description: 具名穩定原因碼，不包含帳號、SQL 或例外堆疊。
            pattern: "^[A-Z][A-Z0-9_]*$"
          uniqueItems: true
          description: 具名穩定原因碼清單（`^[A-Z][A-Z0-9_]*$`、不重複）；說明本層級降級、缺漏或狀態原因，不含帳號、SQL 或例外堆疊。例如 SOURCE_REVISION_CHANGED、CALENDAR_CHANGED、CALENDAR_UNVERIFIABLE；CURRENT 時為空，其他狀態至少一項。
      required:
      - status
      - checkedAt
      - changedSourceIds
      - reasonCodes
      allOf:
      - if:
          properties:
            status:
              const: CURRENT
        then:
          properties:
            changedSourceIds:
              maxItems: 0
            reasonCodes:
              maxItems: 0
        else:
          properties:
            reasonCodes:
              minItems: 1
        description: 條件規則：status 為 `CURRENT` 時 changedSourceIds 與 reasonCodes 都必須為空陣列；其他狀態 reasonCodes 至少一項。
    SrppSummaryResponse:
      type: object
      additionalProperties: false
      description: view=summary 的回應：不可變 context、其內容雜湊與本次讀取的 freshness。contextContentSha256 = SHA-256(RFC 8785 JCS(context))，不是 SRPP 既有的 INPUT_SNAPSHOT_SHA256。
      properties:
        kind:
          type: string
          const: SUMMARY
          description: 回應種類，常數 `SUMMARY`。
        context:
          "$ref": "#/components/schemas/SrppContext"
          description: 不可變的 package 計算內容。
        contextContentSha256:
          "$ref": "#/components/schemas/SrppSha256"
          description: SHA-256(UTF-8(JCS(context)))；BFF 會重新計算並拒絕不符的上游回應。
        freshness:
          "$ref": "#/components/schemas/SrppFreshness"
          description: 本次讀取的新鮮度核對結果。
      required:
      - kind
      - context
      - contextContentSha256
      - freshness
    SrppEvidenceResponse:
      type: object
      additionalProperties: false
      description: view=evidence 的回應：只讀該 owner／package 已凍結的單一來源原文，不抓取新證據，也不暴露來源 URL 或檔案路徑。
      properties:
        kind:
          type: string
          const: EVIDENCE
          description: 回應種類，常數 `EVIDENCE`。
        packageId:
          type: string
          description: 來源所屬 package（小寫 UUID），必須等於 query 的 packageId。
          format: uuid
        sourceId:
          "$ref": "#/components/schemas/SrppId"
          description: 來源識別，必須等於 query 的 sourceId，且在該 package 為 AVAILABLE。
        bodyMediaType:
          type: string
          const: application/json
          description: body 的媒體型別，常數 `application/json`。
        bodyEncoding:
          type: string
          const: UTF-8
          description: body 的字元編碼，常數 `UTF-8`。
        body:
          type: string
          description: 凍結當下的來源 JSON 原文，以字串回傳；依 UTF-8 計算 bodySha256，不得 parse 後重新 stringify。
        bodySha256:
          "$ref": "#/components/schemas/SrppSha256"
          description: SHA-256(UTF-8(body))，必須等於 context 中該 source 的 bodySha256。
      required:
      - kind
      - packageId
      - sourceId
      - bodyMediaType
      - bodyEncoding
      - body
      - bodySha256
    SrppProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details：本路由所有應用錯誤的固定七欄格式，文案由 BFF 固定目錄輸出，不含帳號、SQL、URI 或例外堆疊；Nginx 自身的 502／504 仍可能是 HTML。
      properties:
        type:
          type: string
          const: about:blank
          description: problem 類型，常數 `about:blank`。
        title:
          type: string
          description: 依 code 固定的英文標題。
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 與 HTTP status 相同的整數狀態碼。
        detail:
          type: string
          description: 依 code 固定、經清理的繁體中文說明。
        instance:
          type: string
          const: "/api/public/srpp/daily-context"
          description: 發生錯誤的公開路徑，常數 `/api/public/srpp/daily-context`。
        code:
          type: string
          description: 穩定錯誤碼：`INVALID_REQUEST`（400）query 不合法；`CONTEXT_NOT_FOUND`（404）查無該 owner 的 package；`SOURCE_EVIDENCE_NOT_FOUND`（404）package 中查無該 AVAILABLE 來源；`CONTEXT_STALE`（409）最新 package 的來源已變更；`POLICY_UNSUPPORTED`（409）規則包未登錄或未通過驗證（registry 空時一律如此）；`CONTEXT_IDENTITY_MISMATCH`（409）package 的日期／時段／規則包與 query 不符；`NON_TRADING_DAY`（409）非台股交易日；`CALENDAR_UNAVAILABLE`（503，可重試）交易日曆無法確認；`OWNER_UNAVAILABLE`（503）帳號查無、停用或查詢失敗；`CONTEXT_NOT_READY`（503，可重試）時段未到、尚未產生或上游逾時；`UPSTREAM_INVALID`（502）上游回應不合法；`INTERNAL_ERROR`（500）未預期錯誤。
          enum:
          - INVALID_REQUEST
          - CONTEXT_NOT_FOUND
          - SOURCE_EVIDENCE_NOT_FOUND
          - CONTEXT_STALE
          - POLICY_UNSUPPORTED
          - CONTEXT_IDENTITY_MISMATCH
          - NON_TRADING_DAY
          - CALENDAR_UNAVAILABLE
          - OWNER_UNAVAILABLE
          - CONTEXT_NOT_READY
          - UPSTREAM_INVALID
          - INTERNAL_ERROR
        retryable:
          type: boolean
          description: 同一請求稍後重試是否可能成功；僅 CALENDAR_UNAVAILABLE 與 CONTEXT_NOT_READY 為 true，其餘（含 OWNER_UNAVAILABLE）為 false。
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - retryable
    SrppCaptureProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details：SRPP 事件證據（capture）與日報決策（evaluate）兩個 POST 的固定七欄錯誤格式（需要逐項錯誤的 code 另帶選填 errors）；文案由 BFF 與 business 的 capture 專用目錄依 code 固定輸出，不含帳號、SQL、內部 URL 或例外訊息，且一律 Cache-Control no-store。
      properties:
        type:
          type: string
          const: about:blank
          description: problem 類型，常數 `about:blank`。
        title:
          type: string
          description: 依 code 固定的英文標題。
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 與 HTTP status 相同的整數狀態碼。
        detail:
          type: string
          description: 依 code 固定、經清理的繁體中文說明。
        instance:
          type: string
          enum:
          - /api/public/srpp/event-evidence/capture
          - /api/public/srpp/daily-decision/evaluate
          description: 發生錯誤的公開請求路徑：`/api/public/srpp/event-evidence/capture` 或 `/api/public/srpp/daily-decision/evaluate`。
        code:
          type: string
          enum:
          - RUN_METADATA_MISMATCH
          - INVALID_REQUEST
          - UNSUPPORTED_MEDIA_TYPE
          - NON_TRADING_DAY
          - POLICY_UNSUPPORTED
          - SWAGGER_MISMATCH
          - OWNER_UNAVAILABLE
          - CALENDAR_UNAVAILABLE
          - CONTEXT_NOT_READY
          - UPSTREAM_INVALID
          - INTERNAL_ERROR
          - BUNDLE_METADATA_MISMATCH
          - BUNDLE_CONTENT_CONFLICT
          description: 穩定錯誤碼：`RUN_METADATA_MISMATCH`（409，僅決策）同slot建立metadata不同；`INVALID_REQUEST`（400）body 為空或請求不合法；`UNSUPPORTED_MEDIA_TYPE`（415）Content-Type 不是 application/json；`NON_TRADING_DAY`（409）非台股交易日；`POLICY_UNSUPPORTED`（409）規則包未登錄或未通過驗證；`SWAGGER_MISMATCH`（409）swaggerSha256 與已發布 Swagger 不一致；`OWNER_UNAVAILABLE`（503）帳號查無、停用或查詢失敗；`CALENDAR_UNAVAILABLE`（503，可重試）交易日曆無法確認；`CONTEXT_NOT_READY`（503，可重試）計算脈絡尚未就緒；`UPSTREAM_INVALID`（502）上游回應不合法；`INTERNAL_ERROR`（500）未預期錯誤；`BUNDLE_METADATA_MISMATCH`（409，僅事件證據）同識別既有收據的規則包或 Swagger 雜湊不同；`BUNDLE_CONTENT_CONFLICT`（409，僅事件證據）同識別既有收據內容不同。事件證據的 422 `EVIDENCE_REJECTED` 使用專用的 `SrppEvidenceRejectedProblem`。
        retryable:
          type: boolean
          description: 同一請求稍後重試是否可能成功；僅 CALENDAR_UNAVAILABLE 與 CONTEXT_NOT_READY 為 true，其餘為 false。
        errors:
          type: array
          description: 選填的逐項錯誤清單；只有需要逐項說明的 code 才出現，其他 problem 不帶此欄。
          items:
            type: object
            additionalProperties: true
            required:
            - code
            description: 單一逐項錯誤；code 必填，各端點可另附定位欄位。
            properties:
              code:
                type: string
                description: 逐項錯誤碼，由各端點的契約定義。
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - retryable
    SrppDailyDecisionRequest:
      type: object
      additionalProperties: false
      description: 只接受識別与metadata，禁止caller提交候選、張數、價格或來源。省略ownerEmail解析configured-admin，slot須不晚於台北現在。
      required:
      - tradingDate
      - slot
      - policyBundleSha256
      - swaggerSha256
      properties:
        ownerEmail:
          type: string
          description: 選填ACTIVE owner email，省略configured-admin。
          format: email
          maxLength: 254
          pattern: "^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}$"
        tradingDate:
          type: string
          description: 必須為台北今天且台股交易日。
          format: date
        slot:
          type: string
          description: '09:05或11:40且必須已到該時段。'
          enum:
          - '09:05'
          - '11:40'
        policyBundleSha256:
          type: string
          description: 新擷取必須命中完整核對政策；replay綁定舊metadata。
          pattern: "^[0-9a-f]{64}$"
        swaggerSha256:
          type: string
          description: 新擷取必須核對已發布Swagger，replay綁定舊metadata。
          pattern: "^[0-9a-f]{64}$"
    SrppEventEvidenceCaptureRequest:
      type: object
      additionalProperties: false
      description: 事件證據擷取 request（Requirement 181）：排程 LLM 對六項國際政經風險的判讀分數與引用。結構、型別、未知欄位與長度錯誤回 400；類別代碼、重複、分數範圍與引用內容錯誤屬證據驗證，回 422。結果欄位（score、assessed、evidenceStatus、totalScore、assessedCount、riskMode、tradeAuthorization）由伺服器產生，出現在 request 即 400。
      required: [tradingDate, slot, consumer, decisionId, policyBundleSha256, swaggerSha256, categories]
      properties:
        ownerEmail: {type: string, format: email, maxLength: 254, pattern: '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$', description: 選填；指定 owner 帳號（不分大小寫，最多 254 字元）。省略時用 configured-admin；有值時該帳號必須 ACTIVE，否則 503 OWNER_UNAVAILABLE。BFF 只用它解析 owner，business 不以它當 owner 識別，也不納入內容雜湊。}
        tradingDate: {type: string, format: date, description: 必填；yyyy-MM-dd，必須等於伺服器 Asia/Taipei 今天且為台股交易日。}
        slot: {type: string, enum: ['09:05', '11:40'], description: '必填；日報時段，只接受 09:05 或 11:40。'}
        analysisProfile: {type: string, enum: [TW_DAILY], default: TW_DAILY, description: 選填；分析設定檔，缺省視為 TW_DAILY，有值只可 TW_DAILY；屬識別的一部分。}
        consumer: {type: string, enum: [Claude, Codex], description: 必填；判讀者軌道 Claude 或 Codex，兩軌各自獨立成 bundle。}
        decisionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$', maxLength: 100, description: 必填；即 SRPP report_facts.json 的 decision_id；重跑會有新 ID，因此是新的 bundle。}
        policyBundleSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 必填；已登錄規則包的 64 位小寫 hex SHA-256，只當查詢鍵（未登錄回 409 POLICY_UNSUPPORTED）；計分使用 SrppRiskRubricV1 而非規則包內容。}
        swaggerSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 必填；呼叫端起跑時核對的 9090 Swagger Markdown 位元組 SHA-256，必須等於伺服器已發布身分（否則 409 SWAGGER_MISMATCH）。}
        categories:
          type: array
          maxItems: 12
          description: 必填；六項風險類別各恰好一筆（順序不拘）。超過 12 項回 400；缺少、重複或未知類別回 422。
          items: {$ref: '#/components/schemas/SrppEventEvidenceCategoryClaim', description: 單一風險類別的判讀分數與引用來源。}
        officialEvents:
          type: array
          maxItems: 100
          default: []
          description: 選填，缺省視為空陣列；D-092 逐標的官方事件揭露，永遠中性，不影響任何分數、結果或 gate。symbol 重複回 422 OFFICIAL_EVENT_INVALID。
          items: {$ref: '#/components/schemas/SrppEventEvidenceOfficialEventClaim', description: 單一標的的官方事件狀態與來源。}
    SrppEventEvidenceCategoryClaim:
      type: object
      additionalProperties: false
      description: 單一風險類別的判讀。有至少一筆通過驗證的來源才算已評；claimedScore 非 0 卻沒有通過驗證的來源、或 conflicting=true 時回 422 SCORE_WITHOUT_EVIDENCE。
      required: [code, claimedScore, sources]
      properties:
        code: {type: string, maxLength: 64, enum: [fed, geopolitics, oil, taiwan_politics, us_taiwan_inflation, semiconductor_cycle_and_advanced_process], description: '必填；風險類別代碼：fed（上限 2）、geopolitics（上限 3）、oil（上限 2）、taiwan_politics（上限 3）、us_taiwan_inflation（上限 2）、semiconductor_cycle_and_advanced_process（上限 3）。超過 64 字元回 400；其他代碼回 422 UNKNOWN_CATEGORY。'}
        claimedScore: {type: integer, format: int32, minimum: 0, maximum: 3, description: 必填；LLM 依 rubric 判讀的 JSON 整數分數，須在 0 至該類上限之間。不是整數或超出 Java int 範圍回 400；超出 0 至上限回 422 SCORE_OUT_OF_RANGE。}
        conflicting: {type: boolean, default: false, description: 選填，缺省 false；LLM 判定來源互相矛盾或不可比時為 true，此時該類一律未評且 claimedScore 必須為 0。}
        sources:
          type: array
          maxItems: 20
          description: 必填，可為空陣列（＝無已驗證來源、未評）；最多 20 筆，依請求順序產生 sourceReceipts。任一來源未通過驗證即整包 422，並以 sourceIndex 指出位置。
          items: {$ref: '#/components/schemas/SrppEventEvidenceSource', description: 三種 kind 之一的引用來源。}
    SrppEventEvidenceSource:
      description: 引用來源，依 kind 恰為三者之一；其他 kind、缺必填或多餘欄位回 400。字串欄位不得空白。
      oneOf:
        - {$ref: '#/components/schemas/SrppEventEvidenceNewsHeadlineSource', description: kind=NEWS_HEADLINE，伺服器對 news_headline 驗證，provenance DB_VERIFIED。}
        - {$ref: '#/components/schemas/SrppEventEvidenceApiResponseSource', description: kind=API_RESPONSE，只檢查 endpoint 允許清單與 observedDate，provenance ATTESTED。}
        - {$ref: '#/components/schemas/SrppEventEvidenceOfficialPageSource', description: kind=OFFICIAL_PAGE，只檢查網域允許清單、retrievedAt 與 period，provenance ATTESTED。}
    SrppEventEvidenceNewsHeadlineSource:
      type: object
      additionalProperties: false
      description: 引用 public_info_*.json 的一則條目（其單一上游為 news_headline）；source、url、category、title、publishedAt 直接複製 JSON 條目的值。
      required: [kind, source, url, category, title, publishedAt]
      properties:
        kind: {type: string, const: NEWS_HEADLINE, description: 固定 NEWS_HEADLINE。}
        source: {type: string, minLength: 1, maxLength: 100, description: 爬蟲來源代號（如 ltn、twse、bot-fx），參與 dedupe_key。}
        url: {type: string, minLength: 1, maxLength: 1024, description: 原文或查詢頁連結，參與 dedupe_key；伺服器不連線。}
        category: {type: string, minLength: 1, maxLength: 32, description: news_headline 的爬蟲分類（如 news、fx、us-market），參與 dedupe_key，與風險類別代碼無關。}
        title: {type: string, minLength: 1, maxLength: 500, description: 條目標題；一般 category 以 NFKC、臺→台、空白折疊、trim 正規化後須與資料庫列相等，volatile category 不比對。}
        publishedAt: {type: string, format: date-time, description: 'ISO-8601 含 offset 的發布時間（JSON 條目為秒精度 +08:00）；一般 category 截斷到秒後須與資料庫列同一 instant。無法解析回 422 CITATION_NOT_FOUND。'}
    SrppEventEvidenceApiResponseSource:
      type: object
      additionalProperties: false
      description: 引用某支 9090 API 回應的觀察日；伺服器不重新呼叫該 API。
      required: [kind, endpoint, observedDate]
      properties:
        kind: {type: string, const: API_RESPONSE, description: 固定 API_RESPONSE。}
        endpoint: {type: string, minLength: 1, maxLength: 200, description: 9090 API 路徑；必須在設定的允許清單（預設 /api/public/commodity-prices、/api/public/market-index、/api/public/exchange-rate/usd-twd），否則 422 SOURCE_NOT_ALLOWED。}
        observedDate: {type: string, format: date, description: yyyy-MM-dd 觀察日；不得晚於 tradingDate，也不得早於其往前 31 天（可設定），否則或無法解析回 422 SOURCE_PERIOD_INVALID。}
    SrppEventEvidenceOfficialPageSource:
      type: object
      additionalProperties: false
      description: 引用官方機構網頁的具名期間；伺服器不重抓該網頁。
      required: [kind, url, retrievedAt, period]
      properties:
        kind: {type: string, const: OFFICIAL_PAGE, description: 固定 OFFICIAL_PAGE。}
        url: {type: string, format: uri, minLength: 1, maxLength: 1024, description: 必須 https，且 host 等於允許網域或其子網域（預設 federalreserve.gov、bls.gov、bea.gov、treasury.gov、dgbas.gov.tw、stat.gov.tw、cbc.gov.tw、twse.com.tw、tpex.org.tw），否則 422 SOURCE_NOT_ALLOWED。}
        retrievedAt: {type: string, format: date-time, description: ISO-8601 含 offset 的讀取時間；必須落在 tradingDate 當日（Asia/Taipei）且不晚於伺服器現在加 5 分鐘，否則 422 SOURCE_PERIOD_INVALID。}
        period: {type: string, pattern: '^(?:19|20)\d{2}(?:-(?:0[1-9]|1[0-2])(?:-(?:0[1-9]|[12]\d|3[01]))?|-Q[1-4])$', description: 資料所屬期間，如 2026-09、2026-09-30 或 2026-Q3；是 SRPP RISK_SOURCE_PERIOD_RE 的嚴格子集（不接受斜線、年月字樣與單位數月份），不符回 422 SOURCE_PERIOD_INVALID。}
    SrppEventEvidenceOfficialEventClaim:
      type: object
      additionalProperties: false
      description: D-092 單一標的的官方事件揭露；只作揭露、永遠中性。VERIFIED_NO_EVENT 或 SOURCE_UNAVAILABLE 帶非空 sources、或 EVENT_FOUND 帶 OFFICIAL_PAGE 以外的來源，回 400。
      required: [symbol, status, sources]
      properties:
        symbol: {type: string, pattern: '^[0-9A-Z]{4,8}$', description: 標的代號，4 至 8 個數字或大寫英文字母；同一 request 內重複回 422 OFFICIAL_EVENT_INVALID。}
        status: {type: string, enum: [EVENT_FOUND, VERIFIED_NO_EVENT, SOURCE_UNAVAILABLE], description: EVENT_FOUND 有官方事件、VERIFIED_NO_EVENT 已確認無事件、SOURCE_UNAVAILABLE 無法取得來源。EVENT_FOUND 沒有任何通過驗證的 OFFICIAL_PAGE 時，回應降級為 SOURCE_UNAVAILABLE（不使整包 422）。}
        sources:
          type: array
          maxItems: 3
          description: 必填，可為空陣列；最多 3 筆且只可為 OFFICIAL_PAGE，僅 EVENT_FOUND 可帶來源。
          items: {$ref: '#/components/schemas/SrppEventEvidenceOfficialPageSource', description: 官方事件的官方頁面引用。}
    SrppEventEvidenceBundleResponse:
      type: object
      additionalProperties: false
      description: 不可變事件證據收據（首次 201、replay 200，本體相同，只有 created 與 idempotentReplay 不同）。本體以 RFC 8785 JCS 序列化；只含引用指紋、來源種類、provenance、期間、分數與雜湊，不含 request 原文、爬蟲內文、持股、現金或帳號。排程把六列分數、已評、總分、已評項數與風險模式直接取自本回應。
      required: [schemaVersion, eventBundleId, status, created, idempotentReplay, identity, rubricSha256, riskAssessment, officialEvents, tradeAuthorization, placesOrders, eventBundleContentSha256]
      properties:
        schemaVersion: {type: integer, const: 1, description: 回應結構版本，固定整數 1。}
        eventBundleId: {type: string, format: uuid, description: 此 bundle 的 UUID；同一識別的 replay 回傳同一值。}
        status: {type: string, const: FINAL, description: 固定 FINAL；收據建立後不可變。}
        created: {type: boolean, description: true 表示本次請求建立了這筆收據（201），false 表示回傳既有收據（200）；不參與內容雜湊。}
        idempotentReplay: {type: boolean, description: true 表示本次是同識別同內容的重送（200），false 表示首次建立（201）；不參與內容雜湊。}
        identity: {$ref: '#/components/schemas/SrppEventEvidenceIdentity', description: bundle 識別與 metadata（owner 已解析為內部 id，不在回應中）。}
        rubricSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 計分 rubric 的 JCS SHA-256；SRPP_RISK_RUBRIC_V1 的值為 3a780e748aa3dc8cc94053178c378069fc54b3c10a6d1a09bd32c9bc0628f378，rubric 改版時以新值揭露。}
        riskAssessment: {$ref: '#/components/schemas/SrppRiskAssessment', description: 伺服器依 rubric 機械計算的六項風險結果。}
        officialEvents:
          type: array
          maxItems: 100
          description: 依 symbol 升冪排列的官方事件揭露；永遠中性，不影響 riskAssessment。
          items: {$ref: '#/components/schemas/SrppOfficialEventReceipt', description: 單一標的的官方事件結果。}
        tradeAuthorization: {type: boolean, const: false, description: 固定 false；本收據不授權任何交易。}
        placesOrders: {type: boolean, const: false, description: 固定 false；本 API 不下單、不呼叫券商。}
        eventBundleContentSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 去除 created、idempotentReplay 與本欄後的本體經 RFC 8785 JCS 的 UTF-8 SHA-256（小寫 hex）；SRPP 將它納入 INPUT_SNAPSHOT_SHA256。}
    SrppEventEvidenceIdentity:
      type: object
      additionalProperties: false
      description: bundle 識別（tradingDate、slot、analysisProfile、consumer、decisionId 加上內部 owner）與 metadata（policyBundleSha256、swaggerSha256）。
      required: [tradingDate, slot, analysisProfile, consumer, decisionId, policyBundleSha256, swaggerSha256]
      properties:
        tradingDate: {type: string, format: date, description: 台股交易日（Asia/Taipei）。}
        slot: {type: string, enum: ['09:05', '11:40'], description: '日報時段 09:05 或 11:40。'}
        analysisProfile: {type: string, const: TW_DAILY, description: 分析設定檔，目前固定 TW_DAILY。}
        consumer: {type: string, enum: [Claude, Codex], description: 判讀者軌道 Claude 或 Codex。}
        decisionId: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$', description: 呼叫端的 decision_id。}
        policyBundleSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 建立時使用的已登錄規則包雜湊（metadata，不屬唯一識別；同識別不同值回 409 BUNDLE_METADATA_MISMATCH）。}
        swaggerSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 建立時的已發布 9090 Swagger 雜湊（metadata，不屬唯一識別）。}
    SrppRiskAssessment:
      type: object
      additionalProperties: false
      description: 六項風險的機械計分結果（D-167／D-168／D-169）；數值全部是 JSON 整數，不使用浮點。
      required: [categories, totalScore, assessedCount, riskMode]
      properties:
        categories:
          type: array
          minItems: 6
          maxItems: 6
          description: 固定依 fed、geopolitics、oil、taiwan_politics、us_taiwan_inflation、semiconductor_cycle_and_advanced_process 順序的六項結果。
          items: {$ref: '#/components/schemas/SrppRiskCategoryAssessment', description: 單一風險類別的計分結果。}
        totalScore: {type: integer, minimum: 0, maximum: 15, description: 六類 score 總和。}
        assessedCount: {type: integer, minimum: 0, maximum: 6, description: assessed=true 的類別數。}
        riskMode: {type: string, enum: [NORMAL, CAUTIOUS, DEFENSIVE], description: 任一類 score ≥ 3、或 totalScore ≥ 8、或 assessedCount < 4 為 DEFENSIVE（防禦）；否則 totalScore ≥ 5 為 CAUTIOUS（審慎）；其餘 NORMAL（正常）。}
    SrppRiskCategoryAssessment:
      type: object
      additionalProperties: false
      description: 單一風險類別結果：無已驗證來源或 conflicting=true → 0 分未評；有已驗證來源且 claimedScore=0 → 0 分已評；有已驗證來源且 claimedScore≥1 → 該分數已評。已驗證來源含 DB_VERIFIED 與 ATTESTED。
      required: [code, score, assessed, evidenceStatus, sourceReceipts]
      properties:
        code: {type: string, enum: [fed, geopolitics, oil, taiwan_politics, us_taiwan_inflation, semiconductor_cycle_and_advanced_process], description: 風險類別代碼 fed、geopolitics、oil、taiwan_politics、us_taiwan_inflation、semiconductor_cycle_and_advanced_process。}
        score: {type: integer, minimum: 0, maximum: 3, description: 計分結果（JSON 整數），不超過該類上限。}
        assessed: {type: boolean, description: true 表示該類有已驗證來源且非 conflicting（已評）；false 表示未評。}
        evidenceStatus: {type: string, enum: [EVIDENCE_INSUFFICIENT, VERIFIED_NO_RUBRIC_EVENT, RUBRIC_EVENT_FOUND], description: EVIDENCE_INSUFFICIENT 無已驗證來源或來源矛盾；VERIFIED_NO_RUBRIC_EVENT 有來源但無 rubric 事件；RUBRIC_EVENT_FOUND 有來源且有 rubric 事件。}
        sourceReceipts:
          type: array
          maxItems: 20
          description: 依請求順序的來源收據（只含指紋、種類、provenance 與期間，不含標題或原文）。
          items: {$ref: '#/components/schemas/SrppEvidenceSourceReceipt', description: 單一已驗證來源的收據。}
    SrppEvidenceSourceReceipt:
      type: object
      additionalProperties: false
      description: 單一來源收據。NEWS_HEADLINE 另有 dedupeKey，API_RESPONSE 另有 endpoint，OFFICIAL_PAGE 另有 host；其他種類不出現該欄。
      required: [kind, provenance, period]
      properties:
        kind: {type: string, enum: [NEWS_HEADLINE, API_RESPONSE, OFFICIAL_PAGE], description: 來源種類 NEWS_HEADLINE、API_RESPONSE 或 OFFICIAL_PAGE。}
        provenance: {type: string, enum: [DB_VERIFIED, ATTESTED], description: DB_VERIFIED＝該 news_headline 列存在且在新鮮度視窗內（不代表與風險類別相關）；ATTESTED＝呼叫端聲明的具名來源與期間，伺服器只檢查允許清單與期間格式、未重抓，不得視為伺服器已驗證。}
        period: {type: string, description: '來源期間：NEWS_HEADLINE 為資料庫列 published_at 截斷到秒的 yyyy-MM-ddTHH:mm:ss+08:00；API_RESPONSE 為 observedDate；OFFICIAL_PAGE 為 period。'}
        dedupeKey: {type: string, pattern: '^[0-9a-f]{64}$', description: 僅 NEWS_HEADLINE；sha256(source|url|category) 的小寫 hex，即 news_headline.dedupe_key。}
        endpoint: {type: string, maxLength: 200, description: 僅 API_RESPONSE；引用的 9090 API 路徑。}
        host: {type: string, maxLength: 1024, description: 僅 OFFICIAL_PAGE；引用網址的小寫 host。}
    SrppOfficialEventReceipt:
      type: object
      additionalProperties: false
      description: 單一標的官方事件結果；永遠中性，不影響任何分數、結果或 gate。
      required: [symbol, status, sourceReceipts]
      properties:
        symbol: {type: string, pattern: '^[0-9A-Z]{4,8}$', description: 標的代號。}
        status: {type: string, enum: [EVENT_FOUND, VERIFIED_NO_EVENT, SOURCE_UNAVAILABLE], description: 結果狀態 EVENT_FOUND、VERIFIED_NO_EVENT 或 SOURCE_UNAVAILABLE；EVENT_FOUND 沒有通過驗證的官方頁面時降級為 SOURCE_UNAVAILABLE。}
        sourceReceipts:
          type: array
          maxItems: 3
          description: 通過驗證的 OFFICIAL_PAGE 來源收據（依請求順序）；降級或非 EVENT_FOUND 時為空陣列。
          items: {$ref: '#/components/schemas/SrppEvidenceSourceReceipt', description: 官方頁面的 ATTESTED 收據。}
        downgradeReason: {type: string, enum: [SOURCE_NOT_ALLOWED, SOURCE_PERIOD_INVALID, OFFICIAL_SOURCE_MISSING], description: 只在 EVENT_FOUND 被降級時出現（否則整個欄位省略，不輸出 null）：OFFICIAL_SOURCE_MISSING 沒有任何來源；否則取第一筆來源的第一個失敗原因 SOURCE_NOT_ALLOWED（網域不允許或非 https）或 SOURCE_PERIOD_INVALID（retrievedAt 或 period 不合法）。}
    SrppEvidenceRejectedProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details：事件證據擷取的 422 EVIDENCE_REJECTED，七欄之外帶逐項 errors[]，截斷時另帶 truncated；一律 Cache-Control no-store，不寫入任何資料列。
      required: [type, title, status, detail, instance, code, retryable, errors]
      properties:
        type: {type: string, const: 'about:blank', description: 'problem 類型，常數 about:blank。'}
        title: {type: string, description: 固定英文標題 SRPP event evidence rejected。}
        status: {type: integer, const: 422, description: HTTP 狀態碼 422。}
        detail: {type: string, description: 固定、經清理的繁體中文說明。}
        instance: {type: string, const: /api/public/srpp/event-evidence/capture, description: 發生錯誤的公開請求路徑 /api/public/srpp/event-evidence/capture。}
        code: {type: string, const: EVIDENCE_REJECTED, description: 固定 EVIDENCE_REJECTED。}
        retryable: {type: boolean, const: false, description: 固定 false；必須修正 request 後再送（可用同一識別）。}
        errors:
          type: array
          minItems: 1
          maxItems: 200
          description: 逐項錯誤，依 (riskCategory 或 symbol, sourceIndex, code) 穩定排序（缺 sourceIndex 者在前），最多 200 項。
          items: {$ref: '#/components/schemas/SrppEvidenceRejectedError', description: 單一證據錯誤。}
        truncated: {type: boolean, const: true, description: 只在錯誤超過 200 項而截斷時出現，值為 true。}
    SrppEvidenceRejectedError:
      type: object
      additionalProperties: false
      description: 單一證據錯誤；風險類別錯誤帶 riskCategory（來源層級另帶 sourceIndex），officialEvents 錯誤帶 symbol。
      required: [code]
      properties:
        code: {type: string, enum: [UNKNOWN_CATEGORY, MISSING_CATEGORY, DUPLICATE_CATEGORY, SCORE_OUT_OF_RANGE, CITATION_NOT_FOUND, SNAPSHOT_STALE, SOURCE_NOT_ALLOWED, SOURCE_PERIOD_INVALID, SCORE_WITHOUT_EVIDENCE, OFFICIAL_EVENT_INVALID], description: 'UNKNOWN_CATEGORY 未知類別代碼；MISSING_CATEGORY 缺少類別；DUPLICATE_CATEGORY 類別重複；SCORE_OUT_OF_RANGE claimedScore 超出 0 至上限；CITATION_NOT_FOUND 新聞引用查無、title 或發布時間不符或 publishedAt 無法解析；SNAPSHOT_STALE 該列 fetched_at 早於交易日往前 3 個日曆日 00:00；SOURCE_NOT_ALLOWED endpoint 或網域不在允許清單（或非 https）；SOURCE_PERIOD_INVALID observedDate、retrievedAt 或 period 不合法；SCORE_WITHOUT_EVIDENCE claimedScore 非 0 卻無已驗證來源或 conflicting=true；OFFICIAL_EVENT_INVALID officialEvents 的 symbol 重複。'}
        riskCategory: {type: string, maxLength: 64, description: 六項風險類別代碼（UNKNOWN_CATEGORY 時為請求中的未知代碼）；與 NEWS_HEADLINE.category 爬蟲分類無關。}
        symbol: {type: string, pattern: '^[0-9A-Z]{4,8}$', description: officialEvents 錯誤的標的代號。}
        sourceIndex: {type: integer, minimum: 0, maximum: 19, description: 該類 sources 陣列中出錯來源的 0 起算位置；類別層級錯誤不帶此欄。}
    SrppOrchestratedProblem:
      type: object
      additionalProperties: false
      description: RFC 9457 Problem Details：三條 SRPP 按需唯讀路由使用的固定錯誤格式，不含帳號、SQL 或例外堆疊。
      properties:
        type:
          type: string
          const: about:blank
          description: problem 類型，固定為 `about:blank`。
        title:
          type: string
          description: 依穩定錯誤碼固定的英文標題。
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: 與 HTTP status 相同的整數狀態碼。
        detail:
          type: string
          description: 經清理的繁體中文錯誤說明，不包含內部識別資料。
        instance:
          type: string
          enum:
          - /api/public/srpp/calculation-context
          - /api/public/srpp/calculations
          - /api/public/srpp/market-facts
          description: 發生問題的三條 SRPP 按需唯讀路徑之一：`/api/public/srpp/calculation-context`、`/api/public/srpp/calculations` 或 `/api/public/srpp/market-facts`。
        code:
          type: string
          enum: [INVALID_REQUEST, CONTEXT_NOT_FOUND, CONTEXT_STALE, POLICY_UNSUPPORTED, OWNER_UNAVAILABLE, CONTEXT_NOT_READY, UPSTREAM_INVALID, INTERNAL_ERROR]
          description: 穩定錯誤碼；INVALID_REQUEST（400）、CONTEXT_NOT_FOUND（404）、CONTEXT_STALE／POLICY_UNSUPPORTED（409）、OWNER_UNAVAILABLE／CONTEXT_NOT_READY（503）、UPSTREAM_INVALID（502）、INTERNAL_ERROR（500）。
        retryable:
          type: boolean
          description: 同一請求稍後重試是否可能成功；只有 CONTEXT_NOT_READY 為 true。
      required: [type, title, status, detail, instance, code, retryable]
    SrppSourceRevision:
      type: object
      additionalProperties: false
      description: 單一來源在本計算或市場擷取中的固定 revision、資料時點與內容摘要。
      properties:
        sourceId:
          type: string
          description: 穩定來源識別，例如 package evidence 的 source ID 或 canonical market read。
        revision:
          type: string
          description: 來源內容版本識別，不得以 API 回應時間代替。
        dataAsOf:
          type: string
          format: date-time
          description: 來源實際代表的資料時點，必須包含時區且不得填 API 回應時間。
        bodySha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: 來源投影 UTF-8 內容的 SHA-256 小寫十六進位摘要。
      required: [sourceId, revision, dataAsOf, bodySha256]
    SrppMarketSourceRevision:
      type: object
      additionalProperties: false
      description: 市場擷取的來源修訂；收盤價或雷達只有交易日期時保留日期精度，即時觀測則保留含時區的時間。
      properties:
        sourceId: {type: string, description: 本次市場擷取使用的來源識別。}
        revision: {type: string, description: 來源投影的內容版本識別。}
        dataAsOf:
          oneOf:
          - {type: string, format: date, description: 來源僅能確認交易日期。}
          - {type: string, format: date-time, description: 來源提供含時區的觀測時間。}
          description: 來源資料的實際精度；不得用快取處理時間或補造的午夜時間。
        bodySha256: {type: string, pattern: '^[0-9a-f]{64}$', description: 來源投影的 SHA-256。}
      required: [sourceId, revision, dataAsOf, bodySha256]
    SrppCalculationContextResponse:
      type: object
      additionalProperties: false
      description: 建立本輪計算用的固定 context 身分、policy、來源 revision 與持股代碼白名單。
      properties:
        schemaVersion: {type: string, const: '1.0', description: "此按需計算 API 的回應 schema 版本，固定為 `1.0`。"}
        contextId: {type: string, format: uuid, description: "綁定 owner、package、日期、slot、policy 與來源向量的不透明識別。"}
        tradingDate: {type: string, format: date, description: "此 context 所屬的台北交易日期。"}
        slot: {type: string, enum: ['09:05', '11:40'], description: "本輪 SRPP 時段，只能是 `09:05` 或 `11:40`。"}
        policyBundleSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "伺服器 registry 已驗證的 policy bundle SHA-256。"}
        formulaSetSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "與已驗證 policy 綁定的公式集合 SHA-256。"}
        capturedAt: {type: string, format: date-time, description: "建立 context 的時間，RFC 3339 且帶明確時區。"}
        sourceVector:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/SrppSourceRevision', description: "一個不可變 source revision。"}
          description: 本輪計算必須重播的固定來源向量。
        allowedStockCodes:
          type: array
          uniqueItems: true
          maxItems: 500
          items: {type: string, description: "一個由 immutable package 凍結的 owner 持股代碼；不含觀察名單或 caller 臨時代碼。"}
          description: 後續 market-facts 查詢可選取的 owner-scoped 凍結持股代碼白名單。
        contextContentSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "移除此欄後對其餘回應套用 RFC 8785 JCS 與 SHA-256 的結果。"}
      required: [schemaVersion, contextId, tradingDate, slot, policyBundleSha256, formulaSetSha256, capturedAt, sourceVector, allowedStockCodes, contextContentSha256]
    SrppCalculationResult:
      type: object
      additionalProperties: false
      description: 單一 calculation ID 的獨立結果；不完整或尚未啟用時以 UNAVAILABLE 與原因碼明示。
      properties:
        calculationId: {type: string, enum: [ASSET_RECONCILIATION, ALLOCATION_GAP, CASH_INCOME, FUNDING_CAPACITY, COMPLETED_TECHNICALS, SYMBOL_RULE_FACTS], description: "要求的計算識別；允許 `ASSET_RECONCILIATION`、`ALLOCATION_GAP`、`CASH_INCOME`、`FUNDING_CAPACITY`、`COMPLETED_TECHNICALS`、`SYMBOL_RULE_FACTS`。"}
        status: {type: string, enum: [COMPLETE, PARTIAL, UNAVAILABLE], description: "計算狀態：`COMPLETE` 完整、`PARTIAL` 部分欄位可用、`UNAVAILABLE` 無可採用結果。"}
        formulaVersion: {type: string, description: "執行或嘗試執行的公式版本。"}
        formulaSetSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "此結果使用的公式集合 SHA-256。"}
        data: {type: object, description: "此計算的結果資料；數值使用 decimal 字串，缺值明確為 null。"}
        reasonCodes:
          type: array
          uniqueItems: true
          items: {type: string, pattern: '^[A-Z][A-Z0-9_]*$', description: "一個穩定且可機器辨識的結果原因碼。"}
          description: 說明部分結果、依賴缺失或不可用原因的代碼清單。
        sourceIds:
          type: array
          uniqueItems: true
          items: {type: string, description: "一個支援此計算結果的來源識別。"}
          description: 此計算實際使用或檢查的來源識別清單。
      required: [calculationId, status, formulaVersion, formulaSetSha256, data, reasonCodes, sourceIds]
    SrppCalculationsResponse:
      type: object
      additionalProperties: false
      description: 以同一 context 固定來源向量執行一批指定計算的結果。
      properties:
        schemaVersion: {type: string, const: '1.0', description: "此按需計算 API 的回應 schema 版本，固定為 `1.0`。"}
        contextId: {type: string, format: uuid, description: "本批結果綁定的 context 識別。"}
        tradingDate: {type: string, format: date, description: "本批結果所屬的台北交易日期。"}
        slot: {type: string, enum: ['09:05', '11:40'], description: "本批結果所屬的 SRPP 時段，只能是 `09:05` 或 `11:40`。"}
        policyBundleSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "context 中經 registry 驗證的 policy bundle SHA-256。"}
        formulaSetSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "所要求計算使用的公式集合 SHA-256。"}
        sourceVector:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/SrppSourceRevision', description: "一個固定計算來源 revision。"}
          description: 與 calculation-context 相同且按 source ID 排序的來源向量。
        coverage:
          type: object
          additionalProperties: false
          description: 每個 query 要求 calculation 的整批狀態及互斥 status 計數。
          properties:
            status: {type: string, enum: [COMPLETE, PARTIAL], description: "整批狀態：所有項目完整可用為 COMPLETE，存在部分或不可用項目為 PARTIAL。"}
            requestedCount: {type: integer, minimum: 0, description: "此次 query 要求的 calculation 數。"}
            successCount: {type: integer, minimum: 0, description: "最終 status 為 COMPLETE 的 calculation 數。"}
            partialCount: {type: integer, minimum: 0, description: "最終 status 為 PARTIAL 的 calculation 數。"}
            unavailableCount: {type: integer, minimum: 0, description: "最終 status 為 UNAVAILABLE 的 calculation 數。"}
          required: [status, requestedCount, successCount, partialCount, unavailableCount]
        calculations:
          type: array
          minItems: 1
          maxItems: 6
          items: {$ref: '#/components/schemas/SrppCalculationResult', description: "一個獨立 calculation 結果。"}
          description: 逐項計算結果；單一項目失敗不得遮蔽其他成功項目。
        contextContentSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "移除此欄後對其餘回應套用 RFC 8785 JCS 與 SHA-256 的結果。"}
      required: [schemaVersion, contextId, tradingDate, slot, policyBundleSha256, formulaSetSha256, sourceVector, coverage, calculations, contextContentSha256]
    SrppMarketMetric:
      type: object
      additionalProperties: false
      description: 以 decimal 字串表達的市場數值、單位、品質、原因碼及來源識別。
      properties:
        value: {type: [string, 'null'], pattern: '^-?(0|[1-9][0-9]*)(\\.[0-9]*[1-9])?$', description: "decimal 字串數值；不可用零代替未知值。"}
        unit: {type: string, description: "數值的明確單位與幣別基準。"}
        quality: {type: string, enum: [EXACT, ESTIMATE, UPPER_BOUND, LOWER_BOUND, UNAVAILABLE], description: "資料品質：`EXACT` 精確、`ESTIMATE` 估計、`UPPER_BOUND` 上界、`LOWER_BOUND` 下界、`UNAVAILABLE` 不可用。"}
        reasonCodes:
          type: array
          uniqueItems: true
          items: {type: string, description: "一個穩定的數值品質或缺漏原因碼。"}
          description: 此數值的缺漏或品質原因；可用時為空。
        sourceIds:
          type: array
          uniqueItems: true
          items: {type: string, description: "一個提供此數值的來源識別。"}
          description: 此數值實際使用的來源識別。
      required: [value, unit, quality, reasonCodes, sourceIds]
    SrppSymbolMarketFact:
      type: object
      additionalProperties: false
      description: 單一持股標的在一個 market capture 中的報價及雷達事實，兩者可分別不可用。
      properties:
        status: {type: string, enum: [COMPLETE, PARTIAL, UNAVAILABLE], description: "依 include 中要求的 quote/radar 子項計算；全部完整可用為 COMPLETE，有部分可用為 PARTIAL，全部不可用為 UNAVAILABLE。"}
        market: {type: string, description: "精確標的市場識別，用於防止跨市場代碼碰撞。"}
        stockCode: {type: string, description: "context 白名單內的股票代碼。"}
        quoteStatus: {type: string, enum: [LIVE, CLOSE_FALLBACK, STALE, UNAVAILABLE], description: "報價狀態：`LIVE` 即時、`CLOSE_FALLBACK` 收盤備援、`STALE` 過期、`UNAVAILABLE` 不可用。"}
        quoteDataAsOf:
          oneOf:
          - {type: string, format: date, description: 收盤報價的來源交易日期。}
          - {type: string, format: date-time, description: 即時報價的來源觀測時間。}
          - {type: 'null', description: 報價來源時點不可用或未要求報價。}
          description: 收盤來源僅有交易日時保留 ISO 日期；即時來源有可信觀測時刻才使用含時區的時間。
        quoteSourceId: {type: [string, 'null'], description: "報價 canonical source ID，不可用或未要求時為 null。"}
        lastPrice:
          anyOf:
          - $ref: '#/components/schemas/SrppMarketMetric'
            description: 可用報價 metric。
          - type: 'null'
            description: 未要求報價時為 null。
          description: 最近成交價；缺值不得轉成零。
        radarStatus: {type: string, enum: [AVAILABLE, UNAVAILABLE], description: "雷達狀態：`AVAILABLE` 有符合市場與代碼的事實、`UNAVAILABLE` 無可用資料。"}
        radarDataAsOf:
          oneOf:
          - {type: string, format: date, description: 雷達來源只能確認日期。}
          - {type: string, format: date-time, description: 雷達來源提供含時區的觀測時間。}
          - {type: 'null', description: 雷達來源時點不可用或未要求雷達。}
          description: 雷達來源僅有 asOfDate 時保留 ISO 日期，不補造時分秒。
        radarSourceId: {type: [string, 'null'], description: "雷達來源識別，不可用或未要求時為 null。"}
        radarFacts: {type: object, description: "已公開的逐標的雷達事實；缺值欄位以 null 保留。"}
        reasonCodes:
          type: array
          uniqueItems: true
          items: {type: string, description: "一個可機器辨識的報價或雷達缺漏原因碼。"}
          description: 此標的各來源的缺漏原因碼清單。
      required: [status, market, stockCode, quoteStatus, quoteDataAsOf, quoteSourceId, lastPrice, radarStatus, radarDataAsOf, radarSourceId, radarFacts, reasonCodes]
    SrppMarketFactsResponse:
      type: object
      additionalProperties: false
      description: 以單一 market capture 固定讀取的逐標的 canonical 報價與雷達事實。
      properties:
        schemaVersion: {type: string, const: '1.0', description: "此按需計算 API 的回應 schema 版本，固定為 `1.0`。"}
        contextId: {type: string, format: uuid, description: "本批市場事實使用的計算 context 識別。"}
        marketCaptureId: {type: string, format: uuid, description: "本批市場讀取的獨立擷取識別，可與 calculation source vector revision 不同。"}
        tradingDate: {type: string, format: date, description: "此批市場事實所屬的台北交易日期。"}
        slot: {type: string, enum: ['09:05', '11:40'], description: "此批市場事實所屬的 SRPP 時段，只能是 `09:05` 或 `11:40`。"}
        policyBundleSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "context 中經 registry 驗證的 policy bundle SHA-256。"}
        sourceVector:
          type: array
          maxItems: 30
          items: {$ref: '#/components/schemas/SrppMarketSourceRevision', description: "一個本次市場擷取的來源 revision。"}
          description: >-
            本批市場來源 revision 向量，每個不同來源／revision 一列並帶 revision、batch dataAsOf 與 bodySha256；逐標的
            quoteDataAsOf／radarDataAsOf 保留該標的來源日期或時間的實際精度，且其非 null source ID 必須引用本向量中的來源。
            dataAsOf 代表來源資料時點，不得使用 API 回應時間。
        symbols:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/SrppSymbolMarketFact', description: "一個逐標的市場事實列。"}
          description: 每一要求標的均有一列，單列缺漏不會使其他列失敗。
        coverage:
          type: object
          additionalProperties: false
          description: 每個 query 要求標的的整批狀態及互斥 status 計數。
          properties:
            status: {type: string, enum: [COMPLETE, PARTIAL], description: "整批狀態：所有要求標的完整可用為 COMPLETE，存在部分或不可用標的為 PARTIAL。"}
            requestedCount: {type: integer, minimum: 0, description: "此次 query 要求的凍結持股代碼數。"}
            successCount: {type: integer, minimum: 0, description: "最終 status 為 COMPLETE 的標的數。"}
            partialCount: {type: integer, minimum: 0, description: "最終 status 為 PARTIAL 的標的數。"}
            unavailableCount: {type: integer, minimum: 0, description: "最終 status 為 UNAVAILABLE 的標的數。"}
          required: [status, requestedCount, successCount, partialCount, unavailableCount]
        contextContentSha256: {type: string, pattern: '^[0-9a-f]{64}$', description: "移除此欄後對其餘回應套用 RFC 8785 JCS 與 SHA-256 的結果。"}
      required: [schemaVersion, contextId, marketCaptureId, tradingDate, slot, policyBundleSha256, sourceVector, symbols, coverage, contextContentSha256]
    IntradayCandleConfirmation:
      type: object
      additionalProperties: false
      description: 已完成的富邦1m盤中K確認；SHORT_ONLY，MEDIUM不影響D130張數。
      required:
      - status
      - reason
      - sourceDate
      - observedAt
      - lastCompletedAt
      - fiveMinuteAt
      - oneMinuteAt
      - aggregationSource
      properties:
        status:
          type: string
          description: CONFIRMED保留既有SHORT買進候選，不恢復已被evidence否決的動作；WAIT等待；UNAVAILABLE來源不足；NOT_APPLICABLE非台股短期。
          enum:
          - CONFIRMED
          - WAIT
          - UNAVAILABLE
          - NOT_APPLICABLE
        reason:
          type: string
          description: 非空的機械確認原因。
          minLength: 1
        sourceDate:
          type:
          - string
          - 'null'
          description: 來源台北交易日期；null表示無可確認日期。
          format: date
        observedAt:
          type:
          - string
          - 'null'
          description: 富邦擷取完成UTC時間；null表示不適用或未取得。
          format: date-time
        lastCompletedAt:
          type:
          - string
          - 'null'
          description: 最後完整1m棒的結束UTC時間；null表示不適用或未取得。
          format: date-time
        fiveMinuteAt:
          type:
          - string
          - 'null'
          description: 最新完整5m桶的結束UTC時間；null表示證據不足。
          format: date-time
        oneMinuteAt:
          type:
          - string
          - 'null'
          description: 用於確認方向的完整1m棒結束UTC時間；null表示證據不足。
          format: date-time
        aggregationSource:
          type:
          - string
          - 'null'
          description: LOCAL_AGGREGATED_FUBON_1M由本地富邦1m聚合；null表示無聚合。
          enum:
          - LOCAL_AGGREGATED_FUBON_1M
          - null
    SrppDecisionIdentity:
      type: object
      additionalProperties: false
      description: 不可變決策識別owner/date/slot；policy與Swagger為建立時metadata。
      required:
      - ownerUserId
      - tradingDate
      - slot
      - policyBundleSha256
      - swaggerSha256
      properties:
        ownerUserId:
          type: integer
          description: 解析出的ACTIVE資料擁有者ID。
          minimum: 1
        tradingDate:
          type: string
          description: 台北當日台股交易日。
          format: date
        slot:
          type: string
          description: '09:05或11:40日報觀察時段。'
          enum:
          - '09:05'
          - '11:40'
        policyBundleSha256:
          type: string
          description: 經完整政策位元組核對的規則包SHA256。
          pattern: "^[0-9a-f]{64}$"
        swaggerSha256:
          type: string
          description: 已發布SwaggerMarkdown獨立SHA256；D166不納入政策bundle。
          pattern: "^[0-9a-f]{64}$"
    SrppDecisionAuthorityRevision:
      type: object
      additionalProperties: false
      description: 固定的計算器、資料庫與作者政策檔案版本。
      required:
      - serviceBuild
      - databaseSchema
      - calculatorVersion
      - modelInputsSha256
      - policyManifestSha256
      properties:
        serviceBuild:
          type: string
          description: 部署服務Git或image版本。
        databaseSchema:
          type: string
          description: 本引擎資料庫版本v1.149.0。
        calculatorVersion:
          type: string
          description: 正式D130/D195純計算器版本。
        modelInputsSha256:
          type: string
          description: 凍結model_inputs完整原始位元組SHA256。
          pattern: "^[0-9a-f]{64}$"
        policyManifestSha256:
          type: string
          description: 凍結policy_manifest完整原始位元組SHA256。
          pattern: "^[0-9a-f]{64}$"
    SrppDecisionSourceReceipt:
      type: object
      additionalProperties: false
      description: 單一來源凍結內容與來源可用性；未取得來源明確披露。
      required:
      - sourceId
      - revision
      - capturedAt
      - sha256
      - coverage
      - validation
      properties:
        sourceId:
          type: string
          description: inputBundleJcs.sources對應鍵。
        revision:
          type: string
          description: 來源snapshot/時間/版本識別。
        capturedAt:
          type: string
          description: 凍結frameUTC時間。
          format: date-time
        sha256:
          type: string
          description: 對應sources payload的JCS SHA256。
          pattern: "^[0-9a-f]{64}$"
        coverage:
          type: string
          description: COMPLETE完整；PARTIAL部分；NONE未取得。
          enum:
          - COMPLETE
          - PARTIAL
          - NONE
        validation:
          type: string
          description: VERIFIED已核對；UNAVAILABLE未取得；AVAILABLE分鐘可用；STALE分鐘過期；CONFLICT分鐘矛盾。
          enum: [VERIFIED, UNAVAILABLE, AVAILABLE, STALE, CONFLICT]
    SrppDecisionInputSnapshot:
      type: object
      additionalProperties: false
      description: 完全凍結的L0/L1/L2/政策/來源內容與雜湊；同slot replay不重讀來源。
      required:
      - inputSnapshotSha256
      - capturedAt
      - assetSnapshotId
      - assetGeneratedAt
      - sourceVector
      - inputBundleJcs
      properties:
        inputSnapshotSha256:
          type: string
          description: inputBundleJcs UTF8位元組SHA256。
          pattern: "^[0-9a-f]{64}$"
        capturedAt:
          type: string
          description: 最後來源讀取完成後觀察的UTC frame；分鐘採此asOf。
          format: date-time
        assetSnapshotId:
          type: integer
          description: 單一canonical最新資產snapshot ID。
          minimum: 1
        assetGeneratedAt:
          type: string
          description: 同份最新資產回覆的generatedAtUTC時間。
          format: date-time
        sourceVector:
          type: object
          description: 來源ID到完整來源收據的映射。
          additionalProperties:
            "$ref": "#/components/schemas/SrppDecisionSourceReceipt"
            description: 單一來源收據。
        inputBundleJcs:
          type: string
          description: 完整凍結輸入的canonical JCS文字；金額與比例皆為Decimal字串。
    SrppDecisionGateReceipt:
      type: object
      additionalProperties: false
      description: 獨立gate回執；只驗證正式政策與凍結輸入，缺來源不推論為空。
      required:
      - ruleId
      - calculatorVersion
      - inputRefs
      - status
      - reason
      - values
      properties:
        ruleId:
          type: string
          description: 正式規則或gate識別。
        calculatorVersion:
          type: string
          description: 計算此gate的純計算器版本。
        inputRefs:
          type: array
          description: 此gate實際引用的來源ID。
          items:
            type: string
            description: sourceVector來源鍵。
        status:
          type: string
          description: PASS通過；BLOCK不符合政策；UNAVAILABLE來源未確認；NOT_APPLICABLE不適用。
          enum:
          - PASS
          - BLOCK
          - UNAVAILABLE
          - NOT_APPLICABLE
        reason:
          type: string
          description: 非空且固定的機械原因。
          minLength: 1
        values:
          type: object
          description: 計算值與原始精度的Decimal字串。
          additionalProperties:
            type: string
            description: 機械值的精确文字。
    SrppDecisionCandidate:
      type: object
      additionalProperties: false
      description: 單一正式報告建議；D195 ranked[0]唯一策略標的與00865B獨立緊急leg。
      required:
      - symbol
      - strategy
      - status
      - action
      - lots
      - limitPrice
      - amountTwd
      - blockingReasons
      - receipts
      properties:
        symbol:
          type: string
          description: '00865B短債、00719B短債或00697B中債。'
          enum:
          - '00865B'
          - '00719B'
          - '00697B'
        strategy:
          type: string
          description: STRATEGIC_FUBON富邦策略leg；EMERGENCY_CATHAY國泰00865B緊急leg。
          enum:
          - STRATEGIC_FUBON
          - EMERGENCY_CATHAY
        status:
          type: string
          description: ACTIONABLE_FOR_REPORT是有完整證據的報告買進建議；BLOCKED不可形成買進。
          enum:
          - ACTIONABLE_FOR_REPORT
          - BLOCKED
        action:
          type: string
          description: BUY買進報告建議；NONE無建議。
          enum:
          - BUY
          - NONE
        lots:
          type: integer
          description: 實際可報告整張數；BLOCKED必為0。
          minimum: 0
          maximum: 2
        limitPrice:
          type:
          - string
          - 'null'
          description: ETF tick floor後限價Decimal；BLOCKED為null。
        amountTwd:
          type:
          - string
          - 'null'
          description: 限價乘1000股乘張數Decimal；BLOCKED為null。
        blockingReasons:
          type: array
          description: 唯一且排序的阻擋原因；有張數時必為空。
          items:
            type: string
            description: 不可用gate原因。
          uniqueItems: true
        receipts:
          type: array
          description: 所有適用gate的獨立結果，包含盤中K NOT_APPLICABLE SHORT_ONLY。
          items:
            "$ref": "#/components/schemas/SrppDecisionGateReceipt"
            description: 單一gate回執。
    SrppDailyDecision:
      type: object
      additionalProperties: false
      description: D130/D195報告用結果；無下單權限，事件證據仍由每個consumer分別處理。
      required:
      - executionScope
      - tradeAuthorization
      - placesOrders
      - eventEvidenceIntegrationStatus
      - eventEvidenceReason
      - ranking
      - candidates
      properties:
        executionScope:
          type: string
          description: REPORT_RECOMMENDATION_ONLY僅供報告。
          enum:
          - REPORT_RECOMMENDATION_ONLY
        tradeAuthorization:
          type: boolean
          description: 固定false，不授權交易。
          const: false
        placesOrders:
          type: boolean
          description: 固定false，不執行交易。
          const: false
        eventEvidenceIntegrationStatus:
          type: string
          description: NOT_BOUND：本端點未整合consumer事件判讀。
          enum:
          - NOT_BOUND
        eventEvidenceReason:
          type: string
          description: PER_CONSUMER_EVIDENCE：各consumer保留獨立證據。
          enum:
          - PER_CONSUMER_EVIDENCE
        ranking:
          type: array
          description: D195適合且hardgate通過標的順位；僅首位可配置張數。
          items:
            type: string
            description: '00865B、00719B、00697B策略價格順位。'
            enum:
            - '00865B'
            - '00719B'
            - '00697B'
          uniqueItems: true
          maxItems: 3
        candidates:
          type: array
          description: 固定3策略leg加00865B緊急leg；未發布pending/subaccount來源時逐leg誠實BLOCKED。
          items:
            "$ref": "#/components/schemas/SrppDecisionCandidate"
            description: 單一報告候選。
          minItems: 4
          maxItems: 4
    SrppDailyDecisionResponse:
      type: object
      additionalProperties: false
      description: FINAL不可變結果；同owner/date/slot相同metadata replay原内容，不重抓來源。
      required:
      - schemaVersion
      - decisionRunId
      - status
      - created
      - authorityRevision
      - identity
      - inputSnapshot
      - decision
      - decisionContentSha256
      properties:
        schemaVersion:
          type: integer
          description: 固定1。
          const: 1
        decisionRunId:
          type: string
          description: 不可變decision run UUID。
          format: uuid
        status:
          type: string
          description: FINAL表示完整凍結、真實計算與保存完成。
          enum:
          - FINAL
        created:
          type: boolean
          description: 201為true、200 replay為false；不屬content hash。
        authorityRevision:
          "$ref": "#/components/schemas/SrppDecisionAuthorityRevision"
          description: 部署與完整作者政策位元組身分。
        identity:
          "$ref": "#/components/schemas/SrppDecisionIdentity"
          description: owner/date/slot不可變識別。
        inputSnapshot:
          "$ref": "#/components/schemas/SrppDecisionInputSnapshot"
          description: 完整凍結輸入與來源回執。
        decision:
          "$ref": "#/components/schemas/SrppDailyDecision"
          description: 正式政策結果與獨立gate。
        decisionContentSha256:
          type: string
          description: 移除created與此hash後完整response的JCS SHA256。
          pattern: "^[0-9a-f]{64}$"
    SrppDailyDecisionCapturing:
      type: object
      additionalProperties: false
      description: CAPTURING不是FINAL；有generation fencing与30秒lease，Retry-After=2。
      required:
      - schemaVersion
      - decisionRunId
      - status
      - code
      - identity
      properties:
        schemaVersion:
          type: integer
          description: 固定1。
          const: 1
        decisionRunId:
          type: string
          description: 同slot最終run沿用此claim UUID。
          format: uuid
        status:
          type: string
          description: CAPTURING代表擷取或較早slot尚在處理。
          enum:
          - CAPTURING
        code:
          type: string
          description: DECISION_CAPTURE_IN_PROGRESS：稍後以同identity重試。
          enum:
          - DECISION_CAPTURE_IN_PROGRESS
        identity:
          "$ref": "#/components/schemas/SrppDecisionIdentity"
          description: 已取得lease的owner/date/slot與固定metadata。
  responses:
    NginxBadGateway:
      description: HTTP 502 Bad Gateway response class；Nginx 無法連接或取得 upstream 回應時回傳。body 是 `text/html` 的 `NginxErrorHtml` item，不是 JSON ProblemDetail；gateway 不攔截、不改寫成 JSON 或空 200。
      content:
        text/html:
          schema: {$ref: '#/components/schemas/NginxErrorHtml'}
          example: "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx</center></body></html>"
    NginxGatewayTimeout:
      description: HTTP 504 Gateway Time-out response class；Nginx upstream timeout 時回傳，gateway 的 connect/send/read timeout 分別為 5 秒／30 秒／60 秒。body 是 `text/html` 的 `NginxErrorHtml` item，不是 RFC 7807 JSON。
      content:
        text/html:
          schema: {$ref: '#/components/schemas/NginxErrorHtml'}
          example: "<html><head><title>504 Gateway Time-out</title></head><body><center><h1>504 Gateway Time-out</h1></center><hr><center>nginx</center></body></html>"
    SrppOrchestratedProblem:
      description: RFC 9457 application problem response for the SRPP on-demand read endpoints.
      headers:
        Cache-Control:
          description: 私人錯誤回應不得快取，固定為 private, no-store。
          schema: {type: string, const: 'private, no-store'}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/SrppOrchestratedProblem'}
