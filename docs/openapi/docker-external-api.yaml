          schema: {type: string, pattern: '^[0-9]{4}$'}
          example: '2026'
      responses:
        '200':
          description: 指定年份完整 365 或 366 日的 typed 日曆，以及 authority availability。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicTradingCalendarResponse'}
              examples:
                synthetic:
                  value: {year: 2026, generatedAt: '2026-01-15T10:15:30+08:00', timezone: Asia/Taipei, availableYears: [2025, 2026, 2027], minYear: 2025, maxYear: 2027, markets: [{code: TW, displayName: 台股, exchange: TWSE, timezone: Asia/Taipei, regularTradingHours: '09:00-13:30', daylightSavingSupported: false}, {code: US, displayName: 美股, exchange: NYSE, timezone: America/New_York, regularTradingHours: '09:30-16:00', daylightSavingSupported: true}, {code: UK, displayName: 英股, exchange: LSE, timezone: Europe/London, regularTradingHours: '08:00-16:30', daylightSavingSupported: true}], availability: {tw: {status: AVAILABLE, source: TWSE/DGPA, message: null}, us: {status: AVAILABLE, source: NYSE, message: null}, uk: {status: AVAILABLE, source: LSE, message: null}}, tradingDayCount: {tw: 250, us: 251, uk: 252}, holidays: {tw: [], us: [], uk: []}, days: [{date: '2026-01-01', weekday: 四, isWeekend: false, twTrading: false, usTrading: true, ukTrading: true, twHoliday: true, usHoliday: false, ukHoliday: false}], marketStatus: {tw: {marketOpen: true, localTime: '2026-01-15T10:15:30', displayTradingDate: '2026-01-15', timezone: Asia/Taipei}, us: {marketOpen: false, localTime: '2026-01-14T21:15:30', displayTradingDate: '2026-01-14', timezone: America/New_York}, uk: {marketOpen: false, localTime: '2026-01-15T02:15:30', displayTradingDate: '2026-01-15', timezone: Europe/London}}}
        '400':
          description: 缺少、重複、非四位或不在 Asia/Taipei current±1 的 year；不會讀 business。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Invalid trading calendar request, status: 400, detail: 交易日曆年度不合法, instance: /api/public/trading-calendar}
        '502':
          description: Business 非 2xx 或 Nginx upstream failure；回應已消毒。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Trading calendar downstream failure, status: 502, detail: 交易日曆暫時無法取得, instance: /api/public/trading-calendar}
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx</center></body></html>"
        '503':
          description: BFF 無法連線 business。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Trading calendar service unavailable, status: 503, detail: 交易日曆服務暫時無法連線, instance: /api/public/trading-calendar}
        '504':
          description: BFF 五秒 timeout 或 Nginx gateway timeout。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              example: {type: 'about:blank', title: Trading calendar timeout, status: 504, detail: 交易日曆服務逾時, instance: /api/public/trading-calendar}
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>504 Gateway Time-out</title></head><body><center><h1>504 Gateway Time-out</h1></center><hr><center>nginx</center></body></html>"
  /api/public/commodity-prices:
    get:
      tags: [公開商品行情]
      operationId: getPublicCommodityPrices
      summary: 一次取得 WTI、Brent 與黃金的已持久化報價
      description: |
        Global no-tenant 的純唯讀 batch 路徑；每個合法 request 只透過 BFF 的 no-tenant container client
        讀一次既有 business `GET /api/market-data/commodity/live`，由該聚合既有的 Redis spot cache 與
        PostgreSQL 前收投影固定三個 slot。它不讀 caller identity、owner、帳戶、持股、交易或 broker，
        不直接讀 Redis/DB，且絕不 request-time 呼叫 Yahoo、Fubon、refresh、排程或任何寫入。
        不接受 named query parameter 或 GET body；bare trailing `?` 視同沒有 query。個別 slot 的 null 是
        該 persisted spot 不可用，仍是合法 200，不能解讀成零價、停盤、refresh 或整個 downstream 失敗。
      responses:
        '200':
          description: 固定順序 WTI、BRENT、GOLD 的 immutable persisted quote slots；任一 slot 可為 null。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CommodityPriceBatchResponse'}
              examples:
                persistedSpotWithOneMiss:
                  summary: WTI、Brent 有已保存 spot，黃金 slot 暫時不可用的合成範例
                  value:
                    marketOpen: false
                    quotes:
                      WTI: {commodityCode: WTI, unit: USD_PER_BARREL, price: 82.45, change: 1.20, changePercent: 1.48, sessionDate: '2026-08-28', quoteTime: '2026-08-28T20:59:59Z', polledAt: '2026-08-28T20:59:31Z', status: LIVE, dayHigh: 82.99, dayLow: 80.71, provider: YAHOO_FINANCE_CHART}
                      BRENT: {commodityCode: BRENT, unit: USD_PER_BARREL, price: 85.10, change: null, changePercent: null, sessionDate: '2026-08-28', quoteTime: '2026-08-28T20:59:58Z', polledAt: '2026-08-28T20:59:30Z', status: STALE, dayHigh: null, dayLow: 84.00, provider: YAHOO_FINANCE_CHART}
                      GOLD: null
        '400':
          description: 有任何 named、空值、重複或多值 query parameter，或 GET 帶 positive Content-Length／Transfer-Encoding body；BFF local gate 零 downstream request。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/PublicCommodityPriceProblemDetail'}
              example: {type: 'about:blank', title: Invalid commodity price request, status: 400, detail: 不支援 query parameter 或 request body, instance: /api/public/commodity-prices}
        '405':
          description: "Gateway 對這條 known exact path 的非 GET method 回應；帶 `Allow: GET`，不會轉送 BFF。"
          headers:
            Allow:
              description: 此 exact path 唯一允許的 HTTP method；值固定為 GET。
              schema: {type: string, const: GET}
          content:
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>405 Not Allowed</title></head><body><center><h1>405 Not Allowed</h1></center><hr><center>nginx</center></body></html>"
        '502':
          description: BFF 將 business non-2xx、空／HTML／malformed 或違反固定 slot invariants 的成功 body 消毒為 ProblemDetail；若 Nginx 本身無法連上 BFF，則是並列的 text/html gateway alternative。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/PublicCommodityPriceProblemDetail'}
              example: {type: 'about:blank', title: Commodity prices downstream failure, status: 502, detail: 商品報價暫時無法取得, instance: /api/public/commodity-prices}
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx</center></body></html>"
        '503':
          description: BFF 的唯一 no-tenant business connection/transport 無法建立；回應不含 downstream URL、exception 或 tenant 資訊。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/PublicCommodityPriceProblemDetail'}
              example: {type: 'about:blank', title: Commodity prices service unavailable, status: 503, detail: 商品報價服務暫時無法連線, instance: /api/public/commodity-prices}
        '504':
          description: BFF 對唯一 business GET 的五秒 timeout 會回 ProblemDetail；Nginx upstream timeout 則是並列 text/html gateway alternative。
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/PublicCommodityPriceProblemDetail'}
              example: {type: 'about:blank', title: Commodity prices timeout, status: 504, detail: 商品報價服務逾時, instance: /api/public/commodity-prices}
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>504 Gateway Time-out</title></head><body><center><h1>504 Gateway Time-out</h1></center><hr><center>nginx</center></body></html>"
  /api/public/srpp/daily-context:
    get:
      tags: [SRPP 共用計算結果]
      operationId: getSrppDailyContext
      summary: 取得本輪 SRPP 共用計算摘要或重播其已凍結來源
      description: |
        Requirement 163／Task 452–454 的第十四條 exact 路由。固定公式（資產對帳、總曝險配置差距、基礎收益加總）由
        business-services 背景 producer 每 5 分鐘在台股交易日 09:05–13:55 先算好、凍結來源並發布成不可變 package；
        本 GET 只讀 PostgreSQL 已發布的 package、規則包 registry 與 owner 最新快照（供 freshness 比對），日曆只用
        cached-only 判斷。GET 絕不觸發計算、補抓、refresh、匯出、通知、券商或外部行情呼叫，也不寫 DB／Redis；
        冷啟動沒有 package 回 503 `CONTEXT_NOT_READY`。

        owner 選擇沿用 Requirement 140 的雙態：不帶 `email` 時為 configured-admin（主要管理者）；帶合法 `email`
        時為該 ACTIVE 帳號（不需為 configured-admin）。BFF 清除 caller 身分後以顯式 owner header 呼叫 business，
        email 不會轉送；cookie、caller `X-User-*`、Tailscale header 都不能改變 owner。回應不含 owner id 或 email，
        `ownerKey` 是每個帳號一個的隨機識別。其他帳號的 packageId 與不存在相同，回 404 `CONTEXT_NOT_FOUND`。

        讀取模式：`view=summary` 且不帶 `packageId` 為最新模式，`tradingDate` 必須是台北今天，只回 freshness
        CURRENT 的最新 package（時段未到或尚未產生 503、休市 409 `NON_TRADING_DAY`、日曆未知 503、來源已變更 409
        `CONTEXT_STALE`）；帶 `packageId` 為固定模式，可回 CURRENT／STALE／UNKNOWN 供稽核，日期／時段／規則包不符
        回 409 `CONTEXT_IDENTITY_MISMATCH`；`view=evidence` 必須同時帶 `packageId` 與 `sourceId`，回該 AVAILABLE
        來源的原文。判斷順序固定：query 400 → owner 503 → 規則包 409 `POLICY_UNSUPPORTED` → 模式判斷。

        **規則包 registry 上線時為空表**：在使用者另行離線登錄正式規則包前，本路由對任何 `policyBundleSha256`
        一律回 409 `POLICY_UNSUPPORTED`，這是刻意的 fail-closed，也不寫 API 錯誤紀錄。本版 funding 與
        completedTechnicals 模組固定具名 UNAVAILABLE、cashIncome 的稅後欄位固定 UNAVAILABLE，因此 coverage 恆為
        PARTIAL；缺資料一律以原因碼降級，不以 0 或猜值冒充完整。`tradingAuthorized` 恆為 false：HTTP 200 與
        COMPLETE 都不構成交易授權，本 API 不下單、不代為交易。

        BFF 對 business 2xx 回應逐欄 strict 驗證（未知欄位、非 canonical Decimal、排序、source 引用、coverage、
        重新計算 `contextContentSha256`／`bodySha256`、與 query 一致、最新模式只接受 CURRENT），任一不符回 502
        `UPSTREAM_INVALID`；通過後原位元組轉送。成功與所有應用錯誤都帶 `Cache-Control: private, no-store`，不使用
        304／ETag。
      parameters:
        - name: tradingDate
          in: query
          required: true
          description: 台股交易日，嚴格 `YYYY-MM-DD` 且為合法日期；最新模式只接受 Asia/Taipei 今天，固定模式與 evidence 可讀保留期內（預設 7 天）的歷史日期。
          schema: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
          example: '2026-09-24'
        - name: slot
          in: query
          required: true
          description: 業務時段，只接受 `09:05`（早盤，09:05–11:39 產生）或 `11:40`（午盤，11:40–13:55 產生）；最新模式在時段時間到之前回 503，不會回較早時段。
          schema: {type: string, enum: ['09:05', '11:40']}
          example: '09:05'
        - name: policyBundleSha256
          in: query
          required: true
          description: 期望的已登錄規則包雜湊（64 位小寫 hex）；只當查詢鍵，伺服器會查驗證過的 registry，查無或驗證失敗回 409 POLICY_UNSUPPORTED。呼叫端不能提交公式、分數或通過收據。
          schema: {$ref: '#/components/schemas/SrppSha256'}
          example: bb0749d678dec8ecf9363d15983721613147871e1064b3d82d6efd5c0e3f9af3
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
            maxLength: 254
          description: >-
            選擇要查詢的帳號 email；省略時預設回傳 configured-admin（主要管理者）的資料。
            帶入時僅需該帳號存在且狀態為 ACTIVE，不需為 configured-admin。
            格式不合法回 400；本路由另外把空字串或含前後空白的 email 也視為格式不合法回 400（不像其他路由視為省略）。
            查無帳號或帳號非 ACTIVE 回 503（與 configured-admin 不可用、lookup 五秒逾時或錯誤相同的 OWNER_UNAVAILABLE
            契約，刻意不區分以避免此參數成為帳號列舉工具）。email 只用於 BFF owner lookup，不會轉送 business。
          example: selected@example.invalid
        - name: view
          in: query
          required: false
          description: 回應種類：`summary`（預設）回不可變 context、contextContentSha256 與 freshness；`evidence` 回單一凍結來源原文，必須同時帶 packageId 與 sourceId。
          schema: {type: string, enum: [summary, evidence], default: summary}
          example: summary
        - name: packageId
          in: query
          required: false
          description: 固定讀取的 package（小寫 canonical UUID）；summary 帶此參數為固定模式，evidence 必填。他人或不存在的 package 回 404 CONTEXT_NOT_FOUND。
          schema: {type: string, format: uuid, pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'}
          example: 7e1fb982-4ae4-4e7e-baa5-c2c80bd93491
        - name: sourceId
          in: query
          required: false
          description: 要重播的來源（`^[a-z][a-z0-9_-]{0,63}$`，本版為 assets、calendar、policy）；只用於 evidence 且必填，summary 帶此參數回 400。必須是該 package 的 AVAILABLE source，否則 404 SOURCE_EVIDENCE_NOT_FOUND。
          schema: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
          example: assets
      responses:
        '200':
          description: 不可變摘要（SUMMARY）或單一凍結來源（EVIDENCE），為 business 原位元組、已通過 BFF strict 驗證。HTTP 200 不代表可執行交易；最新模式只會是 freshness CURRENT。
          headers:
            Cache-Control:
              description: 個人計算結果不得被中介快取；值固定為 private, no-store。
              schema: {type: string, const: 'private, no-store'}
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/SrppSummaryResponse'}
                  - {$ref: '#/components/schemas/SrppEvidenceResponse'}
              examples:
                partial:
                  $ref: '#/components/examples/SrppSummaryPartial'
                stalePinned:
                  $ref: '#/components/examples/SrppSummaryStalePinned'
                evidence:
                  $ref: '#/components/examples/SrppEvidenceAssets'
        '400':
          description: >-
            INVALID_REQUEST：未知或重複 query key、空值或前後空白、日期／時段／雜湊／email／view／packageId／sourceId 格式錯、
            evidence 缺 packageId 或 sourceId、summary 帶 sourceId、GET 帶 body，或最新模式 tradingDate 不是台北今天。
            BFF 本地驗證的錯誤不會發出任何 owner lookup 或 business 呼叫。
          headers:
            Cache-Control:
              description: 值固定為 private, no-store。
              schema: {type: string, const: 'private, no-store'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/SrppProblem'}
              example: {type: 'about:blank', title: Invalid SRPP daily context request, status: 400, detail: 查詢參數不合法，請確認參數名稱、格式與組合。, instance: /api/public/srpp/daily-context, code: INVALID_REQUEST, retryable: false}
        '404':
          description: CONTEXT_NOT_FOUND（查無該 owner 的 packageId；他人 package 同樣 404）或 SOURCE_EVIDENCE_NOT_FOUND（package 中查無該 AVAILABLE 來源）。
          headers:
            Cache-Control:
              description: 值固定為 private, no-store。
              schema: {type: string, const: 'private, no-store'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/SrppProblem'}
              examples:
                contextNotFound:
                  value: {type: 'about:blank', title: SRPP daily context not found, status: 404, detail: 查無指定的共用計算結果套件。, instance: /api/public/srpp/daily-context, code: CONTEXT_NOT_FOUND, retryable: false}
                sourceEvidenceNotFound:
                  value: {type: 'about:blank', title: SRPP source evidence not found, status: 404, detail: 指定套件中查無可重播的來源。, instance: /api/public/srpp/daily-context, code: SOURCE_EVIDENCE_NOT_FOUND, retryable: false}
        '405':
          description: "Gateway 對這條 known exact path 的非 GET method 回應；帶 `Allow: GET`，不會轉送 BFF。"
          headers:
            Allow:
              description: 此 exact path 唯一允許的 HTTP method；值固定為 GET。
              schema: {type: string, const: GET}
          content:
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>405 Not Allowed</title></head><body><center><h1>405 Not Allowed</h1></center><hr><center>nginx</center></body></html>"
        '409':
          description: >-
            POLICY_UNSUPPORTED（規則包未登錄或未通過驗證；registry 為空時一律如此，且不寫 API 錯誤紀錄）、
            CONTEXT_STALE（最新 package 的快照 revision 或日曆已變更）、CONTEXT_IDENTITY_MISMATCH（固定 package 的
            日期／時段／規則包與 query 不符）或 NON_TRADING_DAY（cached-only 日曆判定休市）。
          headers:
            Cache-Control:
              description: 值固定為 private, no-store。
              schema: {type: string, const: 'private, no-store'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/SrppProblem'}
              examples:
                policyUnsupported:
                  value: {type: 'about:blank', title: SRPP policy bundle unsupported, status: 409, detail: 指定的規則包尚未登錄或未通過驗證。, instance: /api/public/srpp/daily-context, code: POLICY_UNSUPPORTED, retryable: false}
                contextStale:
                  value: {type: 'about:blank', title: SRPP daily context stale, status: 409, detail: 最新共用計算結果的來源已變更，請沿用既有資料取得及計算流程。, instance: /api/public/srpp/daily-context, code: CONTEXT_STALE, retryable: false}
                contextIdentityMismatch:
                  value: {type: 'about:blank', title: SRPP daily context identity mismatch, status: 409, detail: 指定套件的交易日、時段或規則包與查詢條件不符。, instance: /api/public/srpp/daily-context, code: CONTEXT_IDENTITY_MISMATCH, retryable: false}
                nonTradingDay:
                  value: {type: 'about:blank', title: Non-trading day, status: 409, detail: 指定日期不是台股交易日。, instance: /api/public/srpp/daily-context, code: NON_TRADING_DAY, retryable: false}
        '500':
          description: INTERNAL_ERROR：BFF 未預期例外；business 自身的 500 會被轉成 502 UPSTREAM_INVALID，不外洩細節。
          headers:
            Cache-Control:
              description: 值固定為 private, no-store。
              schema: {type: string, const: 'private, no-store'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/SrppProblem'}
              example: {type: 'about:blank', title: SRPP internal error, status: 500, detail: 共用計算結果服務發生未預期錯誤。, instance: /api/public/srpp/daily-context, code: INTERNAL_ERROR, retryable: false}
        '502':
          description: >-
            UPSTREAM_INVALID：business 2xx 未通過 strict 驗證、business 非預期 status（含 500）、problem 格式錯誤或 code 與
            status 不符；回應已消毒。若 Nginx 本身無法連上 BFF，則是並列的 text/html gateway alternative。
          headers:
            Cache-Control:
              description: BFF problem 回應的值固定為 private, no-store（Nginx HTML 不保證）。
              schema: {type: string, const: 'private, no-store'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/SrppProblem'}
              example: {type: 'about:blank', title: SRPP upstream response invalid, status: 502, detail: 共用計算結果的上游回應不合法。, instance: /api/public/srpp/daily-context, code: UPSTREAM_INVALID, retryable: false}
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><head><title>502 Bad Gateway</title></head><body><center><h1>502 Bad Gateway</h1></center><hr><center>nginx</center></body></html>"
        '503':
          description: >-
            OWNER_UNAVAILABLE（configured-admin 或指定 email 查無、非 ACTIVE、lookup 五秒逾時或錯誤，一律同一 body，不可重試）、
            CALENDAR_UNAVAILABLE（cached-only 日曆無法確認，可重試）或 CONTEXT_NOT_READY（時段未到、尚未產生 package、
            freshness 無法核對、business 五秒逾時或連線失敗，可重試）。
          headers:
            Cache-Control:
              description: 值固定為 private, no-store。
              schema: {type: string, const: 'private, no-store'}
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/SrppProblem'}
              examples:
                contextNotReady:
                  value: {type: 'about:blank', title: SRPP daily context not ready, status: 503, detail: 本時段的共用計算結果尚未就緒，請稍後再試。, instance: /api/public/srpp/daily-context, code: CONTEXT_NOT_READY, retryable: true}
                ownerUnavailable:
                  value: {type: 'about:blank', title: SRPP owner unavailable, status: 503, detail: 指定帳號不可用。, instance: /api/public/srpp/daily-context, code: OWNER_UNAVAILABLE, retryable: false}
                calendarUnavailable:
                  value: {type: 'about:blank', title: Trading calendar unavailable, status: 503, detail: 台股交易日曆暫時無法確認，請稍後再試。, instance: /api/public/srpp/daily-context, code: CALENDAR_UNAVAILABLE, retryable: true}
        '504':
          $ref: '#/components/responses/NginxGatewayTimeout'
  /api/public/srpp/calculation-context:
    get:
      tags: [SRPP 按需計算]
      operationId: getSrppCalculationContext
      summary: 取得本輪固定計算脈絡
      description: |
        依台北交易日、slot、已驗證的 policy bundle 與 owner 選取最新不可變 package，回傳 contextId、固定計算來源修訂向量及該 package 持股代碼白名單。只讀 package/evidence、policy registry 與 cached-only 日曆，不觸發計算或外部抓取。
        省略 email 使用 configured-admin；提供 email 則只接受 ACTIVE owner。contextId 不是授權憑證，後續每次仍解析 owner 並執行 owner-scoped 查詢。
      parameters:
        - name: tradingDate
          in: query
          required: true
          description: 必須為合法的台北當日日期，且權威 cached-only 台股日曆確認為交易日；時段未到或 package 尚未發布回 503。
          schema: {type: string, format: date, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'}
          example: '2026-09-30'
        - name: slot
          in: query
          required: true
          description: 本輪 SRPP 計算時段，只接受早盤 09:05 或午盤 11:40。
          schema: {type: string, enum: ['09:05', '11:40']}
          example: '09:05'
        - name: policyBundleSha256
          in: query
          required: true
          description: 64 位小寫 SHA-256；伺服器須由 registry 驗證，未知或不支援回 409 POLICY_UNSUPPORTED。
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          example: 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
        - name: email
          in: query
          required: false
          description: 選取 ACTIVE owner 的 email；格式不合法回 400，查無帳號或帳號非 ACTIVE 回 503 且不揭露帳號存在性。省略使用 configured-admin。
          schema: {type: string, format: email, maxLength: 254}
          example: selected@example.invalid
      responses:
        '200':
          description: 不可變 package 的固定計算 context 與 owner 允許代碼。
          headers:
            Cache-Control: {description: 私人回應不得快取，值固定 private, no-store。, schema: {type: string, const: 'private, no-store'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SrppCalculationContextResponse'}
              example:
                schemaVersion: '1.0'
                contextId: 7e1fb982-4ae4-4e7e-baa5-c2c80bd93491
                tradingDate: '2026-09-30'
                slot: '09:05'
                policyBundleSha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                formulaSetSha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                capturedAt: '2026-09-30T09:05:01+08:00'
                sourceVector: [{sourceId: assets, revision: snapshot-example, dataAsOf: '2026-09-30T09:00:00+08:00', bodySha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc}]
                allowedStockCodes: ['2330']
                contextContentSha256: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        '400': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '404': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '405':
          description: "僅允許 GET，gateway 回 Allow: GET。"
          headers: {Allow: {description: "唯一允許的方法。", schema: {type: string, const: GET}}}
          content:
            text/html:
              schema: {$ref: '#/components/schemas/NginxErrorHtml'}
              example: "<html><body><h1>405 Not Allowed</h1></body></html>"
        '409': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '500': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '502':
          description: BFF 驗證上游失敗時為 RFC 9457 problem；Nginx upstream failure 可能為 HTML。
          content:
            application/problem+json: {schema: {$ref: '#/components/schemas/SrppOrchestratedProblem'}}
            text/html: {schema: {$ref: '#/components/schemas/NginxErrorHtml'}}
        '503': {$ref: '#/components/responses/SrppOrchestratedProblem'}
        '504': {$ref: '#/components/responses/NginxGatewayTimeout'}
      x-codex-route-policy: exact-read-only-get
  /api/public/srpp/calculations:
    get:
      tags: [SRPP 按需計算]
      operationId: getSrppCalculations
      summary: 以固定 context 執行指定計算
      description: |
        只重播 contextId 指向的 owner-scoped assets evidence，呼叫既有 business 純函式計算器。已啟用 calculation ID 為 ASSET_RECONCILIATION、ALLOCATION_GAP、CASH_INCOME；其他允許 ID 逐項回 UNAVAILABLE，不補值、不把部分失敗升級成整批失敗。提供 stockCodes 僅適用逐標的 calculation。
      parameters:
        - name: contextId
          in: query
          required: true
          description: calculation-context 回傳的不透明 UUID；每次呼叫仍會驗證 owner，跨 owner 與不存在皆回 404。
          schema: {type: string, format: uuid, maxLength: 200}
          example: 7e1fb982-4ae4-4e7e-baa5-c2c80bd93491
        - name: calculationIds
          in: query
          required: true
          description: 逗號分隔且不得重複的允許 ID，最多 6 項；未啟用項目逐項回 UNAVAILABLE。
