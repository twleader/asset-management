        '502': {description: code 為 UPSTREAM_INVALID：BFF 呼叫 business 逾時（10 秒）、transport 失敗或 business 回應不符契約；或 business 讀到的既有收據違反保存契約。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/SrppCaptureProblem'}}}}
        '503': {description: code 為 OWNER_UNAVAILABLE（帳號查無、非 ACTIVE、查詢失敗或逾時；不揭露帳號是否存在）、CALENDAR_UNAVAILABLE（台股日曆暫時無法確認，可重試）或 CONTEXT_NOT_READY（伺服器沒有已發布 Swagger 身分，fail closed，可重試）。, content: {application/problem+json: {schema: {$ref: '#/components/schemas/SrppCaptureProblem'}}}}
