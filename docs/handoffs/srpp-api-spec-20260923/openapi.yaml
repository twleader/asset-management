openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: SRPP 共用計算結果 API（實作交接提案）
  version: 1.0.0-proposal.1
  description: 尚未實作或部署。獨立交接規格；不得藉此修改現行 SRPP。新增一條 exact read-only GET。固定公式由背景 producer 處理；GET 只讀已發布結果，無券商/行情外呼、無
    refresh、無交易。
servers:
- url: http://127.0.0.1:9090
  description: 提案的本機 gateway 路由；目前尚不存在。
security: []
paths:
  /api/public/srpp/daily-context:
    get:
      operationId: getSrppDailyContext
      tags:
      - SRPP 計算結果
      summary: 取得本輪共用計算摘要或重播其已凍結來源
      description: owner 選擇沿用 assets/latest：省略 email 使用 configured-admin；指定 email 僅可選 ACTIVE 帳號。清除 caller 身分並由
        BFF 顯式傳遞 owner。summary 不帶 packageId 時只選 CURRENT 最新發布；帶 packageId 可回放 STALE 套件，但 consumer 不可用於現行建議。evidence
        必須同時指定 packageId 和 sourceId。所有讀取均保持純唯讀。
      parameters:
      - name: tradingDate
        in: query
        required: true
        schema:
          type: string
          description: ISO 8601 日期。
          format: date
        description: summary 的 latest 模式只允許 Asia/Taipei 今天；pinned/evidence 可回放保留中的歷史日期。
      - name: slot
        in: query
        required: true
        schema:
          type: string
          description: ''
          enum:
          - 09:05
          - '11:40'
        description: 實際業務時段，不能用舊任務 ID 推測。
      - name: policyBundleSha256
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SrppSha256'
        description: 期望的已登錄 SRPP 規則包；不允許 caller 提交公式、分數或通過收據。
      - name: email
        in: query
        required: false
        schema:
          type: string
          description: ''
          format: email
          maxLength: 254
        description: 沿用現有 optional email owner selector；省略為 configured-admin。
      - name: view
        in: query
        required: false
        schema:
          type: string
          description: ''
          enum:
          - summary
          - evidence
          default: summary
        description: 預設摘要；evidence 是單一來源回放。
      - name: packageId
        in: query
        required: false
        schema:
          type: string
          description: ''
          format: uuid
        description: 固定不可變套件；evidence 必填。
      - name: sourceId
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SrppId'
        description: 僅 evidence 使用且必填；必須屬於同一套件的 AVAILABLE source。
      responses:
        '200':
          description: 不可變摘要或單一凍結來源。HTTP 200 不代表可執行交易。
          headers:
            Cache-Control:
              description: 個人資料不得由中介快取；固定 private, no-store。
              schema:
                type: string
                const: private, no-store
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/SrppSummaryResponse'
                - $ref: '#/components/schemas/SrppEvidenceResponse'
              examples:
                partial:
