    SrppPolicyIdentity:
      type: object
      additionalProperties: false
      description: 伺服器必須查已驗證 registry，不能把 query 雜湊原樣回傳冒充支援。
      properties:
        policyBundleSha256:
          $ref: '#/components/schemas/SrppSha256'
        calculationPolicySha256:
          $ref: '#/components/schemas/SrppSha256'
        formulaSetSha256:
          $ref: '#/components/schemas/SrppSha256'
        formulaVersion:
          type: string
          description: ''
          minLength: 1
        scope:
          type: string
          const: LISTED_CALCULATIONS_ONLY
      required:
      - policyBundleSha256
      - calculationPolicySha256
      - formulaSetSha256
      - formulaVersion
      - scope
    SrppContext:
      type: object
      additionalProperties: false
      description: 發布後不可變；單一 package 的輸入截點、資料修訂與政策相同。
      properties:
        packageId:
          type: string
          description: ''
          format: uuid
        schemaVersion:
          type: string
          const: 1.0.0
        generatedAt:
          type: string
          description: RFC3339，必須含時區；輸出 UTC 或 +08:00。
          format: date-time
        dataCutoffAt:
          type: string
          description: RFC3339，必須含時區；輸出 UTC 或 +08:00。
          format: date-time
        tradingDate:
          type: string
          description: ISO 8601 日期。
          format: date
        slot:
          type: string
          description: ''
          enum:
          - 09:05
          - '11:40'
        timezone:
          type: string
          const: Asia/Taipei
        ownerKey:
          $ref: '#/components/schemas/SrppId'
        assetSnapshotId:
          $ref: '#/components/schemas/SrppId'
        assetSnapshotDate:
          type: string
          description: ISO 8601 日期。
          format: date
        policy:
          $ref: '#/components/schemas/SrppPolicyIdentity'
        coverage:
          type: string
          description: ''
          enum:
          - COMPLETE
          - PARTIAL
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SrppSource'
          minItems: 2
        modules:
          type: object
          additionalProperties: false
          description: ''
          properties:
            assets:
              $ref: '#/components/schemas/SrppAssetsModule'
            allocation:
              $ref: '#/components/schemas/SrppAllocationModule'
            cashIncome:
              $ref: '#/components/schemas/SrppCashIncomeModule'
            funding:
              $ref: '#/components/schemas/SrppFundingModule'
            completedTechnicals:
              $ref: '#/components/schemas/SrppTechnicalsModule'
          required:
          - assets
          - allocation
          - cashIncome
          - funding
          - completedTechnicals
        tradingAuthorized:
          type: boolean
          const: false
        requiresOriginalDailyChecks:
          type: boolean
          const: true
      required:
      - packageId
      - schemaVersion
      - generatedAt
      - dataCutoffAt
      - tradingDate
      - slot
      - timezone
      - ownerKey
      - assetSnapshotId
      - assetSnapshotDate
      - policy
      - coverage
      - sources
      - modules
      - tradingAuthorized
      - requiresOriginalDailyChecks
    SrppFreshness:
      type: object
      additionalProperties: false
      description: 讀取時另行核對修訂/日曆；不在 immutable context hash 內，不是 quote 時效的替代品。
      properties:
        status:
          type: string
          description: ''
          enum:
          - CURRENT
          - STALE
          - UNKNOWN
        checkedAt:
          type: string
          description: RFC3339，必須含時區；輸出 UTC 或 +08:00。
          format: date-time
        changedSourceIds:
          type: array
          items:
            $ref: '#/components/schemas/SrppId'
          uniqueItems: true
        reasonCodes:
          type: array
          items:
            type: string
            description: 具名穩定原因碼，不包含帳號、SQL 或例外堆疊。
            pattern: ^[A-Z][A-Z0-9_]*$
          uniqueItems: true
      required:
      - status
      - checkedAt
      - changedSourceIds
      - reasonCodes
      allOf:
      - if:
          properties:
            status:
              const: CURRENT
        then:
          properties:
            changedSourceIds:
              maxItems: 0
            reasonCodes:
              maxItems: 0
        else:
          properties:
            reasonCodes:
              minItems: 1
    SrppSummaryResponse:
      type: object
      additionalProperties: false
      description: SHA-256(RFC8785 JCS(context))；不能冒稱現有 INPUT_SNAPSHOT_SHA256。
      properties:
        kind:
          type: string
          const: SUMMARY
        context:
          $ref: '#/components/schemas/SrppContext'
        contextContentSha256:
          $ref: '#/components/schemas/SrppSha256'
        freshness:
          $ref: '#/components/schemas/SrppFreshness'
      required:
      - kind
      - context
      - contextContentSha256
      - freshness
    SrppEvidenceResponse:
      type: object
      additionalProperties: false
      description: 只讀該 owner/package 已凍結來源；不 fetch 新證據或暴露來源 URL/檔案路徑。
      properties:
        kind:
          type: string
          const: EVIDENCE
        packageId:
          type: string
          description: ''
          format: uuid
        sourceId:
          $ref: '#/components/schemas/SrppId'
        bodyMediaType:
          type: string
          const: application/json
        bodyEncoding:
          type: string
          const: UTF-8
        body:
          type: string
          description: 原始 JSON UTF-8 內容作為字串回傳；解碼後依 UTF-8 算 bodySha256，不重新 stringify。
        bodySha256:
          $ref: '#/components/schemas/SrppSha256'
      required:
      - kind
      - packageId
      - sourceId
      - bodyMediaType
      - bodyEncoding
      - body
      - bodySha256
    SrppProblem:
      type: object
      additionalProperties: false
      description: RFC9457 Problem Details；僅應用層保證，Nginx 502/504 仍可能為 HTML。
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
          description: ''
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: 經清理的繁體中文說明。
        instance:
          type: string
          const: /api/public/srpp/daily-context
        code:
          type: string
          description: ''
          enum:
          - INVALID_REQUEST
          - CONTEXT_NOT_FOUND
          - SOURCE_EVIDENCE_NOT_FOUND
          - CONTEXT_STALE
          - POLICY_UNSUPPORTED
          - CONTEXT_IDENTITY_MISMATCH
          - NON_TRADING_DAY
          - CALENDAR_UNAVAILABLE
          - OWNER_UNAVAILABLE
          - CONTEXT_NOT_READY
          - UPSTREAM_INVALID
          - INTERNAL_ERROR
        retryable:
          type: boolean
      required:
      - type
      - title
      - status
      - detail
      - instance
      - code
      - retryable
x-implementation-status: PROPOSAL_NOT_DEPLOYED
x-srpp-change-authorization: DEFERRED_BY_USER_UNTIL_API_READY
