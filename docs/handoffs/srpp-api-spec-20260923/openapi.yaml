          description: 參數、重複參數、未知參數、GET body、view 組合或日期格式不合法。
          headers:
            Cache-Control:
              description: 個人資料不得由中介快取；固定 private, no-store。
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SrppProblem'
        '404':
          description: 查無這個 owner/date/slot/package，或指定來源不可回放；不揭露其他 owner 的 package。
          headers:
            Cache-Control:
              description: 個人資料不得由中介快取；固定 private, no-store。
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SrppProblem'
        '409':
          description: 政策尚未登錄、當輪沒有仍有效的套件、日期/時段與套件不符，或非台股交易日。
          headers:
            Cache-Control:
              description: 個人資料不得由中介快取；固定 private, no-store。
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SrppProblem'
        '500':
          description: 內部錯誤；不得以舊內容假裝成功。
          headers:
            Cache-Control:
              description: 個人資料不得由中介快取；固定 private, no-store。
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SrppProblem'
        '502':
          description: 下游內容格式或來源一致性錯誤；gateway 也可能回 HTML。
          headers:
            Cache-Control:
              description: 個人資料不得由中介快取；固定 private, no-store。
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SrppProblem'
            text/html:
              schema:
                type: string
              example: <html><body>Bad Gateway</body></html>
        '503':
          description: owner、日曆、producer 或必要資料尚未就緒；不得同步現抓。
          headers:
            Cache-Control:
              description: 個人資料不得由中介快取；固定 private, no-store。
              schema:
                type: string
                const: private, no-store
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SrppProblem'
        '405':
          description: 同 exact path 的非 GET method。
          headers:
            Allow:
              schema:
                type: string
                const: GET
          content:
            text/html:
              schema:
                type: string
        '504':
          description: Nginx upstream timeout；沿用現有 gateway 的 HTML 契約。
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    SrppSha256:
      type: string
      description: 64 位小寫 SHA-256。
      pattern: ^[0-9a-f]{64}$
    SrppDecimal:
      type: string
      description: Canonical Decimal 字串；無千分位、指數、前導零、尾端零或負零。計算精度及捨入依公式版本，不因傳輸而另行四捨五入。
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]*[1-9])?$
      maxLength: 80
      not:
        const: '-0'
    SrppId:
      type: string
      description: 不透明識別值；數字型 DB id 也以字串傳輸。
      minLength: 1
      maxLength: 128
    SrppMetric:
      type: object
      additionalProperties: false
      description: 計算完整性與經濟確定性不同：預估配息仍為 ESTIMATE；未知不能用 0。
      properties:
        value:
          anyOf:
          - $ref: '#/components/schemas/SrppDecimal'
          - type: 'null'
        unit:
          type: string
          description: ''
          enum:
          - TWD
          - RATIO
          - NATIVE_PRICE
          - POINT
        quality:
          type: string
          description: ''
          enum:
          - EXACT
          - ESTIMATE
          - UPPER_BOUND
          - LOWER_BOUND
          - UNAVAILABLE
        reasonCodes:
          type: array
          items:
            type: string
            description: 具名穩定原因碼，不包含帳號、SQL 或例外堆疊。
            pattern: ^[A-Z][A-Z0-9_]*$
          uniqueItems: true
        sourceIds:
          type: array
          items:
            $ref: '#/components/schemas/SrppId'
          uniqueItems: true
      required:
      - value
      - unit
      - quality
      - reasonCodes
      - sourceIds
      allOf:
      - if:
          properties:
            quality:
              const: UNAVAILABLE
        then:
          properties:
            value:
              type: 'null'
            reasonCodes:
              minItems: 1
        else:
          properties:
            value:
              $ref: '#/components/schemas/SrppDecimal'
            sourceIds:
              minItems: 1
    SrppSource:
      type: object
      additionalProperties: false
      description: AVAILABLE 必須能以 view=evidence 取回同一份不可變來源；revision 代表內容，不是重新查詢時間。
      properties:
        sourceId:
          $ref: '#/components/schemas/SrppId'
        kind:
          type: string
          description: ''
          enum:
          - ASSETS
          - POLICY
          - CALENDAR
          - DAILY_BARS
          - CORPORATE_ACTIONS
          - ETF_COMPONENTS
          - TEN_YEAR_HISTORY
          - BOND_FORWARD_YIELDS
          - TAX_INPUTS
        state:
          type: string
          description: ''
          enum:
          - AVAILABLE
          - MISSING
        revision:
          anyOf:
          - $ref: '#/components/schemas/SrppId'
          - type: 'null'
        capturedAt:
          anyOf:
          - type: string
            description: RFC3339，必須含時區；輸出 UTC 或 +08:00。
            format: date-time
          - type: 'null'
        dataAsOf:
          anyOf:
          - type: string
            description: RFC3339，必須含時區；輸出 UTC 或 +08:00。
            format: date-time
          - type: 'null'
        bodySha256:
          anyOf:
          - $ref: '#/components/schemas/SrppSha256'
          - type: 'null'
        reasonCodes:
          type: array
          items:
            type: string
            description: 具名穩定原因碼，不包含帳號、SQL 或例外堆疊。
            pattern: ^[A-Z][A-Z0-9_]*$
          uniqueItems: true
      required:
      - sourceId
      - kind
      - state
      - revision
      - capturedAt
      - dataAsOf
      - bodySha256
      - reasonCodes
      allOf:
      - if:
          properties:
            state:
              const: AVAILABLE
        then:
          properties:
            revision:
              $ref: '#/components/schemas/SrppId'
            capturedAt:
              type: string
              description: RFC3339，必須含時區；輸出 UTC 或 +08:00。
              format: date-time
            dataAsOf:
              type: string
              description: RFC3339，必須含時區；輸出 UTC 或 +08:00。
              format: date-time
            bodySha256:
              $ref: '#/components/schemas/SrppSha256'
            reasonCodes:
              maxItems: 0
        else:
          properties:
            revision:
              type: 'null'
            capturedAt:
              type: 'null'
            dataAsOf:
              type: 'null'
            bodySha256:
              type: 'null'
            reasonCodes:
              minItems: 1
    SrppReconciliationCheck:
      type: object
      additionalProperties: false
      description: 八項對帳全部通過才可發布資產模組；容差沿用 asset_reconciliation.reconcile。
      properties:
        name:
          type: string
          description: ''
          enum:
          - snapshot_deposits
          - live_deposits
          - snapshot_funds
          - live_funds
          - snapshot_stocks
          - live_stocks
          - snapshot_total
          - live_total
        detailTwd:
          $ref: '#/components/schemas/SrppDecimal'
        reportedTwd:
          $ref: '#/components/schemas/SrppDecimal'
        differenceTwd:
          $ref: '#/components/schemas/SrppDecimal'
        toleranceTwd:
          $ref: '#/components/schemas/SrppDecimal'
        passed:
          type: boolean
          const: true
      required:
      - name
      - detailTwd
      - reportedTwd
      - differenceTwd
      - toleranceTwd
      - passed
    SrppDepositGroup:
      type: object
      additionalProperties: false
      description: amountTwd 已是台幣，不再乘匯率；待付款保留負號。
      properties:
        bankId:
          anyOf:
          - $ref: '#/components/schemas/SrppId'
          - type: 'null'
        bankName:
          anyOf:
          - type: string
            description: ''
          - type: 'null'
        currency:
          type: string
          description: 保留來源代碼；禁止只因銀行資訊為 null 而刪除列。
        depositType:
          type: string
          description: 來源存款產品代碼。
        sourceRowIds:
          type: array
          items:
            $ref: '#/components/schemas/SrppId'
          minItems: 1
          uniqueItems: true
        amountTwd:
          $ref: '#/components/schemas/SrppDecimal'
        originalAmount:
          anyOf:
          - $ref: '#/components/schemas/SrppDecimal'
          - type: 'null'
        estimatedAnnualInterest:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
      required:
      - bankId
      - bankName
      - currency
      - depositType
      - sourceRowIds
      - amountTwd
      - originalAmount
      - estimatedAnnualInterest
    SrppAssetsData:
      type: object
      additionalProperties: false
      description: 基於同一份 assets/latest 來源的對帳與彙總；不是新的資產帳本。
      properties:
        snapshotTotalDeposit:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        snapshotStockValue:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        snapshotFundValue:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        snapshotTotalAssets:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        liveStockValue:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        liveTotalAssets:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        targetPriceComplete:
          type: boolean
        rowCounts:
          type: object
          additionalProperties: false
          description: ''
          properties:
            deposits:
              type: integer
              minimum: 0
              maximum: 1000000
            stocks:
              type: integer
              minimum: 0
              maximum: 1000000
            funds:
              type: integer
              minimum: 0
              maximum: 1000000
          required:
          - deposits
          - stocks
          - funds
        checks:
          type: array
          items:
            $ref: '#/components/schemas/SrppReconciliationCheck'
          minItems: 8
          maxItems: 8
        depositGroups:
          type: array
          items:
            $ref: '#/components/schemas/SrppDepositGroup'
      required:
      - snapshotTotalDeposit
      - snapshotStockValue
      - snapshotFundValue
      - snapshotTotalAssets
      - liveStockValue
      - liveTotalAssets
      - targetPriceComplete
      - rowCounts
      - checks
      - depositGroups
    SrppAllocationRow:
      type: object
      additionalProperties: false
      description: 總曝險的描述性差距；不扣 SRPP 私有短線帳本，不得當成核心可買張數。
      properties:
        assetKey:
          $ref: '#/components/schemas/SrppId'
        market:
          anyOf:
          - type: string
            description: ''
          - type: 'null'
        symbol:
          anyOf:
          - type: string
            description: ''
          - type: 'null'
        sourceHoldingIds:
          type: array
          items:
            $ref: '#/components/schemas/SrppId'
          uniqueItems: true
        exposureTwd:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        currentWeight:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: RATIO
        targetWeight:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: RATIO
        gapWeight:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: RATIO
        gapValueTwd:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
      required:
      - assetKey
      - market
      - symbol
      - sourceHoldingIds
      - exposureTwd
      - currentWeight
      - targetWeight
      - gapWeight
      - gapValueTwd
    SrppAllocationData:
      type: object
      additionalProperties: false
      description: 資產分類與目標由版本化 mapping 決定；未映射不可猜成零目標。
      properties:
        basis:
          type: string
          const: TOTAL_EXPOSURE_REFERENCE
        denominatorTwd:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        shortTermSleeveSeparated:
          type: boolean
          const: false
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SrppAllocationRow'
        unmappedHoldingIds:
          type: array
          items:
            $ref: '#/components/schemas/SrppId'
          uniqueItems: true
      required:
      - basis
      - denominatorTwd
      - shortTermSleeveSeparated
      - rows
      - unmappedHoldingIds
    SrppCashIncomeData:
      type: object
      additionalProperties: false
      description: 來源估計額與可支配現金分列；稅後值必須有正式分類、給付/估計依據及 reference calculator parity。
      properties:
        stockAndEtfDistributions:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        fundDistributions:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        depositInterest:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        sourceAccruedAnnualIncome:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        permanentTermInterestReinvested:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        spendableAnnualGross:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        taiwanIncomeTaxOrRefund:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        usWithholding:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        additionalBasicTax:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        supplementaryNhi:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        afterAllTaxAnnualCashIncome:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        missingIncomeRowIds:
          type: array
          items:
            $ref: '#/components/schemas/SrppId'
          uniqueItems: true
        netCalculationStandard:
          anyOf:
          - type: string
            description: ''
          - type: 'null'
        taxYear:
          type: integer
          minimum: 2000
          maximum: 2200
      required:
      - stockAndEtfDistributions
      - fundDistributions
      - depositInterest
      - sourceAccruedAnnualIncome
      - permanentTermInterestReinvested
      - spendableAnnualGross
      - taiwanIncomeTaxOrRefund
      - usWithholding
      - additionalBasicTax
      - supplementaryNhi
      - afterAllTaxAnnualCashIncome
      - missingIncomeRowIds
      - netCalculationStandard
      - taxYear
    SrppFundingData:
      type: object
      additionalProperties: false
      description: 買前資金基礎；不代表可下單金額，不包含批次分配、成交去重、換股帳本或張數判斷。
      properties:
        basis:
          type: string
          const: BEFORE_PROPOSED_TRADE
        calculationDate:
          type: string
          description: ISO 8601 日期。
          format: date
        snapshotAllCurrencyDepositTwdEquivalent:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        twdTermDeposits:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        twdTotalIncludingNegativeTransit:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        excludedPositiveTransit:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        usdDepositsTwdEquivalent:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        inflationIndex:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: RATIO
        permanentTermFloorNominal:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        totalTwdDepositFloorNominal:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        headroomAboveTotalFloor:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: TWD
        termFloorMet:
          anyOf:
          - type: boolean
          - type: 'null'
        tradingAuthorized:
          type: boolean
          const: false
      required:
      - basis
      - calculationDate
      - snapshotAllCurrencyDepositTwdEquivalent
      - twdTermDeposits
      - twdTotalIncludingNegativeTransit
      - excludedPositiveTransit
      - usdDepositsTwdEquivalent
      - inflationIndex
      - permanentTermFloorNominal
      - totalTwdDepositFloorNominal
      - headroomAboveTotalFloor
      - termFloorMet
      - tradingAuthorized
    SrppKdObservation:
      type: object
      additionalProperties: false
      description: ''
      properties:
        date:
          type: string
          description: ISO 8601 日期。
          format: date
        k:
          anyOf:
          - $ref: '#/components/schemas/SrppDecimal'
          - type: 'null'
        d:
          anyOf:
          - $ref: '#/components/schemas/SrppDecimal'
          - type: 'null'
      required:
      - date
      - k
      - d
    SrppAdjustedClose:
      type: object
      additionalProperties: false
      description: ''
      properties:
        date:
          type: string
          description: ISO 8601 日期。
          format: date
        close:
          $ref: '#/components/schemas/SrppDecimal'
      required:
      - date
      - close
    SrppTechnicalRow:
      type: object
      additionalProperties: false
      description: 只能使用已完成交易日；與盤中雷達指標不同。均線及 KD 基礎各按 formula manifest，不能混用 raw/adjusted。
      properties:
        market:
          type: string
          const: 台股
        symbol:
          type: string
          description: ''
          minLength: 1
        currency:
          type: string
          description: ''
          minLength: 1
        status:
          type: string
          description: ''
          enum:
          - COMPLETE
          - PARTIAL
          - UNAVAILABLE
        reasonCodes:
          type: array
          items:
            type: string
            description: 具名穩定原因碼，不包含帳號、SQL 或例外堆疊。
            pattern: ^[A-Z][A-Z0-9_]*$
          uniqueItems: true
        sourceIds:
          type: array
          items:
            $ref: '#/components/schemas/SrppId'
          uniqueItems: true
        completedSession:
          type: string
          description: ISO 8601 日期。
          format: date
        calculationVersion:
          type: string
          description: ''
          minLength: 1
        adjustmentBasis:
          type: string
          description: ''
          enum:
          - VERIFIED_CASH_ADJUSTED
          - UNVERIFIED
        corporateActionEvidenceComplete:
          type: boolean
        ma5:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: NATIVE_PRICE
        ma20:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: NATIVE_PRICE
        ma60:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: NATIVE_PRICE
        kdLastThreeCompletedSessions:
          type: array
          items:
            $ref: '#/components/schemas/SrppKdObservation'
          maxItems: 3
        adjustedClosesLast20:
          type: array
          items:
            $ref: '#/components/schemas/SrppAdjustedClose'
          maxItems: 20
        highOf20AdjustedCloses:
          allOf:
          - $ref: '#/components/schemas/SrppMetric'
          - properties:
              unit:
                const: NATIVE_PRICE
      required:
      - market
      - symbol
      - currency
      - status
      - reasonCodes
      - sourceIds
      - completedSession
      - calculationVersion
      - adjustmentBasis
      - corporateActionEvidenceComplete
      - ma5
      - ma20
      - ma60
      - kdLastThreeCompletedSessions
      - adjustedClosesLast20
      - highOf20AdjustedCloses
    SrppTechnicalsData:
      type: object
      additionalProperties: false
      description: 固定含持股與已登錄政策的台股目標；缺資料仍須留下該 symbol 的 UNAVAILABLE 列。
      properties:
        market:
          type: string
          const: 台股
        requiredCompletedSession:
          type: string
          description: ISO 8601 日期。
          format: date
        symbolScope:
          type: string
          const: TW_HOLDINGS_UNION_POLICY_TARGETS
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SrppTechnicalRow'
      required:
      - market
      - requiredCompletedSession
      - symbolScope
      - rows
    SrppAssetsModule:
      type: object
      additionalProperties: false
      description: COMPLETE 指本模組欄位覆蓋；不代表投資可執行。
      properties:
        status:
          type: string
          description: ''
          enum:
          - COMPLETE
          - PARTIAL
          - UNAVAILABLE
        reasonCodes:
          type: array
          items:
            type: string
            description: 具名穩定原因碼，不包含帳號、SQL 或例外堆疊。
            pattern: ^[A-Z][A-Z0-9_]*$
          uniqueItems: true
        sourceIds:
          type: array
          items:
