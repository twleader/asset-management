            sourceIds:
              minItems: 1
      - if:
          properties:
            status:
              const: COMPLETE
        then:
          properties:
            reasonCodes:
              maxItems: 0
      - if:
          properties:
            status:
              const: PARTIAL
        then:
          properties:
            reasonCodes:
              minItems: 1
