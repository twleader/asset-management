worker_processes auto;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $request_method $api_allow_header {
        GET "";
        default "GET";
    }

    map $request_method $rescan_allow_header {
        POST "";
        default "POST";
    }

    server {
        listen 9090;
        server_name _;

        resolver 127.0.0.11 valid=10s ipv6=off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
        proxy_next_upstream off;
        proxy_intercept_errors off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /api/quotes {
            add_header Allow $api_allow_header always;
            if ($request_method != GET) { return 405; }
            set $quotes_upstream external-materials-service:8080;
            proxy_pass http://$quotes_upstream$request_uri;
        }

        location = /api/quotes/one {
            add_header Allow $api_allow_header always;
            if ($request_method != GET) { return 405; }
            set $quotes_upstream external-materials-service:8080;
            proxy_pass http://$quotes_upstream$request_uri;
        }

        location = /api/public/market-index {
            add_header Allow $api_allow_header always;
            if ($request_method != GET) { return 405; }
            set $bff_upstream bff:8080;
            proxy_pass http://$bff_upstream$request_uri;
        }

        location = /api/assets/latest {
            add_header Allow $api_allow_header always;
            if ($request_method != GET) { return 405; }
            set $bff_upstream bff:8080;
            proxy_pass http://$bff_upstream$request_uri;
        }

        location = /api/public/exchange-rate/usd-twd {
            add_header Allow $api_allow_header always;
            if ($request_method != GET) { return 405; }
            set $bff_upstream bff:8080;
            proxy_pass http://$bff_upstream$request_uri;
        }

        location = /api/public/crawler-data/rescan {
            add_header Allow $rescan_allow_header always;
            if ($request_method != POST) { return 405; }
            set $bff_upstream bff:8080;
            proxy_pass http://$bff_upstream$request_uri;
        }

        location = /api/public/market-analysis/today {
            add_header Allow $api_allow_header always;
            if ($request_method != GET) { return 405; }
            set $bff_upstream bff:8080;
            proxy_pass http://$bff_upstream$request_uri;
        }

        location = /api/public/portfolio-advice/latest {
            add_header Allow $api_allow_header always;
            if ($request_method != GET) { return 405; }
            set $bff_upstream bff:8080;
            proxy_pass http://$bff_upstream$request_uri;
        }

        location / {
            return 404;
        }
    }
}
