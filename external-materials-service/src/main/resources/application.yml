spring:
  application:
    name: asset-external-materials-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:assetdb}
    username: ${POSTGRES_USER:assetuser}
    password: ${POSTGRES_PASSWORD:assetpass}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  threads:
    virtual:
      enabled: true

server:
  port: 8080

finmind:
  token: ${FINMIND_TOKEN:}

fubon:
  dividend-sync-enabled: ${FUBON_DIVIDEND_SYNC_ENABLED:false}
  stock-push-enabled: ${FUBON_STOCK_PUSH_ENABLED:false}
  technical-indicator-sync-enabled: ${FUBON_TECHNICAL_INDICATOR_SYNC_ENABLED:false}
  enabled: ${FUBON_ENABLED:false}
  base-url: ${FUBON_BASE_URL:http://fubon-broker-service:8080}
  shared-token-path: ${FUBON_SHARED_TOKEN_PATH:/run/secrets/fubon/shared/internal-service-token}
  taiex-index-stream:
    enabled: ${FUBON_TAIEX_INDEX_STREAM_ENABLED:false}
    symbol: ${FUBON_TAIEX_INDEX_SYMBOL:}

asset:
  internal:
    # Must match business-services; never store the credential in source control.
    treasury-token: ${INTERNAL_TREASURY_TOKEN:}

# 本地財經新聞爬蟲（Task 149.21）：每日 08:20/11:30/18:00（Asia/Taipei，早上 06→08 Task 177、08→08:20 Task 184；
# 中午 12:00→11:30 Task 188）抓權威來源＋證交所公開資訊＋量化快照（匯率/美股/韓股）寫入 news_headline，供
# business-services 今日股市分析餵入 prompt。retention-days=保留天數（清理更舊者）；enabled=false 可整體停用。
# export-enabled（Task 177）：每輪抓取另輸出一份公開資訊 JSON 供 SRPP 退休規劃專案取用；false 可只寫 DB、不輸出檔。
# 輸出**目錄**（Task 212）已改為 DB 驅動：容器基底 EXPORT_OUTPUT_DIR（見下）resolve crawler_export_setting 的相對
# 子路徑，由「爬蟲資訊查詢」頁設定、免重啟生效；原寫死的 export-dir（/srpp-input）已移除。
news-scraper:
  enabled: ${NEWS_SCRAPER_ENABLED:true}
  retention-days: ${NEWS_SCRAPER_RETENTION_DAYS:30}
  export-enabled: ${NEWS_EXPORT_ENABLED:true}

# 韓股參考個股抓取（Task 185）：每日 16:00（Asia/Taipei）＋開機 warmup 抓三星電子 005930／SK 海力士 000660
# 收盤寫入 foreign_stock_daily_history，供公開資訊爬蟲組韓股快照（KOSPI 大盤另讀既有 us_index_daily_history）。
# enabled=false 可停用（韓股快照則僅剩 KOSPI）。
kr-stock:
  enabled: ${KR_STOCK_ENABLED:true}

# 油價／金價（Task 202 / Task 337）：本開關同時控制三個排程——
#   1. 每日 06:30（Asia/Taipei）增量補 WTI／Brent／COMEX 黃金前一交易日收盤至 commodity_price_history；
#   2. CME Globex 交易時段內每分鐘更新三標的即時價至 Redis（commodity:spot:*／commodity:session）；
#   3. 收盤後 5 分鐘（17:05 America/New_York）取回當盤收盤價校正、回看 5 天讓結算價修訂落地。
# 供「公開資訊 → 油價金價」KPI 即時卡、十年曲線與 Excel 匯出。十年歷史首補由
# HistoricalBackfillService.startupBackfill 負責；enabled=false 會同時停用上述三者，不只影響每日增量。
commodity:
  enabled: ${COMMODITY_ENABLED:true}

# ETF 淨值／折溢價（Task 214／349）：台股盤中每 2 分鐘打證交所 all_etf.txt（一次回全市場，僅 1 個 request）、
# 美股每日美東 18:30 逐檔問 Yahoo quoteSummary，寫入 Redis price:etfnav:{market}:{code}，
# 供「資產總覽」Excel 匯出與公開 quote API 的淨值／折溢價欄。enabled=false 可停用；停用後該欄留白（不影響其他欄位）。
etf-nav:
  enabled: ${ETF_NAV_ENABLED:true}

logging:
  level:
    com.steven.assets.externalmaterials: INFO
