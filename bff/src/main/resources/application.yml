server:
  port: ${SERVER_PORT:8080}
  # Requirement 28：prod 經 Nginx 終止 TLS，採信 X-Forwarded-Proto/Host，OAuth2 redirect-uri 才會產生正確的 https + 主機
  forward-headers-strategy: framework
  reactive:
    session:
      # session cookie 安全性（Requirement 28）：HttpOnly 防 XSS 竊取；SameSite=Lax 提供 CSRF 基礎防護
      cookie:
        http-only: true
        same-site: lax
        # Secure（Requirement 30）：由 SESSION_COOKIE_SECURE 控制，預設 false。
        # 上 TLS（https）的正式環境設 true 才帶 Secure；dev/純 http 若盲目 true 會讓瀏覽器不回送登入 cookie → 壞掉登入。
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: asset-management-bff
  security:
    oauth2:
      client:
        registration:
          google:
            # placeholder 預設讓 BFF 在未填憑證時仍能啟動（登入需填真實值）；空字串會讓 registration 建構失敗
            client-id: ${GOOGLE_CLIENT_ID:placeholder-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:placeholder-secret}
            scope:
              - openid
              - email
              - profile
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost"
              - "https://localhost"
              - "http://localhost:5173"
              # 正式對外網域（ASUS DDNS）：漏列會讓瀏覽器對非 GET 請求（POST/PUT/DELETE/PATCH）帶的
              # Origin header 卡在 Spring Cloud Gateway CorsWebFilter，回 403（無自訂 body），且與
              # Spring Security 的 401 判斷順序不同，難以第一時間聯想到 CORS（Task 401）。
              - "https://asset-management.asuscomm.com"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            # cookie session 需帶 credentials（Requirement 28）；origin 已具名，非萬用
            allowCredentials: true
            maxAge: 3600
      # 停用預設的 metrics-based circuit breaker，保持輕量
      default-filters: []

business-services:
  url: ${BUSINESS_SERVICES_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.steven.assets.bff: INFO
    org.springframework.cloud.gateway: WARN
