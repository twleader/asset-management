      <circle cx="126.5" cy="11.97" r="6.5"/><circle cx="177.1" cy="11.97" r="6.5"/>
      <circle cx="227.7" cy="11.97" r="6.5"/><circle cx="278.3" cy="11.97" r="6.5"/>
    </g>
    <g id="star-row-5">
