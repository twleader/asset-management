      <circle cx="151.8" cy="35.91" r="6.5"/><circle cx="202.4" cy="35.91" r="6.5"/>
      <circle cx="253" cy="35.91" r="6.5"/>
    </g>
    <use href="#star-row-6" y="47.88"/>
    <use href="#star-row-5" y="47.88"/>
    <use href="#star-row-6" y="95.76"/>
    <use href="#star-row-5" y="95.76"/>
    <use href="#star-row-6" y="143.64"/>
