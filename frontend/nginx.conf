server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker 內嵌 DNS：動態解析後端容器名，避免 bff 容器重建換 IP 後 nginx 仍用啟動當下快取的舊 IP
    #（舊 IP 常被其他容器 reassign → /api 全部 proxy 到錯容器回 404／或 502，造成「到處沒資料」）。
    # 搭配 proxy_pass 用變數，強制 nginx 走 resolver 在 request 時解析、每 10s 重新整理。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Vue Router (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 即時股價串流：必須關閉 buffering、拉長 read timeout、停用 chunked-transfer 緩衝
    location = /api/market-data/prices/stream {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # Proxy API to BFF layer
    location /api/ {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
