server {
    # 只走 HTTPS，80 不監聽，不提供明文 http 入口。
    listen 443 ssl;
    http2 on;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 自簽憑證：host 沒提供時由 docker-entrypoint-tls.sh 產生 localhost-only 預設值，
    # 對外公網 IP／網域請用 scripts/generate-self-signed-frontend-cert.sh 產生後 recreate 容器。
    ssl_certificate     /run/secrets/frontend-tls/fullchain.pem;
    ssl_certificate_key /run/secrets/frontend-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker 內嵌 DNS：動態解析後端容器名，避免 bff 容器重建換 IP 後 nginx 仍用啟動當下快取的舊 IP
    #（舊 IP 常被其他容器 reassign → /api 全部 proxy 到錯容器回 404／或 502，造成「到處沒資料」）。
    # 搭配 proxy_pass 用變數，強制 nginx 走 resolver 在 request 時解析、每 10s 重新整理。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1024;

    # Vue Router (SPA fallback)
    # index.html 一律 no-cache：每次載入都回伺服器以 ETag 驗證（未變回 304、變了回新版），
    # 部署後新 entry chunk 立即生效。否則瀏覽器對「無 Cache-Control 的 HTML」套啟發式快取，
    # 會直接用磁碟舊 index.html 不回驗證 → 一直引用舊 bundle、看不到新功能（即使硬刷也可能卡住）。
    # hashed 靜態資源（js/css…）仍由下方 regex location 套 immutable 長快取，不受影響。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # SSE 即時股價串流：必須關閉 buffering、拉長 read timeout、停用 chunked-transfer 緩衝
    location = /api/market-data/prices/stream {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding on;
    }

    # 指數日線 10 年回補：台股逐月 120 次序列呼叫，實測 250 秒以上（Task 286）。
    # 走預設的 /api/ location 會在第 60 秒被 proxy_read_timeout 切斷回 504，而 business 端仍在背景跑完。
    location = /api/bff/gdp-twse/refresh-index-daily {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
    }

    # 交易日曆可依序同步四份 Drive 檔，每份 rclone 最多 45 秒；此 exact route 不影響其他 API 的 60 秒預算。
    location = /api/bff/trading-calendar/export {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 240s;
        client_max_body_size 20M;
    }

    # Docker 外部 API 只能從 loopback 9090 api-gateway 進入。
    location = /api/quotes { return 404; }
    location = /api/quotes/one { return 404; }
    location = /api/public/market-index { return 404; }
    location = /api/assets/latest { return 404; }
    location = /api/public/exchange-rate/usd-twd { return 404; }
    location = /api/public/crawler-data/rescan { return 404; }
    location = /api/public/market-analysis/today { return 404; }
    location = /api/public/portfolio-advice/latest { return 404; }
    location = /api/public/trading-radar/today { return 404; }
    location = /api/public/trading-radar/stock { return 404; }
    location = /api/public/transactions { return 404; }
    location = /api/public/trading-calendar { return 404; }
    location = /api/public/commodity-prices { return 404; }

    # 連每個 segment 帶 matrix parameter 的變體也擋下，避免 WebFlux 解析後命中 controller。
    location ~ "^/api(?:;[^/]*)?/(?:quotes(?:;[^/]*)?(?:/one(?:;[^/]*)?)?|public(?:;[^/]*)?/(?:market-index(?:;[^/]*)?|exchange-rate(?:;[^/]*)?/usd-twd(?:;[^/]*)?|crawler-data(?:;[^/]*)?/rescan(?:;[^/]*)?|market-analysis(?:;[^/]*)?/today(?:;[^/]*)?|portfolio-advice(?:;[^/]*)?/latest(?:;[^/]*)?|trading-radar(?:;[^/]*)?/(?:today|stock)(?:;[^/]*)?|transactions(?:;[^/]*)?|trading-calendar(?:;[^/]*)?|commodity-prices(?:;[^/]*)?)|assets(?:;[^/]*)?/latest(?:;[^/]*)?)$" {
        return 404;
    }

    # Proxy API to BFF layer
    location /api/ {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # OAuth2 登入流程（Requirement 28）：交給 BFF（reactive Security）。
    # X-Forwarded-Proto/Host 必須透傳，Spring 才會產出正確的 redirect-uri（prod https）。
    #  - /oauth2/authorization/google  觸發登入
    #  - /login/oauth2/code/google     Google callback
    #  - /logout                       清 session
    location /oauth2/ {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location /login/oauth2/ {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /logout {
        set $bff_upstream bff:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
