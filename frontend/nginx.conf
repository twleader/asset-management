# HTTP 維持既有應用路由；本任務不新增強制轉址。
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/includes/frontend-app.conf;
}

# 443 default 必為 loopback identity，避免沒有 public SNI 的連線誤拿 public certificate。
server {
    listen 443 ssl default_server;
    http2 on;
    server_name localhost 127.0.0.1;

    ssl_certificate     /run/frontend-tls/local/fullchain.pem;
    ssl_certificate_key /run/frontend-tls/local/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/includes/frontend-app.conf;
}

# 公網 hostname 只使用 public-trusted certificate source 的 runtime copy。
server {
    listen 443 ssl;
    http2 on;
    server_name asset-management.asuscomm.com;

    ssl_certificate     /run/frontend-tls/public/fullchain.pem;
    ssl_certificate_key /run/frontend-tls/public/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/includes/frontend-app.conf;
}
