  <text x="50" y="42" text-anchor="middle" font-size="9" fill="#8B6914" font-family="serif" font-weight="bold">★</text>

  <!-- 主堆 - 第1層（頂部） -->
  <ellipse cx="50" cy="32" rx="32" ry="9" fill="#7A5C00"/>
  <rect x="18" y="23" width="64" height="9" fill="#7A5C00"/>
  <ellipse cx="50" cy="23" rx="32" ry="9" fill="url(#coinFace2)"/>
  <!-- 頂部高光 -->
  <ellipse cx="43" cy="20" rx="12" ry="4" fill="#FFFDE7" opacity="0.65"/>
