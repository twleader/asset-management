  <!-- 底層左邊散落的硬幣 -->
  <ellipse cx="18" cy="74" rx="14" ry="5" fill="#8B6914"/>
  <rect x="4" y="69" width="28" height="5" fill="#8B6914"/>
  <ellipse cx="18" cy="69" rx="14" ry="5" fill="url(#coinFace)"/>
  <text x="18" y="72" text-anchor="middle" font-size="6" fill="#B8860B" font-family="serif">★</text>

  <!-- 底層右邊散落的硬幣 -->
  <ellipse cx="82" cy="72" rx="14" ry="5" fill="#8B6914"/>
  <rect x="68" y="67" width="28" height="5" fill="#8B6914"/>
  <ellipse cx="82" cy="67" rx="14" ry="5" fill="url(#coinFace)"/>
  <text x="82" y="70" text-anchor="middle" font-size="6" fill="#B8860B" font-family="serif">★</text>

  <!-- 主堆 - 第4層（最底） -->
