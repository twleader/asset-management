  <ellipse cx="44" cy="69" rx="10" ry="3.5" fill="#FFF9C4" opacity="0.5"/>
  <text x="50" y="74" text-anchor="middle" font-size="9" fill="#8B6914" font-family="serif" font-weight="bold">★</text>

  <!-- 主堆 - 第3層 -->
  <ellipse cx="50" cy="64" rx="32" ry="9" fill="#7A5C00"/>
  <rect x="18" y="55" width="64" height="9" fill="#7A5C00"/>
  <ellipse cx="50" cy="55" rx="32" ry="9" fill="url(#coinFace)"/>
  <ellipse cx="44" cy="53" rx="10" ry="3.5" fill="#FFF9C4" opacity="0.5"/>
  <text x="50" y="58" text-anchor="middle" font-size="9" fill="#8B6914" font-family="serif" font-weight="bold">★</text>

  <!-- 主堆 - 第2層 -->
  <ellipse cx="50" cy="48" rx="32" ry="9" fill="#7A5C00"/>
  <rect x="18" y="39" width="64" height="9" fill="#7A5C00"/>
