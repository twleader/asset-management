spring:
  application:
    name: asset-management

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assets}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:assets}
    password: ${DB_PASSWORD:assets}
    hikari:
      maximum-pool-size: 15

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  threads:
    virtual:
      enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # Requirement 28：主要管理者必須由部署環境指定，不提供內建帳號或 fallback。
  admin-email: ${ADMIN_EMAIL}
  internal:
    # Business → external Treasury API shared credential; secret value only comes from runtime env.
    treasury-token: ${INTERNAL_TREASURY_TOKEN:}
  # 配息四日期的一次性歷史回補（Requirement 94 / Task 357.3a、357.3c）。
  # **預設關閉**：enabled=false 時 DividendBackfillStarter 連 bean 都不會建立，
  # 常態啟動完全不受影響。回補時以環境變數開啟並 recreate business-services 觸發，
  # 完成後拿掉旗標再 recreate 一次即回到常態。不新增排程、不新增端點、不新增 9090 路由。
  dividend-backfill:
    enabled: ${DIVIDEND_BACKFILL_ENABLED:false}
    # FinMind 有額度限制（357.3c）：分批 ＋ 批次間停頓。單檔之間的節流沿用
    # external-materials-service 既有的 DividendPersister.syncOne（台股 300ms／美股 500ms）。
    batch-size: ${DIVIDEND_BACKFILL_BATCH_SIZE:10}
    batch-pause-millis: ${DIVIDEND_BACKFILL_BATCH_PAUSE_MILLIS:5000}
    # 續跑進度與稽核帳的落點。必須在容器外（host 家目錄 volume），否則 recreate 後續跑
    # 會退化成整批重跑。
    state-dir: ${DIVIDEND_BACKFILL_STATE_DIR:${EXPORT_OUTPUT_DIR:/home/steven}/dividend-backfill-t357}
    # 前後比對 current-state 的起始年度（357.3b 的修正偵測）。取得夠早即可，不影響抓取範圍。
    since-year: ${DIVIDEND_BACKFILL_SINCE_YEAR:2000}
    # 單檔 /internal/dividend/sync 的等待上限；逾時記成該檔失敗並續跑下一檔。
    request-timeout: ${DIVIDEND_BACKFILL_REQUEST_TIMEOUT:5m}

notification:
  email:
    from: ${NOTIFICATION_FROM:}

external-materials:
  base-url: ${EXTERNAL_MATERIALS_URL:http://external-materials-service:8080}

# Optional Fubon read-only inventory integration. Credentials are read lazily from mounted files;
# disabled or missing-secret mode must not prevent the business service from starting.
fubon:
  enabled: ${FUBON_ENABLED:false}
  base-url: ${FUBON_BASE_URL:http://fubon-broker-service:8080}
  shared-secret-dir: /run/secrets/fubon/shared
  timeout: 30s
  sync-owner-email: ${FUBON_SYNC_OWNER_EMAIL:}

# 今日股市分析（Requirement 31）：Claude Opus 4.8 + 本地新聞（news_headline）。
# （Task 179 起已移除 web_search server tool，新聞固定讀本地 news_headline。）
# api-key 未設定時 MarketAnalysisService 安全跳過（status=NOT_CONFIGURED），不報錯。
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-5}

# 參考新聞政策（Task 149.17 / 149.18）：避免過時、不可信、中港澳新聞當「近期重點」顯示。
# news-max-age-days：publishedAt 早於「分析日 − 此值」即剔除（149.18 由 30 收斂為 5，只看這幾天、越近越重要）；
# news-verify-published-date：是否回抓原文真實發布日覆寫並複驗（治本層，可關）；
# news-region-block-enabled：是否封鎖中港澳來源（只留台/美/日/星，可整體關閉回退）。皆有預設、非必設。
market-analysis:
  news-max-age-days: ${MARKET_ANALYSIS_NEWS_MAX_AGE_DAYS:5}
  news-verify-published-date: ${MARKET_ANALYSIS_NEWS_VERIFY_PUBLISHED_DATE:true}
  news-region-block-enabled: ${MARKET_ANALYSIS_NEWS_REGION_BLOCK_ENABLED:true}

# 交易雷達結果快照（Requirement 48）：每次頁面計算把結果存為 per-owner Redis 快照供區間匯出。
# 與即時股價 price:* 共用 256MB / allkeys-lru 的 Redis，故以節流／保留窗／per-owner 筆數硬上限
# 控制 footprint，避免快照量把即時股價快取逐出。三值皆可經環境變數覆寫。
trading-radar:
  snapshot:
    min-interval-minutes: ${TRADING_RADAR_SNAPSHOT_MIN_INTERVAL_MINUTES:5}
    retention-days: ${TRADING_RADAR_SNAPSHOT_RETENTION_DAYS:90}
    max-per-owner: ${TRADING_RADAR_SNAPSHOT_MAX_PER_OWNER:5000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.steven.assets: INFO
