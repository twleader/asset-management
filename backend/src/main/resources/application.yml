spring:
  application:
    name: asset-management

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assets}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:assets}
    password: ${DB_PASSWORD:assets}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  threads:
    virtual:
      enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

notification:
  email:
    from: ${NOTIFICATION_FROM:}

external-materials:
  base-url: ${EXTERNAL_MATERIALS_URL:http://external-materials-service:8080}

# 今日股市分析（Requirement 31）：Claude Opus 4.8 + web_search。
# api-key 未設定時 MarketAnalysisService 安全跳過（status=NOT_CONFIGURED），不報錯。
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.steven.assets: INFO
