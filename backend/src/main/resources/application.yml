spring:
  application:
    name: asset-management

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:assets}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:assets}
    password: ${DB_PASSWORD:assets}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  threads:
    virtual:
      enabled: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  # Requirement 28：主要管理者必須由部署環境指定，不提供內建帳號或 fallback。
  admin-email: ${ADMIN_EMAIL}

notification:
  email:
    from: ${NOTIFICATION_FROM:}

external-materials:
  base-url: ${EXTERNAL_MATERIALS_URL:http://external-materials-service:8080}

# 今日股市分析（Requirement 31）：Claude Opus 4.8 + web_search。
# api-key 未設定時 MarketAnalysisService 安全跳過（status=NOT_CONFIGURED），不報錯。
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}

# 參考新聞政策（Task 149.17 / 149.18）：避免過時、不可信、中港澳新聞當「近期重點」顯示。
# news-max-age-days：publishedAt 早於「分析日 − 此值」即剔除（149.18 由 30 收斂為 5，只看這幾天、越近越重要）；
# news-verify-published-date：是否回抓原文真實發布日覆寫並複驗（治本層，可關）；
# news-region-block-enabled：是否封鎖中港澳來源（只留台/美/日/星，可整體關閉回退）。皆有預設、非必設。
market-analysis:
  news-max-age-days: ${MARKET_ANALYSIS_NEWS_MAX_AGE_DAYS:5}
  news-verify-published-date: ${MARKET_ANALYSIS_NEWS_VERIFY_PUBLISHED_DATE:true}
  news-region-block-enabled: ${MARKET_ANALYSIS_NEWS_REGION_BLOCK_ENABLED:true}

# 交易雷達結果快照（Requirement 48）：每次頁面計算把結果存為 per-owner Redis 快照供區間匯出。
# 與即時股價 price:* 共用 256MB / allkeys-lru 的 Redis，故以節流／保留窗／per-owner 筆數硬上限
# 控制 footprint，避免快照量把即時股價快取逐出。三值皆可經環境變數覆寫。
trading-radar:
  snapshot:
    min-interval-minutes: ${TRADING_RADAR_SNAPSHOT_MIN_INTERVAL_MINUTES:5}
    retention-days: ${TRADING_RADAR_SNAPSHOT_RETENTION_DAYS:90}
    max-per-owner: ${TRADING_RADAR_SNAPSHOT_MAX_PER_OWNER:5000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.steven.assets: INFO
