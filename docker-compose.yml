services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: asset-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asset-net

  # ── Business Services (Spring Boot MVC) ────────────────────
  # Internal only — not exposed to host. BFF is the sole entry point.
  business-services:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asset-business-services
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/snapshots || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── BFF Layer (Spring Cloud Gateway) ───────────────────────
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: asset-bff
    restart: unless-stopped
    environment:
      BUSINESS_SERVICES_URL: http://business-services:8080
    ports:
      - "8080:8080"
    depends_on:
      business-services:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Vue Frontend (Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asset-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - asset-net

networks:
  asset-net:
    name: asset-network
    driver: bridge

volumes:
  postgres_data:
    name: asset-postgres-data
