services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: asset-postgres
    restart: unless-stopped
    # Requirement 53 / Task 252：時區必須用啟動參數設定，**不可只設 TZ 環境變數**——
    # 實測資料目錄的 postgresql.conf 已被 initdb 寫死 `timezone = UTC`（pg_settings.source = configuration file），
    # 環境變數贏不過它。影響範圍是 SQL NOW()／now() 與 timestamptz 的顯示表示法；
    # naive timestamp 欄位的值由應用端寫入，不受此設定影響。
    command: ["postgres", "-c", "timezone=Asia/Taipei", "-c", "log_timezone=Asia/Taipei", "-c", "max_connections=50"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      # Requirement 30：只綁 127.0.0.1（本機工具如 DBeaver/psql 仍可連），不對外部網卡暴露。
      # 容器間走 asset-net 內部網路以 service name postgres:5432 連線，不依賴此 mapping。
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asset-net

  # ── Redis (Cache) ───────────────────────────────────────────
  # 未來作為 backend / BFF 的 cache 層（市場資料、技術指標、配息率…）。
  # 預設只開內部 6379；如需 host 連線除錯可暫時加 ports: ["6379:6379"]。
  redis:
    image: redis:7-alpine
    container_name: asset-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - asset-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Fubon Broker Adapter (Python / official x86_64 SDK) ─────
  # Optional, network-internal and read-only. Process liveness remains healthy when disabled.
  fubon-broker-service:
    platform: linux/amd64
    build:
      context: ./fubon-broker-service
      dockerfile: Dockerfile
    container_name: asset-fubon-broker-service
    restart: unless-stopped
    environment:
      FUBON_ENABLED: ${FUBON_ENABLED:-false}
      FUBON_TW_LIVE_QUOTES_ENABLED: ${FUBON_TW_LIVE_QUOTES_ENABLED:-false}
      FUBON_TAIEX_INDEX_STREAM_ENABLED: ${FUBON_TAIEX_INDEX_STREAM_ENABLED:-false}
      FUBON_TAIEX_INDEX_SYMBOL: ${FUBON_TAIEX_INDEX_SYMBOL:-}
      FUBON_STOCK_PUSH_ENABLED: ${FUBON_STOCK_PUSH_ENABLED:-false}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${FUBON_SECRETS_DIR_HOST:-./secrets/fubon}:/run/secrets/fubon:ro
    networks:
      - asset-net
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/internal/health',timeout=3));
          assert data['status']=='UP'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Yuanta Broker Adapter (Python / SPARK API via pythonnet) ─
  # Optional, network-internal and read-only. Process liveness remains healthy when disabled.
  # No proprietary component is downloaded or bundled by this image — see secrets/yuanta/README.md.
  yuanta-broker-service:
    platform: linux/amd64
    build:
      context: ./yuanta-broker-service
      dockerfile: Dockerfile
    container_name: asset-yuanta-broker-service
    restart: unless-stopped
    environment:
      YUANTA_ENABLED: ${YUANTA_ENABLED:-false}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${YUANTA_SECRETS_DIR_HOST:-./secrets/yuanta}:/run/secrets/yuanta:ro
    networks:
      - asset-net
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/internal/health',timeout=3));
          assert data['status']=='UP'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Business Services (Spring Boot MVC) ────────────────────
  # Internal only — not exposed to host. BFF is the sole entry point.
  business-services:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asset-business-services
    restart: unless-stopped
    environment:
      # Requirement 53 / Task 252：JVM 預設時區。其語意是「沒有顯式指定 ZoneId 的呼叫落在哪裡」——
      # 未設時為 UTC，是全系統唯一沒有人想要的時區（使用者在台灣，三個市場時區則早已全部顯式化：
      # 46 個帶 zone 的 @Scheduled、MarketZones、MarketClock、匯出排程的 TW_ZONE，皆不受本設定影響）。
      # 回退方式：覆寫 APP_TZ 環境變數後 recreate（但 DB 的 v1.79.0 校正需另行手動反向執行）。
      TZ: ${APP_TZ:-Asia/Taipei}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Shared internal-service credential is supplied by the deployment environment only.
      INTERNAL_TREASURY_TOKEN: ${INTERNAL_TREASURY_TOKEN:?請在本機 secret environment 設定 INTERNAL_TREASURY_TOKEN}
      # Task 417 private BFF-to-business error-log ingress.  This deliberately has no treasury fallback.
      API_ERROR_LOG_INGEST_TOKEN: ${API_ERROR_LOG_INGEST_TOKEN:?請在本機 secret environment 設定 API_ERROR_LOG_INGEST_TOKEN}
      # Requirement 28：散佈版的主要管理者由安裝者指定；缺值時 Compose 直接顯示錯誤。
      ADMIN_EMAIL: ${ADMIN_EMAIL:?請在 .env 設定 ADMIN_EMAIL（主要管理者的 Google 帳號）}
      # 讓 rclone 從固定路徑讀取設定，避免依賴 USER/HOME
      RCLONE_CONFIG: /etc/rclone/rclone.conf
      # 警示觸發 email 通知（Requirement 23）：從 .env / host env 透傳
      # MAIL_USERNAME = Gmail 帳號；MAIL_PASSWORD = 16 碼 App Password（非登入密碼）
      # 未設定時 EmailService.isEnabled() 為 false，dispatcher skip 寄信不報錯
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-}
      # 今日股市分析（Requirement 31）：Claude Opus 4.8 + web_search。
      # 未設定 ANTHROPIC_API_KEY 時 MarketAnalysisService 安全跳過（status=NOT_CONFIGURED），不報錯。
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      FUBON_ENABLED: ${FUBON_ENABLED:-false}
      FUBON_TW_LIVE_QUOTES_ENABLED: ${FUBON_TW_LIVE_QUOTES_ENABLED:-false}
      FUBON_INVENTORY_SYNC_ENABLED: ${FUBON_INVENTORY_SYNC_ENABLED:-false}
      FUBON_TRADE_SYNC_ENABLED: ${FUBON_TRADE_SYNC_ENABLED:-false}
      FUBON_ETF_HOLDINGS_SYNC_ENABLED: ${FUBON_ETF_HOLDINGS_SYNC_ENABLED:-false}
      FUBON_BANK_BALANCE_SYNC_ENABLED: ${FUBON_BANK_BALANCE_SYNC_ENABLED:-false}
      FUBON_SETTLEMENT_SYNC_ENABLED: ${FUBON_SETTLEMENT_SYNC_ENABLED:-false}
      FUBON_REALIZED_GAIN_SYNC_ENABLED: ${FUBON_REALIZED_GAIN_SYNC_ENABLED:-false}
      FUBON_SYNC_OWNER_EMAIL: ${FUBON_SYNC_OWNER_EMAIL:-}
      FUBON_BASE_URL: http://fubon-broker-service:8080
      MARKET_ANALYSIS_NEWS_MAX_AGE_DAYS: ${MARKET_ANALYSIS_NEWS_MAX_AGE_DAYS:-5}
      MARKET_ANALYSIS_NEWS_VERIFY_PUBLISHED_DATE: ${MARKET_ANALYSIS_NEWS_VERIFY_PUBLISHED_DATE:-true}
      MARKET_ANALYSIS_NEWS_REGION_BLOCK_ENABLED: ${MARKET_ANALYSIS_NEWS_REGION_BLOCK_ENABLED:-true}
      # 歷年資產每日排程自動匯出（Requirement 34 / Task 171）：容器內基底輸出目錄＝主機家目錄根，
      # 對映到下方 volume 的 host 家目錄；使用者於前端檔案總管式選擇器挑選的相對子路徑落於其下。
      EXPORT_OUTPUT_DIR: /home/steven
      # Google Drive 目錄列舉（Requirement 50 / Task 241）：供「爬蟲資訊查詢」頁的 Drive 資料夾樹用。
      # 備份（gdrive-crypt）與輸出（GDriveOutput）共用同一份 rclone.conf 的不同 section。
      GDRIVE_OUTPUT_REMOTE: ${GDRIVE_OUTPUT_REMOTE:-GDriveOutput}
      # 配息四日期的一次性歷史回補（Requirement 94 / Task 357.3a）。**預設 false，常態不啟用**。
      # 這三個 passthrough 存在的唯一理由是：`docker compose up` 只會展開 compose 檔裡出現過的
      # 變數，沒有這幾行就無法用「DIVIDEND_BACKFILL_ENABLED=true docker compose up -d
      # --no-deps --force-recreate business-services」觸發回補（up 不吃 -e）。
      # 回補完成後不需要移除，關著的旗標不改變任何行為。
      DIVIDEND_BACKFILL_ENABLED: ${DIVIDEND_BACKFILL_ENABLED:-false}
      DIVIDEND_BACKFILL_BATCH_SIZE: ${DIVIDEND_BACKFILL_BATCH_SIZE:-10}
      DIVIDEND_BACKFILL_BATCH_PAUSE_MILLIS: ${DIVIDEND_BACKFILL_BATCH_PAUSE_MILLIS:-5000}
      # Task 361.4a-0：同一組 passthrough 缺 STATE_DIR 會讓回補靜默續用上次的 ledger 帳、
      # 誤判整批標的「已跑過」而 no-op。預設值寫死 t357 既有的預設路徑（不可用空字串預設，
      # 空字串會被 Spring 當成明確指定的空路徑覆蓋掉 application.yml 的巢狀預設）。
      # 路徑刻意寫死為 ${EXPORT_OUTPUT_DIR}/dividend-backfill-t357 的展開值——compose 的
      # ${VAR:-default} 無法在 default 裡再套用容器內才解析的 EXPORT_OUTPUT_DIR；日後若
      # 改動上方 EXPORT_OUTPUT_DIR，這一行必須同步。
      DIVIDEND_BACKFILL_STATE_DIR: ${DIVIDEND_BACKFILL_STATE_DIR:-/home/steven/dividend-backfill-t357}
      # 交易雷達「發布到 Blog」（Requirement 102 / Task 366）：Blogger OAuth。沿用既有登入用的
      # GOOGLE_CLIENT_ID／GOOGLE_CLIENT_SECRET（與下方 bff 服務同一組值），不新建第二組 OAuth
      # Client；business 這裡是全新注入點——本功能自己直接呼叫 Google token 端點，不經 BFF 的
      # oauth2Login。APP_PUBLIC_BASE_URL 為本 App 對外可從瀏覽器存取的網域，供組 callback
      # redirect_uri，必須是 https:// 開頭；未設定時 buildAuthorizeUrl() 會擲例外，不影響其餘既有端點。
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-secret}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
    volumes:
      # rclone 設定以 read-only 從 host 掛入。主檔 rclone.conf 含三個 section：
      #   [GoogleDriver]（drive.file，備份底層）／[gdrive-crypt]（加密層，DB 備份用）／
      #   [GDriveOutput]（scope=drive，未加密，匯出檔案同步用）
      # 兩用途共用一檔為使用者明示的決定（原設計為分離兩份以免爬蟲服務取得備份的 crypt 解密密碼）；
      # 取捨為：省下第二份檔案的維護與搬機成本，代價是 external-materials-service 也讀得到備份憑證。
      # 兩個 remote 實測為同一個 Google 帳號（Total/Used 一致），故分離的實際收益本就有限。
      #
      # **掛的是目錄不是單檔**（Task 247.1）：`rclone config` 寫設定是「寫新檔＋rename」的原子替換，
      # 單檔掛載下容器內的舊 inode link count 會歸零（2026-07-28 實測 `stat -c %h` 回 links=0、
      # `cat` 回 ENOENT），該容器整個生命週期的 Drive 同步就全部靜默跳過。
      # **這是常態不是意外**：rclone 每次續期 OAuth token 都會重寫 config，當天 15:30／15:53／16:02
      # 共三次，其中最後一次發生在容器 recreate 之後 1 分鐘內、掛載當場又 dangling——
      # 也就是「去 host 重新授權」對執行中的容器完全無效。目錄掛載下 /etc/rclone/rclone.conf
      # 每次都經目錄查找解析，host 端原子替換後容器內即可讀到新檔（RCLONE_CONFIG 的值刻意不變）。
      # **限縮**：只消除「單檔被替換」造成的 dangling。若 ~/.config/rclone **目錄本身**被替換
      # （mv 重建、還原備份、換機搬設定），掛載仍指向舊目錄 inode，屆時仍須 --force-recreate 容器。
      # **已知副作用**：該目錄下其他檔案會一併以唯讀進入容器——實測另有
      # rclone-gdrive-output.conf（只含 [GDriveOutput] 的舊隔離版本，刻意保留供復原用）與
      # rclone.conf.bak-before-merge。**這不擴大權限面**：共用單一 config 檔的取捨已使兩容器都讀得到
      # 備份憑證，多掛入的兩檔是同一組憑證的舊副本。
      - ${HOME}/.config/rclone:/etc/rclone:ro
      # 排程匯出根目錄：host 家目錄掛入容器 /home/steven（可寫）。
      # 預設對映目前使用者的家目錄；子資料夾 input → 主機家目錄/input。
      - ${EXPORT_OUTPUT_DIR_HOST:-/Users/steven}:/home/steven
      # Task 352: Java sees only the shared service token, never SDK identity/key/PFX files.
      - ${FUBON_SECRETS_DIR_HOST:-./secrets/fubon}/shared:/run/secrets/fubon/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/snapshots || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── External Materials Service ─────────────────────────────
  # 集中所有「向外部抓資料」的邏輯：盤中台股交易雷達每 10 秒富邦→MIS→Yahoo、美／英股每 2 分鐘抓股價寫 Redis、盤後寫
  # stock_price_history、每日抓股利寫 stock_dividend_history。
  # /api/quotes 只經 api-gateway:9090 對 host 提供；其餘 /internal/* 僅 docker network 可達，
  # business-services 透過 docker network 內部呼叫。
  external-materials-service:
    build:
      context: ./external-materials-service
      dockerfile: Dockerfile
    container_name: asset-external-materials-service
    restart: unless-stopped
    environment:
      # Requirement 53 / Task 252：與 business-services 同一個時區基準（見該處說明）。
      # 本服務的市場時間層（MarketClock／TradingDateResolver／ClosePersister 等）全部顯式帶市場 ZoneId，
      # 不受本設定影響；受影響的是 PriceCacheWriter 寫進 Redis 的 updatedAt 這類「牆上時鐘」。
      TZ: ${APP_TZ:-Asia/Taipei}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Must be identical to business-services; never commit the secret value.
      INTERNAL_TREASURY_TOKEN: ${INTERNAL_TREASURY_TOKEN:?請在本機 secret environment 設定 INTERNAL_TREASURY_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FINMIND_TOKEN: ${FINMIND_TOKEN:-}
      FUBON_ENABLED: ${FUBON_ENABLED:-false}
      FUBON_TW_LIVE_QUOTES_ENABLED: ${FUBON_TW_LIVE_QUOTES_ENABLED:-false}
      FUBON_TAIEX_INDEX_STREAM_ENABLED: ${FUBON_TAIEX_INDEX_STREAM_ENABLED:-false}
      FUBON_TAIEX_INDEX_SYMBOL: ${FUBON_TAIEX_INDEX_SYMBOL:-}
      FUBON_DIVIDEND_SYNC_ENABLED: ${FUBON_DIVIDEND_SYNC_ENABLED:-false}
      FUBON_TECHNICAL_INDICATOR_SYNC_ENABLED: ${FUBON_TECHNICAL_INDICATOR_SYNC_ENABLED:-false}
      FUBON_STOCK_PUSH_ENABLED: ${FUBON_STOCK_PUSH_ENABLED:-false}
      FUBON_BASE_URL: http://fubon-broker-service:8080
      FUBON_SHARED_TOKEN_PATH: /run/secrets/fubon/shared/internal-service-token
      NEWS_SCRAPER_ENABLED: ${NEWS_SCRAPER_ENABLED:-true}
      NEWS_SCRAPER_RETENTION_DAYS: ${NEWS_SCRAPER_RETENTION_DAYS:-30}
      NEWS_EXPORT_ENABLED: ${NEWS_EXPORT_ENABLED:-true}
      KR_STOCK_ENABLED: ${KR_STOCK_ENABLED:-true}
      COMMODITY_ENABLED: ${COMMODITY_ENABLED:-true}
      # 公開資訊 JSON 輸出基底（Task 212）：**必須與 business-services 的 EXPORT_OUTPUT_DIR 相同**——
      # 使用者在「爬蟲資訊查詢」頁挑的資料夾是由 business 的 /api/export-schedule/browse 列舉出來的，
      # 兩者基底不一致，就會出現「前端選得到、爬蟲寫不到（或寫去別處）」的同義欄位分歧。
      EXPORT_OUTPUT_DIR: /home/steven
      # Google Drive 輸出（Requirement 50 / Task 241）：本機照寫不變，Drive 只是附加副本。
      # remote 名稱不寫死於程式；程式啟動時把唯讀掛入的設定複製到 /tmp/rclone-output.conf
      # （唯讀掛載會讓 rclone 續期 OAuth token 時寫回失敗而 exit non-zero——實測 token 每次都過期、
      #  每次上傳都會 refresh 並寫回，故可寫副本是必要的，不是保險）。
      GDRIVE_OUTPUT_REMOTE: ${GDRIVE_OUTPUT_REMOTE:-GDriveOutput}
      RCLONE_CONFIG: /etc/rclone/rclone.conf
    volumes:
      # 公開資訊每輪輸出 JSON（Task 177／212）：host 家目錄掛入容器 /home/steven（可寫），與 business-services
      # 同一份掛載。NewsPoller 以 EXPORT_OUTPUT_DIR 為基底、resolve crawler_export_setting 的相對子路徑
      # （seed Project/SRPP/data/input）寫 public_info_<date>.json。
      # Task 212 前為 `${SRPP_INPUT_DIR_HOST:-/Users/steven/Project/SRPP/data/input}:/srpp-input`，
      # 其預設目的地已被本掛載涵蓋（host 落點不變），故移除以免同一目錄有兩個容器路徑。
      - ${EXPORT_OUTPUT_DIR_HOST:-/Users/steven}:/home/steven
      # Drive 輸出用的 rclone 設定（Task 241）：與 business-services 共用同一份主檔的 [GDriveOutput] section。
      # **已知取捨（使用者明示的決定）**：該檔同時含 [GoogleDriver] 的 OAuth refresh token 與
      # [gdrive-crypt] 的 crypt 解密密碼，而本服務是全 stack 唯一對外打第三方的（TWSE／NASDAQ／
      # FinMind／新聞爬蟲）、攻擊面最大，故掛主檔等於讓爬蟲服務也能解密整庫財務備份。
      # 原設計為獨立檔以避免此擴權；改為共用是為省下第二份檔案的維護與搬機成本，且實測兩個
      # remote 為同一 Google 帳號（Total/Used 一致），分離的實際收益本就有限。
      # 若日後要復原隔離：改為目錄掛載後，rclone-gdrive-output.conf 已經在容器內的
      # /etc/rclone/rclone-gdrive-output.conf，**只需把上方 RCLONE_CONFIG 改成該路徑**即可。
      # 不要再另外加一條單檔掛載——那正是本次要根除的 dangling inode 來源（見下方說明）。
      #
      # **掛的是目錄不是單檔**（Task 247.1）：`rclone config` 寫設定是「寫新檔＋rename」的原子替換，
      # 單檔掛載下容器內的舊 inode link count 會歸零（2026-07-28 實測 `stat -c %h` 回 links=0、
      # `cat` 回 ENOENT）。本服務受害尤深——configReady 是啟動時判定一次、失敗後永不重試的旗標，
      # 實測 16:02:25 啟動、16:02:26 讀 config 得 NoSuchFileException，該容器整個生命週期的 Drive
      # 同步就全部靜默跳過，而症狀偽裝成「Drive 好像還在收檔案」（business 上傳的 xlsx 照常出現），
      # 只有爬蟲 JSON 停止更新。
      # **這是常態不是意外**：rclone 每次續期 OAuth token 都會重寫 config，當天三次，最後一次發生在
      # 容器 recreate 之後 1 分鐘內、掛載當場又 dangling——「去 host 重新授權」對執行中的容器完全無效。
      # 目錄掛載下 /etc/rclone/rclone.conf 每次都經目錄查找解析，host 端原子替換後容器內即可讀到新檔
      # （RCLONE_CONFIG 的值刻意不變）。
      # **限縮**：只消除「單檔被替換」造成的 dangling。若 ~/.config/rclone **目錄本身**被替換
      # （mv 重建、還原備份、換機搬設定），掛載仍指向舊目錄 inode，屆時仍須 --force-recreate 容器。
      # **已知副作用**：該目錄下其他檔案會一併以唯讀進入容器——實測另有 rclone-gdrive-output.conf
      # 與 rclone.conf.bak-before-merge。**這不擴大權限面**：上述共用主檔的取捨已使本服務讀得到
      # 備份憑證，多掛入的兩檔是同一組憑證的舊副本。
      - ${HOME}/.config/rclone:/etc/rclone:ro
      # Task 352 secret-layer boundary; Task 353 will consume this token without SDK credentials.
      - ${FUBON_SECRETS_DIR_HOST:-./secrets/fubon}/shared:/run/secrets/fubon/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 本地新聞爬蟲（Task 149.21）寫入的 news_headline 由 business-services 的 Liquibase 建立；
      # 等其 healthy（healthcheck 需 DB／Liquibase 就緒）後再啟動，避免冷啟時 ext 早於建表寫入。
      business-services:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/internal/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── BFF Layer (Spring Cloud Gateway) ───────────────────────
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
      additional_contexts:
        openapi-contract: ./docs/openapi
    container_name: asset-bff
    restart: unless-stopped
    environment:
      # Requirement 53 / Task 252：與其他 JVM 服務同一個時區基準。
      TZ: ${APP_TZ:-Asia/Taipei}
      BUSINESS_SERVICES_URL: http://business-services:8080
      # Task 417 private error-log ingress credential; only BFF and business-services receive it.
      API_ERROR_LOG_INGEST_TOKEN: ${API_ERROR_LOG_INGEST_TOKEN:?請在本機 secret environment 設定 API_ERROR_LOG_INGEST_TOKEN}
      # Gmail OAuth2 登入（Requirement 28）：值由專案 .env 注入；未填時用 placeholder 讓 BFF 仍能啟動
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-secret}
      # Session／代看 cookie Secure 開關（Requirement 30）：目前 nginx 為純 http，維持 false 以免瀏覽器不回送登入 cookie；
      # 正式環境於 Nginx 終止 TLS（https）後設 SESSION_COOKIE_SECURE=true 才帶 Secure。
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      # Task 421／Requirement 143：唯讀掛載 api-gateway 寫入的 Nginx 錯誤 log，供
      # NginxGatewayFailureLogTailer 讀取；BFF 自身不寫入這個磁碟區。
      - nginx_gateway_log:/var/log/nginx-shared:ro
    depends_on:
      business-services:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── External Read-only API Gateway (Nginx) ──────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: asset-api-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      # Task 421／Requirement 143：具名磁碟區落地 Nginx 錯誤 log，供 bff 的
      # NginxGatewayFailureLogTailer 唯讀擷取 Nginx 自己回應的 502（BFF/business-services
      # 重建空窗期間 healthcheck 打中的連線失敗，架構上進不到 BFF 應用程式）。
      - nginx_gateway_log:/var/log/nginx-shared
    depends_on:
      external-materials-service:
        condition: service_healthy
      bff:
        condition: service_healthy
    networks:
      - asset-net
    user: nginx
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/api/public/market-index >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Vue Frontend (Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asset-frontend
    restart: unless-stopped
    environment:
      # Task 252：僅為 nginx access log 可讀性；前端時間顯示由瀏覽器本地時區決定，與此無關。
      TZ: ${APP_TZ:-Asia/Taipei}
      # true 是雙入口 production mode：public/local 來源都必須存在且設定為絕對 host path。
      FRONTEND_PUBLIC_TLS_REQUIRED: ${FRONTEND_PUBLIC_TLS_REQUIRED:-false}
      # 將和 volume source 相同的 interpolation 後 host path 傳給 entrypoint，僅供相對路徑 preflight；不含 secret。
      FRONTEND_PUBLIC_TLS_SOURCE_HOST_PATH: ${FRONTEND_TLS_SECRETS_DIR_HOST:-./secrets/frontend-tls}
      FRONTEND_LOCAL_TLS_SOURCE_HOST_PATH: ${FRONTEND_LOCAL_TLS_SECRETS_DIR_HOST:-./secrets/frontend-local-tls}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # TLS source 一律 read-only；entrypoint 只複製到下方 tmpfs，絕不回寫 host certificate source。
      - ${FRONTEND_TLS_SECRETS_DIR_HOST:-./secrets/frontend-tls}:/run/secrets/frontend-tls-source:ro
      - ${FRONTEND_LOCAL_TLS_SECRETS_DIR_HOST:-./secrets/frontend-local-tls}:/run/secrets/frontend-local-tls-source:ro
    tmpfs:
      - /run/frontend-tls:rw,noexec,nosuid,size=1m
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - asset-net

networks:
  asset-net:
    name: asset-network
    driver: bridge

volumes:
  postgres_data:
    name: asset-postgres-data
  redis_data:
    name: asset-redis-data
  nginx_gateway_log:
    name: asset-nginx-gateway-log
