services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: asset-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - asset-net

  # ── Redis (Cache) ───────────────────────────────────────────
  # 未來作為 backend / BFF 的 cache 層（市場資料、技術指標、配息率…）。
  # 預設只開內部 6379；如需 host 連線除錯可暫時加 ports: ["6379:6379"]。
  redis:
    image: redis:7-alpine
    container_name: asset-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - asset-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Business Services (Spring Boot MVC) ────────────────────
  # Internal only — not exposed to host. BFF is the sole entry point.
  business-services:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asset-business-services
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      # 讓 rclone 從固定路徑讀取設定，避免依賴 USER/HOME
      RCLONE_CONFIG: /etc/rclone/rclone.conf
      # 警示觸發 email 通知（Requirement 23）：從 .env / host env 透傳
      # MAIL_USERNAME = Gmail 帳號；MAIL_PASSWORD = 16 碼 App Password（非登入密碼）
      # 未設定時 EmailService.isEnabled() 為 false，dispatcher skip 寄信不報錯
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOTIFICATION_FROM: ${NOTIFICATION_FROM:-}
    volumes:
      # rclone 設定檔以 read-only 從 host 掛入
      - ${HOME}/.config/rclone/rclone.conf:/etc/rclone/rclone.conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/snapshots || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── External Materials Service ─────────────────────────────
  # 集中所有「向外部抓資料」的邏輯：盤中 2 分鐘抓股價寫 Redis、盤後寫
  # stock_price_history、每日抓股利寫 stock_dividend_history。
  # 不對外暴露；business-services 透過 docker network 內部呼叫 /internal/*。
  external-materials-service:
    build:
      context: ./external-materials-service
      dockerfile: Dockerfile
    container_name: asset-external-materials-service
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FINMIND_TOKEN: ${FINMIND_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/internal/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── BFF Layer (Spring Cloud Gateway) ───────────────────────
  bff:
    build:
      context: ./bff
      dockerfile: Dockerfile
    container_name: asset-bff
    restart: unless-stopped
    environment:
      BUSINESS_SERVICES_URL: http://business-services:8080
    ports:
      - "8080:8080"
    depends_on:
      business-services:
        condition: service_healthy
    networks:
      - asset-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Vue Frontend (Nginx) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asset-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - asset-net

networks:
  asset-net:
    name: asset-network
    driver: bridge

volumes:
  postgres_data:
    name: asset-postgres-data
  redis_data:
    name: asset-redis-data
